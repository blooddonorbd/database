<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>View Certificate · Blood Donor BD</title>
  <link id="dynamicFavicon" rel="icon" type="image/png" href="">

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

  <!-- html2canvas -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <!-- jsPDF (for true A4 PDF export) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <!-- QRCode.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- Google Fonts: Playfair Display (ceremonial serif) + Poppins (body) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;0,800;1,500&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --maroon:#6f0c0c;
      --red:#8f1414;
      --red-soft:#a83232;
      --gold:#b3872f;
      --gold-light:#e3cd94;
      --gold-dark:#8a681f;
      --paper:#fdf8ef;
      --paper-edge:#f6ead2;
      --ink:#2a1a12;
      --muted:#7c6656;
      --hairline:#d9c391;
    }

    *{ margin:0; padding:0; box-sizing:border-box; }

    body{
      margin:0;
      padding:28px 16px;
      background:#3a2020;
      background-image:
        radial-gradient(circle at 20% 15%, rgba(255,255,255,0.04), transparent 45%),
        radial-gradient(circle at 80% 85%, rgba(255,255,255,0.03), transparent 45%),
        linear-gradient(160deg,#41201f,#2a1414 70%);
      display:flex;
      justify-content:center;
      align-items:flex-start;
      min-height:100vh;
      font-family:'Poppins','Segoe UI',sans-serif;
    }

    .certificate-container{ max-width:1180px; width:100%; text-align:center; }

    /* ---------- On-page chrome (not part of the printed certificate) ---------- */
    .certificate-info{
      background:var(--paper);
      padding:22px 26px;
      border-radius:14px 14px 0 0;
      text-align:left;
      border-bottom:1px solid var(--hairline);
    }
    .certificate-info h3{
      color:var(--maroon);
      margin-bottom:14px;
      display:flex;
      align-items:center;
      gap:10px;
      font-weight:600;
      font-size:1.05rem;
    }
    .info-row{ display:flex; padding:8px 0; border-bottom:1px solid #f0e4c9; font-size:0.92rem; }
    .info-row:last-child{ border-bottom:none; }
    .info-label{ width:150px; font-weight:600; color:var(--muted); }
    .info-value{ flex:1; color:var(--ink); }

    .certificate-preview{
      background:#2a1414;
      border-radius:0 0 14px 14px;
      overflow:hidden;
      margin-bottom:18px;
      padding:26px 18px;
      box-shadow:0 24px 48px rgba(0,0,0,0.35);
    }
    .certificate-content{ display:flex; justify-content:center; }

    .action-buttons{
      display:flex;
      justify-content:center;
      gap:14px;
      padding:6px 20px 4px;
      flex-wrap:wrap;
    }

    .btn{
      display:inline-flex;
      align-items:center;
      gap:9px;
      margin:6px;
      padding:13px 26px;
      background:linear-gradient(135deg,var(--maroon),var(--red));
      color:#fdf3e4;
      border:none;
      border-radius:8px;
      font-family:'Poppins',sans-serif;
      font-size:0.98rem;
      font-weight:600;
      letter-spacing:0.2px;
      cursor:pointer;
      transition:transform .15s ease, box-shadow .15s ease;
      text-decoration:none;
      box-shadow:0 10px 22px rgba(0,0,0,0.35);
    }
    .btn:hover{ transform:translateY(-2px); box-shadow:0 14px 26px rgba(0,0,0,0.4); }
    .btn:disabled{ opacity:0.55; cursor:not-allowed; transform:none; }

    .btn-outline{
      background:transparent;
      color:var(--gold-light);
      border:1.5px solid var(--gold-dark);
      box-shadow:none;
    }
    .btn-outline:hover{ background:rgba(179,135,47,0.12); }

    .loading{ text-align:center; color:#e9d9c4; padding:60px; font-size:1.1rem; }

    .error{
      text-align:left;
      color:#4a1414;
      background:#fbe9e4;
      padding:34px;
      border-radius:14px;
      border-left:5px solid var(--maroon);
    }
    .error h2{ margin-bottom:10px; font-size:1.2rem; }
    .error p{ margin-bottom:16px; }

    /* ============================================================ */
    /*                THE CERTIFICATE ITSELF (A4 landscape)          */
    /* ============================================================ */

    .certificate-a4{
      width:1123px;
      height:794px;
      flex-shrink:0;
      background:
        radial-gradient(circle at 12% 10%, rgba(179,135,47,0.07), transparent 40%),
        radial-gradient(circle at 90% 92%, rgba(143,20,20,0.05), transparent 42%),
        var(--paper);
      position:relative;
      font-family:'Poppins',sans-serif;
      color:var(--ink);
      overflow:hidden;
      box-shadow:0 30px 60px rgba(0,0,0,0.45);
    }

    /* double hairline frame */
    .cert-frame{
      position:absolute;
      inset:18px;
      border:2px solid var(--maroon);
      pointer-events:none;
    }
    .cert-frame::after{
      content:"";
      position:absolute;
      inset:8px;
      border:1px solid var(--gold);
    }

    /* faint centred watermark: shield + drop */
    .cert-watermark{
      position:absolute;
      top:50%; left:50%;
      width:520px; height:520px;
      transform:translate(-50%,-50%);
      opacity:0.045;
      pointer-events:none;
      z-index:0;
    }

    /* corner flourishes */
    .corner{ position:absolute; width:64px; height:64px; z-index:2; pointer-events:none; }
    .corner svg{ width:100%; height:100%; }
    .corner-tl{ top:26px; left:26px; }
    .corner-tr{ top:26px; right:26px; transform:scaleX(-1); }
    .corner-br{ bottom:26px; right:26px; transform:scale(-1,-1); }
    .corner-bl{ bottom:26px; left:26px; transform:scaleY(-1); }

    .cert-inner{
      position:relative;
      z-index:2;
      height:100%;
      padding:46px 78px 34px;
      display:flex;
      flex-direction:column;
    }

    /* ---- letterhead row ---- */
    .letterhead{
      display:flex;
      align-items:center;
      justify-content:space-between;
      margin-bottom:6px;
    }
    .brand-mini{ display:flex; align-items:center; gap:10px; }
    .brand-mini img{
      width:34px; height:34px; object-fit:contain; border-radius:50%;
      border:1px solid var(--gold);
      background:#fff;
    }
    .brand-mini span{
      font-family:'Playfair Display',serif;
      font-weight:700;
      color:var(--maroon);
      font-size:0.95rem;
      letter-spacing:0.5px;
    }
    .cert-meta{ text-align:right; font-size:0.72rem; color:var(--muted); line-height:1.5; }
    .cert-meta b{ color:var(--ink); font-weight:600; }

    /* ---- emblem + title block ---- */
    .emblem-block{ text-align:center; margin-top:2px; }
    .emblem-icon{ width:56px; height:56px; margin:0 auto 6px; }

    .cert-eyebrow{
      font-size:0.68rem;
      color:var(--gold-dark);
      font-variant:small-caps;
      letter-spacing:3px;
      font-weight:600;
    }

    .cert-title{
      font-family:'Playfair Display',serif;
      font-weight:800;
      font-size:2.15rem;
      color:var(--maroon);
      letter-spacing:1px;
      margin-top:2px;
      text-transform:uppercase;
    }

    .rule-orn{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      margin:8px auto 4px;
      width:340px;
    }
    .rule-orn .line{ flex:1; height:1px; background:linear-gradient(90deg,transparent,var(--gold),transparent); }
    .rule-orn svg{ width:14px; height:14px; flex-shrink:0; }

    .cert-sub{
      font-size:0.78rem;
      color:var(--muted);
      font-variant:small-caps;
      letter-spacing:2.5px;
    }

    /* ---- body / recipient ---- */
    .body-block{
      flex:1;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      text-align:center;
      padding:6px 40px 0;
    }

    .presented-to{
      font-family:'Playfair Display',serif;
      font-style:italic;
      font-size:1.05rem;
      color:var(--muted);
      margin-bottom:6px;
    }

    .donor-name{
      font-family:'Playfair Display',serif;
      font-weight:700;
      font-size:3rem;
      color:var(--maroon);
      line-height:1.15;
      margin:2px 0 14px;
      word-break:break-word;
      max-width:100%;
    }

    .narrative{
      max-width:640px;
      font-size:1rem;
      line-height:1.75;
      color:#3d2a1f;
    }
    .narrative .accent{
      color:var(--maroon);
      font-weight:700;
    }

    /* ---- verification strip ---- */
    .verify-strip{
      margin:22px auto 0;
      display:flex;
      align-items:stretch;
      justify-content:center;
      gap:0;
      border-top:1px solid var(--hairline);
      border-bottom:1px solid var(--hairline);
      padding:12px 0;
      max-width:780px;
    }
    .verify-item{
      padding:0 22px;
      border-right:1px solid var(--hairline);
      text-align:center;
    }
    .verify-item:last-child{ border-right:none; }
    .verify-label{
      font-size:0.62rem;
      color:var(--gold-dark);
      font-variant:small-caps;
      letter-spacing:1.5px;
      font-weight:700;
      margin-bottom:3px;
    }
    .verify-value{
      font-size:0.98rem;
      font-weight:700;
      color:var(--ink);
    }
    .verify-value.ok{ color:#3c6b2f; }
    .verify-value.blood{ color:var(--maroon); font-family:'Playfair Display',serif; font-size:1.15rem; }

    /* ---- signature + seal + QR row ---- */
    .foot-row{
      margin-top:26px;
      display:flex;
      align-items:flex-end;
      justify-content:space-between;
      gap:20px;
    }

    .qr-block{ display:flex; align-items:center; gap:12px; width:230px; }
    .qr-container{
      background:#fff;
      padding:5px;
      border:1px solid var(--gold);
      border-radius:6px;
      width:74px; height:74px;
      flex-shrink:0;
    }
    #qrcode{ width:64px; height:64px; }
    #qrcode img{ width:64px !important; height:64px !important; }
    .qr-info{ text-align:left; }
    .qr-title{ font-size:0.72rem; font-weight:700; color:var(--maroon); margin-bottom:2px; }
    .qr-desc{ font-size:0.63rem; color:var(--muted); line-height:1.4; }

    .signature{
      text-align:center;
      display:flex;
      flex-direction:column;
      align-items:center;
      width:230px;
    }
    .e-signature-img{
      max-width:118px;
      height:auto;
      margin-bottom:-4px;
      pointer-events:none;
      -webkit-user-drag:none;
      user-select:none;
    }
    .sig-line{ width:170px; height:1px; background:var(--ink); margin:6px 0 6px; opacity:0.55; }
    .founder-name{ font-weight:700; font-size:0.85rem; color:var(--ink); }
    .founder-title{ font-size:0.7rem; color:var(--muted); }

    .seal-block{ width:230px; display:flex; flex-direction:column; align-items:center; }
    .seal-ring{
      width:82px; height:82px;
      border-radius:50%;
      border:2px solid var(--gold);
      outline:1px solid var(--gold-light);
      outline-offset:3px;
      display:flex; align-items:center; justify-content:center;
      background:#fff;
    }
    .e-seal-img{
      width:66px; height:66px;
      object-fit:contain;
      border-radius:50%;
      pointer-events:none;
      -webkit-user-drag:none;
      user-select:none;
    }
    .seal-caption{ margin-top:6px; font-size:0.68rem; font-weight:600; color:var(--gold-dark); font-variant:small-caps; letter-spacing:1px; }

    .footer-note{
      margin-top:16px;
      padding-top:10px;
      border-top:1px solid var(--hairline);
      text-align:center;
      font-size:0.63rem;
      letter-spacing:0.4px;
      color:var(--muted);
    }

    @media (max-width: 1180px){
      .certificate-a4{ transform-origin:top center; }
    }

    @media print{
      @page{ size:A4 landscape; margin:0; }
      body{ background:#fff; padding:0; }
      .certificate-info, .action-buttons{ display:none !important; }
      .certificate-preview{ box-shadow:none; padding:0; background:#fff; border-radius:0; }
      .certificate-a4{ box-shadow:none; }
    }
  </style>
</head>
<body>
  <div class="certificate-container">
    <div id="certificateDisplay">
      <div class="loading"><i class="fas fa-spinner fa-spin"></i> Loading certificate...</div>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCnky8bzx3KuFoujU5DSlLRYSZgiAF8840",
      authDomain: "blood-donor-bd-2025.firebaseapp.com",
      projectId: "blood-donor-bd-2025",
      storageBucket: "blood-donor-bd-2025.firebasestorage.app",
      messagingSenderId: "271945142840",
      appId: "1:271945142840:web:b0edefddb55cac5f604ccd"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const urlParams = new URLSearchParams(window.location.search);
    const certId = urlParams.get('id');
    const displayDiv = document.getElementById('certificateDisplay');

    let currentCert = null;

    if (!certId) {
      displayDiv.innerHTML = `
        <div class="error">
          <h2><i class="fas fa-exclamation-triangle"></i> No Certificate ID</h2>
          <p>Please provide a valid certificate ID to view.</p>
          <button class="btn btn-outline" onclick="window.location.href='index.html'"><i class="fas fa-home"></i> Go Home</button>
        </div>
      `;
    } else {
      loadCertificate(certId);
    }

    // Reusable corner flourish SVG
    const cornerSvg = `
      <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <path d="M4,4 L4,46 Q4,64 22,64" stroke="#b3872f" stroke-width="2.5" fill="none" stroke-linecap="round"/>
        <path d="M4,4 L46,4 Q64,4 64,22" stroke="#b3872f" stroke-width="2.5" fill="none" stroke-linecap="round"/>
        <circle cx="4" cy="4" r="4.5" fill="#b3872f"/>
      </svg>`;

    // Shield + drop emblem
    const emblemSvg = `
      <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
        <path d="M32 4 L56 13 V29 C56 46 46 56.5 32 60.5 C18 56.5 8 46 8 29 V13 Z" fill="none" stroke="#b3872f" stroke-width="2.4"/>
        <path d="M32 20 C24 32 19.5 38.5 19.5 44.5 C19.5 51.4 25.1 57 32 57 C38.9 57 44.5 51.4 44.5 44.5 C44.5 38.5 40 32 32 20 Z" fill="#6f0c0c"/>
      </svg>`;

    // Watermark version (bigger, on background)
    const watermarkSvg = `
      <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
        <path d="M32 4 L56 13 V29 C56 46 46 56.5 32 60.5 C18 56.5 8 46 8 29 V13 Z" fill="none" stroke="#6f0c0c" stroke-width="1.4"/>
        <path d="M32 20 C24 32 19.5 38.5 19.5 44.5 C19.5 51.4 25.1 57 32 57 C38.9 57 44.5 51.4 44.5 44.5 C44.5 38.5 40 32 32 20 Z" fill="#6f0c0c"/>
      </svg>`;

    const diamondSvg = `<svg viewBox="0 0 10 10" xmlns="http://www.w3.org/2000/svg"><rect x="1" y="1" width="8" height="8" fill="#b3872f" transform="rotate(45 5 5)"/></svg>`;

    function generateCertificateHTML(cert, formattedDate, shortDonorId, donorId) {
      return `
        <div class="certificate-a4" id="certificateElement">
          <div class="cert-watermark">${watermarkSvg}</div>
          <div class="cert-frame"></div>
          <div class="corner corner-tl">${cornerSvg}</div>
          <div class="corner corner-tr">${cornerSvg}</div>
          <div class="corner corner-br">${cornerSvg}</div>
          <div class="corner corner-bl">${cornerSvg}</div>

          <div class="cert-inner">
            <div class="letterhead">
              <div class="brand-mini">
                <img id="certLogo" src="" alt="Blood Donor BD" crossorigin="anonymous" />
                <span>Blood Donor BD</span>
              </div>
              <div class="cert-meta">
                Certificate No. <b>${cert.certificateId}</b><br>
                Issued <b>${formattedDate}</b>
              </div>
            </div>

            <div class="emblem-block">
              <div class="emblem-icon">${emblemSvg}</div>
              <div class="cert-eyebrow">Blood Donor BD</div>
              <div class="cert-title">Certificate of Registration</div>
              <div class="rule-orn"><span class="line"></span>${diamondSvg}<span class="line"></span></div>
              <div class="cert-sub">Life Saver Community</div>
            </div>

            <div class="body-block">
              <div class="presented-to">This is to proudly certify that</div>
              <div class="donor-name">${cert.userName || 'Donor Name'}</div>
              <div class="narrative">
                has registered as a voluntary blood donor with <span class="accent">Blood Donor BD</span>,
                blood group <span class="accent">${cert.bloodGroup || 'N/A'}</span>, and joins a community of
                life savers committed to giving the gift of life to those in need.
              </div>

              <div class="verify-strip">
                <div class="verify-item">
                  <div class="verify-label">Blood Group</div>
                  <div class="verify-value blood">${cert.bloodGroup || 'N/A'}</div>
                </div>
                <div class="verify-item">
                  <div class="verify-label">Donor ID</div>
                  <div class="verify-value">${shortDonorId}</div>
                </div>
                <div class="verify-item">
                  <div class="verify-label">Registered On</div>
                  <div class="verify-value">${formattedDate}</div>
                </div>
                <div class="verify-item">
                  <div class="verify-label">Status</div>
                  <div class="verify-value ok"><i class="fas fa-check-circle"></i> Verified</div>
                </div>
              </div>
            </div>

            <div class="foot-row">
              <div class="qr-block">
                <div class="qr-container"><div id="qrcode"></div></div>
                <div class="qr-info">
                  <div class="qr-title">Official Verification</div>
                  <div class="qr-desc">Scan to verify authenticity<br>Blood Donor BD · Official Registry</div>
                </div>
              </div>

              <div class="signature">
                <img src="https://i.ibb.co/ynZ1skNd/1000010389.png" alt="E-Signature" class="e-signature-img" crossorigin="anonymous" />
                <div class="sig-line"></div>
                <div class="founder-name">Md. Ashfaqur Rahman Tanim</div>
                <div class="founder-title">Founder, Blood Donor BD</div>
              </div>

              <div class="seal-block">
                <div class="seal-ring">
                  <img src="https://i.ibb.co/zhZRkpMG/1000010361.png" alt="Official Seal" class="e-seal-img" crossorigin="anonymous" />
                </div>
                <div class="seal-caption">Official e-Seal</div>
              </div>
            </div>

            <div class="footer-note">
              Certificate ID: ${cert.certificateId} &nbsp;·&nbsp; Donor ID: ${donorId} &nbsp;·&nbsp; Blood Donor BD Official Registry
            </div>
          </div>
        </div>
      `;
    }

    async function loadCertificate(certId) {
      try {
        const doc = await db.collection('certificates').doc(certId).get();

        if (!doc.exists) {
          displayDiv.innerHTML = `
            <div class="error">
              <h2><i class="fas fa-times-circle"></i> Certificate Not Found</h2>
              <p>The certificate ID "${certId}" does not exist.</p>
              <button class="btn btn-outline" onclick="window.location.href='index.html'">Go Home</button>
            </div>
          `;
          return;
        }

        const cert = doc.data();
        currentCert = cert;

        const formattedDate = new Date(cert.issuedDate).toLocaleDateString('en-GB', {
          day: 'numeric', month: 'long', year: 'numeric'
        });

        const donorId = cert.donorId || cert.certificateId.slice(-8);
        const shortDonorId = donorId.length > 12 ? donorId.slice(0, 12) : donorId;

        const verifyUrl = window.location.href;

        const certHTML = `
          <div class="certificate-info">
            <h3><i class="fas fa-check-circle" style="color:#3c6b2f;"></i> Verified Certificate</h3>
            <div class="info-row"><span class="info-label">Certificate ID:</span><span class="info-value">${cert.certificateId}</span></div>
            <div class="info-row"><span class="info-label">Donor Name:</span><span class="info-value">${cert.userName || 'N/A'}</span></div>
            <div class="info-row"><span class="info-label">Donor ID:</span><span class="info-value">${donorId}</span></div>
            <div class="info-row"><span class="info-label">Blood Group:</span><span class="info-value">${cert.bloodGroup || 'N/A'}</span></div>
            <div class="info-row"><span class="info-label">Issued Date:</span><span class="info-value">${formattedDate}</span></div>
            <div class="info-row"><span class="info-label">Issued By:</span><span class="info-value">${cert.issuedByName || 'Blood Donor BD'}</span></div>
            <div class="info-row"><span class="info-label">Status:</span><span class="info-value"><span style="background:#e6f2df;color:#3c6b2f;padding:4px 12px;border-radius:20px;">✓ Valid</span></span></div>
          </div>

          <div class="certificate-preview">
            <div class="certificate-content">
              ${generateCertificateHTML(cert, formattedDate, shortDonorId, donorId)}
            </div>
          </div>

          <div class="action-buttons">
            <button class="btn" id="downloadPngBtn"><i class="fas fa-image"></i> Download PNG (High Quality)</button>
            <button class="btn" id="downloadPdfBtn"><i class="fas fa-file-pdf"></i> Download PDF (A4)</button>
            <button class="btn btn-outline" onclick="window.print()"><i class="fas fa-print"></i> Print</button>
            <button class="btn btn-outline" onclick="window.location.href='index.html'"><i class="fas fa-home"></i> Home</button>
          </div>
        `;

        displayDiv.innerHTML = certHTML;

        // Load dynamic logo / favicon from settings
        try {
          const settingsDoc = await db.collection('settings').doc('website').get();
          if (settingsDoc.exists) {
            const settings = settingsDoc.data();
            if (settings.logoUrl) {
              const certLogo = document.getElementById('certLogo');
              if (certLogo) certLogo.src = settings.logoUrl;
            }
            if (settings.faviconUrl) {
              const favicon = document.getElementById('dynamicFavicon');
              if (favicon) favicon.href = settings.faviconUrl;
            }
          }
        } catch (e) {
          console.warn('Could not load website settings:', e);
        }

        // Generate QR code
        setTimeout(() => {
          const qrContainer = document.getElementById('qrcode');
          if (qrContainer) {
            qrContainer.innerHTML = '';
            try {
              new QRCode(qrContainer, {
                text: verifyUrl,
                width: 64,
                height: 64,
                colorDark: "#6f0c0c",
                colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.H
              });
            } catch (e) {
              console.error('QR Error:', e);
              qrContainer.innerHTML = '<div style="width:64px;height:64px;background:#f0f0f0;display:flex;align-items:center;justify-content:center;font-size:10px;">QR</div>';
            }
          }
        }, 300);

        async function captureCertificate() {
          if (document.fonts && document.fonts.ready) {
            await document.fonts.ready;
          }
          const element = document.getElementById('certificateElement');
          return html2canvas(element, {
            scale: 3,
            backgroundColor: '#fdf8ef',
            allowTaint: true,
            useCORS: true,
            logging: false,
            windowWidth: 1123,
            windowHeight: 794
          });
        }

        const safeName = () => (currentCert.userName || 'Donor').replace(/\s+/g, '_').replace(/\./g, '');

        // PNG download
        document.getElementById('downloadPngBtn').addEventListener('click', async function (e) {
          const btn = e.currentTarget;
          const originalText = btn.innerHTML;
          btn.disabled = true;
          btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Generating...';
          try {
            const canvas = await captureCertificate();
            const link = document.createElement('a');
            link.download = `BloodDonorBD_Certificate_${safeName()}_${certId}.png`;
            link.href = canvas.toDataURL('image/png', 1.0);
            link.click();
          } catch (error) {
            console.error('PNG download error:', error);
            alert('Download failed. Please try the Print option instead.');
          } finally {
            btn.disabled = false;
            btn.innerHTML = originalText;
          }
        });

        // PDF download (true A4 landscape, print-ready)
        document.getElementById('downloadPdfBtn').addEventListener('click', async function (e) {
          const btn = e.currentTarget;
          const originalText = btn.innerHTML;
          btn.disabled = true;
          btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Generating...';
          try {
            const canvas = await captureCertificate();
            const { jsPDF } = window.jspdf;
            const pdf = new jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });
            const imgData = canvas.toDataURL('image/png', 1.0);
            pdf.addImage(imgData, 'PNG', 0, 0, 297, 210, undefined, 'FAST');
            pdf.save(`BloodDonorBD_Certificate_${safeName()}_${certId}.pdf`);
          } catch (error) {
            console.error('PDF download error:', error);
            alert('PDF generation failed. Please try the Print option instead.');
          } finally {
            btn.disabled = false;
            btn.innerHTML = originalText;
          }
        });

      } catch (error) {
        console.error('Error:', error);
        displayDiv.innerHTML = `
          <div class="error">
            <h2><i class="fas fa-exclamation-circle"></i> Error</h2>
            <p>Failed to load certificate: ${error.message}</p>
            <button class="btn btn-outline" onclick="window.location.href='index.html'">Go Home</button>
          </div>
        `;
      }
    }
  </script>
</body>
</html>
