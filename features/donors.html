// Change Profile Picture
// Change Profile Picture (With Crop & Resize)
async function changeProfilePicture() {
  if (!currentUser) {
    Toast.show('Please login first', 'warning');
    return;
  }
  
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/*';
  
  input.onchange = function(e) {
    const file = e.target.files[0];
    if (!file) return;
    
    if (!file.type.match('image.*')) {
      Toast.show('Please select an image file', 'error');
      return;
    }
    
    if (file.size > 10 * 1024 * 1024) {
      Toast.show('Image size must be less than 10MB', 'error');
      return;
    }
    
    // 🔥 PASS FILE TO THE CROPPER
    openImageCropper(file, async (croppedBlob) => {
      try {
        Toast.show('Uploading new profile picture...', 'info');
        
        const formData = new FormData();
        formData.append('image', croppedBlob, 'profile_update.jpg');
        
        const response = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
          method: 'POST',
          body: formData
        });
        
        const data = await response.json();
        
        if (data.success) {
          // Update Firestore with new profile picture URL
          await db.collection('users').doc(currentUser.uid).update({
            profilePic: data.data.url,
            updatedAt: firebase.firestore.FieldValue.serverTimestamp()
          });
          
          // Reload user profile
          await authSystem.loadUserProfile(currentUser.uid);
          
          Toast.show('Profile picture updated successfully!', 'success');
          router.navigate('profile');
        } else {
          throw new Error(data.error?.message || 'Upload failed');
        }
      } catch (error) {
        console.error('Upload error:', error);
        Toast.show('Failed to update profile picture', 'error');
      }
    });
  };
  
  input.click();
}

// Remove Profile Picture
async function removeProfilePicture() {
  if (!currentUser) return;
  
  if (!confirm('Are you sure you want to remove your profile picture?')) return;
  
  try {
    await db.collection('users').doc(currentUser.uid).update({
      profilePic: null,
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    
    await authSystem.loadUserProfile(currentUser.uid);
    Toast.show('Profile picture removed', 'success');
    router.navigate('profile');
  } catch (error) {
    console.error('Error removing picture:', error);
    Toast.show('Failed to remove profile picture', 'error');
  }
}
    // ============================================
// BIRTHDAY COUNTDOWN SYSTEM
// ============================================

function updateBirthdayDisplay() {
  const birthdayDisplay = document.getElementById('birthdayDisplay');
  if (!birthdayDisplay) return;
  
  // Get birthday from userProfile
  const birthdayDate = userProfile?.birthday; // '2005-11-13'
  
  if (!birthdayDate) {
    birthdayDisplay.textContent = 'N/A';
    return;
  }
  
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  
  // Parse birthday from Firebase format 'YYYY-MM-DD'
  const parts = birthdayDate.split('-');
  const birthMonth = parseInt(parts[1]) - 1; // Month is 0-indexed
  const birthDay = parseInt(parts[2]);
  const birthYear = parseInt(parts[0]);
  
  // Get this year's birthday
  let nextBirthday = new Date(today.getFullYear(), birthMonth, birthDay);
  nextBirthday.setHours(0, 0, 0, 0);
  
  // If birthday has passed this year, use next year's birthday
  if (nextBirthday < today) {
    nextBirthday = new Date(today.getFullYear() + 1, birthMonth, birthDay);
    nextBirthday.setHours(0, 0, 0, 0);
  }
  
  // Calculate days until birthday
  const timeDiff = nextBirthday - today;
  const daysUntil = Math.ceil(timeDiff / (1000 * 60 * 60 * 24));
  
  // Calculate turning age
  const turningAge = nextBirthday.getFullYear() - birthYear;
  
  // Determine what to display
  if (daysUntil === 0) {
    // Today is the birthday
    birthdayDisplay.innerHTML = '🎉 Happy Birthday! 🎂';
    birthdayDisplay.style.color = 'var(--dark);';
    birthdayDisplay.style.fontWeight = 'bold';
    birthdayDisplay.style.fontSize = '28px';
  } else if (daysUntil === 1) {
    // Tomorrow is the birthday
    birthdayDisplay.textContent = '🎈 Tomorrow is your birthday!';
    birthdayDisplay.style.color = 'var(--dark);';
    birthdayDisplay.style.fontWeight = '800';
    birthdayDisplay.style.fontSize = '25px';
  } else {
    // Countdown display
    birthdayDisplay.textContent = `🎂 ${daysUntil} days until birthday (turning ${turningAge})`;
    birthdayDisplay.style.color = '';
    birthdayDisplay.style.fontWeight = '';
    birthdayDisplay.style.fontSize = '25px';
  }
}

// ============================================
// SEARCH DONORS WITH PAGINATION
// ============================================

let currentDonorPage = 1;
let donorsPerPage = 24;
let filteredDonors = [];

async function searchDonors(page = 1) {
  const bloodGroup = document.getElementById('searchBloodGroup')?.value || '';
  const district = document.getElementById('searchDistrict')?.value || '';
  const results = document.getElementById('donorResults');
  if (!results) return;
  
  results.innerHTML = '<div class="loading-spinner"><i class="fas fa-spinner fa-spin"></i> Searching...</div>';
  
  try {
    let query = db.collection('users').where('approvalStatus', '==', 'approved').where('isDonor', '==', true);
    if (bloodGroup) query = query.where('bloodGroup', '==', bloodGroup);
    
    const snapshot = await query.get();
    let donors = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
    if (district) donors = donors.filter(d => d.district === district);
    
    filteredDonors = donors;
    
    if (filteredDonors.length === 0) {
      results.innerHTML = '<div class="empty-state"><i class="fas fa-users-slash"></i><p>No approved donors found.</p></div>';
      return;
    }
    
    currentDonorPage = page;
    renderDonorPage(page);
    
  } catch (error) {
    console.error('Search error:', error);
    results.innerHTML = '<div class="empty-state"><i class="fas fa-exclamation-triangle"></i><p>Error searching donors.</p></div>';
  }
}

// ============================================
// GET DONOR ELIGIBILITY STATUS
// ============================================

function getDonorEligibilityStatus(donor) {
  if (!donor.lastDonationDate) {
    return { status: 'eligible', label: '✅ Eligible', color: '#2e7d32', bg: '#e8f5e9' };
  }
  
  const approvalStatus = donor.lastDonationApprovalStatus || 'pending';
  
  if (approvalStatus === 'pending') {
    return { status: 'pending', label: '⏳ Donation Pending', color: '#f57c00', bg: '#fff3e0' };
  }
  
  if (approvalStatus === 'rejected') {
    return { status: 'rejected', label: '❌ Needs Verification', color: '#d32f2f', bg: '#ffebee' };
  }
  
  const lastDate = new Date(donor.lastDonationDate);
  const today = new Date();
  const diffTime = today - lastDate;
  const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
  const waitDays = donor.gender === 'female' ? 120 : 90;
  
  if (diffDays >= waitDays) {
    return { 
      status: 'eligible', 
      label: '✅ Eligible', 
      color: '#2e7d32', 
      bg: '#e8f5e9',
      daysSince: diffDays,
      waitDays: waitDays
    };
  } else {
    const remainingDays = waitDays - diffDays;
    return { 
      status: 'not-eligible', 
      label: `⏳ ${remainingDays} days left`, 
      color: '#f57c00', 
      bg: '#fff3e0',
      daysSince: diffDays,
      waitDays: waitDays,
      remainingDays: remainingDays
    };
  }
}

    donorList.style.gridTemplateColumns = '1fr';
  } else if (window.innerWidth < 768) {
    donorList.style.gridTemplateColumns = 'repeat(2, 1fr)';
  }
  
  // Pagination Controls
  const paginationControls = document.getElementById('paginationControls');
  if (totalPages > 1) {
    let paginationHTML = '';
    
    if (page > 1) {
      paginationHTML += `<button onclick="searchDonors(${page - 1})" class="btn btn-outline" style="padding: 8px 16px; border-radius: 8px;">‹</button>`;
    }
    
    let startPage = Math.max(1, page - 2);
    let endPage = Math.min(totalPages, page + 2);
    
    if (startPage > 1) {
      paginationHTML += `<button onclick="searchDonors(1)" class="btn btn-outline" style="padding: 8px 16px; border-radius: 8px;">1</button>`;
      if (startPage > 2) paginationHTML += `<span style="padding: 8px; color: #999;">…</span>`;
    }
    
    for (let i = startPage; i <= endPage; i++) {
      const isActive = i === page;
      paginationHTML += `<button onclick="searchDonors(${i})" class="btn ${isActive ? 'btn-primary' : 'btn-outline'}" style="padding: 8px 16px; border-radius: 8px; ${isActive ? 'background: #b71c1c; color: white;' : ''}">${i}</button>`;
    }
    
    if (endPage < totalPages) {
      if (endPage < totalPages - 1) paginationHTML += `<span style="padding: 8px; color: #999;">…</span>`;
      paginationHTML += `<button onclick="searchDonors(${totalPages})" class="btn btn-outline" style="padding: 8px 16px; border-radius: 8px;">${totalPages}</button>`;
    }
    
    if (page < totalPages) {
      paginationHTML += `<button onclick="searchDonors(${page + 1})" class="btn btn-outline" style="padding: 8px 16px; border-radius: 8px;">›</button>`;
    }
    
    paginationControls.innerHTML = paginationHTML;
  }
}

    async function renderMyRequestsPage() {
      if (!currentUser) { router.navigate('login'); return; }
      const main = document.getElementById('mainContent');
      main.innerHTML = `<h1 style="margin-bottom: 24px;">My Blood Requests</h1><div id="myRequestsList"></div>`;
      await loadMyRequests();
    }

    async function loadMyRequests() {
      const container = document.getElementById('myRequestsList');
      if (!container) return;
      
      try {
        const snapshot = await db.collection('bloodRequests').where('requesterUid', '==', currentUser.uid).get();
        if (snapshot.empty) {
          container.innerHTML = `<div class="empty-state"><i class="fas fa-clipboard-list"></i><p>No requests found.</p><button onclick="router.navigate('request-blood')" class="btn btn-primary" style="margin-top:16px;">Create Request</button></div>`;
          return;
        }
        
        const requests = [];
        const now = new Date();
        snapshot.forEach(doc => {
            const req = { id: doc.id, ...doc.data() };
            const reqDateStr = req.requiredBy;
            const reqTimeStr = req.requiredTime || '23:59';
            const requiredDateTime = new Date(`${reqDateStr}T${reqTimeStr}`);

            if (requiredDateTime < now) {
                db.collection('bloodRequests').doc(doc.id).delete();
                return;
            }
            requests.push(req);
        });
        
        if (requests.length === 0) {
            container.innerHTML = `<div class="empty-state"><i class="fas fa-clipboard-list"></i><p>No active requests found.</p><button onclick="router.navigate('request-blood')" class="btn btn-primary" style="margin-top:16px;">Create Request</button></div>`;
            return;
        }

        requests.sort((a, b) => (b.createdAt?.toDate?.() || 0) - (a.createdAt?.toDate?.() || 0));
        container.innerHTML = '';
        
        requests.forEach(req => {
          const createdAt = req.createdAt?.toDate?.() || new Date();
          const card = document.createElement('div');
          card.className = 'request-card';
          card.innerHTML = `
            <div class="request-header"><div><h3>${req.patientName}</h3><span class="request-blood-group">${req.bloodGroup}</span></div><span class="badge" style="background:#2e7d32;color:white;padding:4px 12px;border-radius:20px;">Active</span></div>
            <div class="request-details"><div class="request-detail"><i class="fas fa-hospital"></i><span>${req.hospitalName}</span></div><div class="request-detail"><i class="fas fa-flask"></i><span>${req.unitsNeeded} Unit(s)</span></div><div class="request-detail"><i class="fas fa-calendar"></i><span>Required: ${req.requiredBy} ${req.requiredTime || ''}</span></div><div class="request-detail"><i class="fas fa-clock"></i><span>Posted: ${createdAt.toLocaleString()}</span></div></div>
          `;
          container.appendChild(card);
        });
      } catch (error) {
        container.innerHTML = `<div class="empty-state"><i class="fas fa-exclamation-triangle"></i><p>Error: ${error.message}</p><button onclick="router.navigate('request-blood')" class="btn btn-primary" style="margin-top:16px;">Create Request</button></div>`;
      }
    }

    async function loadCertificates() {
      const container = document.getElementById('certificateList');
      if (!userProfile?.isDonor) {
        container.innerHTML = `<div class="empty-state"><i class="fas fa-info-circle"></i><p>Certificates are only available for blood donors.</p></div>`;
        return;
      }
      
      if (userProfile?.approvalStatus !== 'approved') {
        container.innerHTML = `<div class="empty-state"><i class="fas fa-clock"></i><p>Account pending approval. Certificates available after approval.</p></div>`;
        return;
      }
      
      try {
        const certificates = await certificateSystem.loadMyCertificates();
        if (certificates.length === 0) {
          container.innerHTML = `<div class="empty-state"><i class="fas fa-certificate"></i><p>No certificates found.</p></div>`;
          return;
        }
        
        container.innerHTML = '';
        certificates.forEach(cert => {
          const item = document.createElement('div');
          item.className = 'certificate-item';
          item.innerHTML = `
            <div class="certificate-info">
              <div class="certificate-icon"><i class="fas fa-certificate"></i></div>
              <div class="certificate-details">
                <h4>Donor Registration Certificate</h4>
                <p>Certificate ID: ${cert.certificateId}</p>
                <p>Donor ID: ${cert.donorId || 'N/A'}</p>
                <p>Blood Group: ${cert.bloodGroup}</p>
                <p>Issued: ${new Date(cert.issuedDate).toLocaleDateString()}</p>
              </div>
            </div>
            <div class="certificate-actions">
              <button onclick="certificateSystem.viewCertificate('${cert.certificateId}')" class="btn btn-primary"><i class="fas fa-eye"></i> View</button>
              <button onclick="certificateSystem.downloadCertificate('${cert.certificateId}')" class="btn btn-outline"><i class="fas fa-download"></i> Download</button>
            </div>
          `;
          container.appendChild(item);
        });
      } catch (error) {
        container.innerHTML = '<div class="empty-state"><i class="fas fa-exclamation-triangle"></i><p>Error loading certificates.</p></div>';
      }
    }

    async function verifyCertificateInput() {
      const certId = document.getElementById('certIdInput')?.value.trim();
      const resultDiv = document.getElementById('verificationResult');
      
      if (!certId) {
        Toast.show('Please enter a certificate ID', 'warning');
        return;
      }
      
      resultDiv.innerHTML = '<div class="loading-spinner"><i class="fas fa-spinner fa-spin"></i> Verifying...</div>';
      try {
        const doc = await db.collection('certificates').doc(certId).get();
        if (!doc.exists) {
          resultDiv.innerHTML = `<div style="background:#ffebee;padding:16px;border-radius:8px;border-left:4px solid #d32f2f;"><i class="fas fa-times-circle"></i> Certificate not found.</div>`;
          return;
        }
        const cert = doc.data();
        resultDiv.innerHTML = `
          <div style="background:#e8f5e9;padding:16px;border-radius:8px;border-left:4px solid #2e7d32;">
            <i class="fas fa-check-circle" style="color:#2e7d32;"></i> <strong>Certificate Verified!</strong>
            <p style="margin-top:12px;"><strong>Name:</strong> ${cert.userName}</p>
            <p><strong>Blood Group:</strong> ${cert.bloodGroup}</p>
            <p><strong>Donor ID:</strong> ${cert.donorId || 'N/A'}</p>
            <p><strong>Issued:</strong> ${new Date(cert.issuedDate).toLocaleDateString()}</p>
            <button onclick="certificateSystem.viewCertificate('${certId}')" class="btn btn-primary" style="margin-top:12px;"><i class="fas fa-eye"></i> View Certificate</button>
          </div>
        `;
      } catch (error) {
        resultDiv.innerHTML = `<div style="background:#ffebee;padding:16px;border-radius:8px;">Error verifying certificate.</div>`;
      }
    }
