<script>
// ============================================
// OFFLINE MODE - CACHING & SYNC SYSTEM
// ============================================

// Register Service Worker
// Register Service Workers (Both for Web Push and FCM)
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    // 1. Register main service worker for Web Push
    navigator.serviceWorker.register('/sw.js')
      .then(registration => {
        console.log('✅ Main Service Worker registered:', registration);
        
        // Check for updates
        registration.addEventListener('updatefound', () => {
          const newWorker = registration.installing;
          newWorker.addEventListener('statechange', () => {
            if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
              showUpdateNotification();
            }
          });
        });
      })
      .catch(err => {
        console.log('⚠️ Main Service Worker registration failed:', err);
      });
    
    // 2. Register FCM service worker
    navigator.serviceWorker.register('/firebase-messaging-sw.js')
      .then(registration => {
        console.log('✅ FCM Service Worker registered:', registration);
      })
      .catch(err => {
        console.log('⚠️ FCM Service Worker registration failed:', err);
      });
  });
}

// Check for service worker updates
function checkForUpdates(registration) {
  registration.addEventListener('updatefound', () => {
    const newWorker = registration.installing;
    newWorker.addEventListener('statechange', () => {
      if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
        // New version available
        showUpdateNotification();
      }
    });
  });
}

// Show update notification
function showUpdateNotification() {
  const notification = document.createElement('div');
  notification.style.cssText = `
    position: fixed;
    bottom: 100px;
    left: 50%;
    transform: translateX(-50%);
    background: #b71c1c;
    color: white;
    padding: 16px 24px;
    border-radius: 12px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.3);
    z-index: 10001;
    animation: fadeInUp 0.5s ease;
    display: flex;
    align-items: center;
    gap: 16px;
    cursor: pointer;
    max-width: 90%;
  `;
  notification.innerHTML = `
    <i class="fas fa-download" style="font-size: 24px;"></i>
    <div>
      <strong>New Update Available!</strong>
      <p style="font-size: 13px; margin: 0; opacity: 0.8;">Click to reload and get the latest features.</p>
    </div>
    <i class="fas fa-chevron-right"></i>
  `;
  
  notification.addEventListener('click', () => {
    notification.remove();
    window.location.reload();
  });
  
  document.body.appendChild(notification);
  
  // Auto-remove after 30 seconds
  setTimeout(() => {
    if (notification.parentElement) {
      notification.remove();
    }
  }, 30000);
}

// Offline Data Manager
class OfflineDataManager {
  constructor() {
    this.dbName = 'BloodDonorDB';
    this.dbVersion = 1;
    this.db = null;
    this.isOnline = navigator.onLine;
    this.pendingActions = [];
    
    this.initDatabase();
    this.setupListeners();
  }

  // Initialize IndexedDB
  initDatabase() {
    return new Promise((resolve, reject) => {
      const request = indexedDB.open(this.dbName, this.dbVersion);
      
      request.onupgradeneeded = (event) => {
        const db = event.target.result;
        
        // Store for donors
        if (!db.objectStoreNames.contains('donors')) {
          const donorsStore = db.createObjectStore('donors', { keyPath: 'id' });
          donorsStore.createIndex('bloodGroup', 'bloodGroup', { unique: false });
          donorsStore.createIndex('district', 'district', { unique: false });
        }
        
        // Store for blood requests
        if (!db.objectStoreNames.contains('requests')) {
          const requestsStore = db.createObjectStore('requests', { keyPath: 'id' });
          requestsStore.createIndex('status', 'status', { unique: false });
        }
        
        // Store for pending actions
        if (!db.objectStoreNames.contains('pendingActions')) {
          const actionsStore = db.createObjectStore('pendingActions', { 
            keyPath: 'id', 
            autoIncrement: true 
          });
          actionsStore.createIndex('type', 'type', { unique: false });
        }
      };
      
      request.onsuccess = (event) => {
        this.db = event.target.result;
        console.log('📦 Offline database initialized');
        resolve(this.db);
      };
      
      request.onerror = (event) => {
        console.error('❌ Database error:', event.target.error);
        reject(event.target.error);
      };
    });
  }

  // Setup online/offline listeners
  setupListeners() {
    window.addEventListener('online', () => {
      this.isOnline = true;
      this.syncPendingActions();
      Toast.show('🔄 You\'re back online! Syncing data...', 'success');
    });
    
    window.addEventListener('offline', () => {
      this.isOnline = false;
      Toast.show('📡 You\'re offline. Using cached data.', 'warning');
    });
  }

  // Save donors to offline cache
  async cacheDonors(donors) {
    if (!this.db) await this.initDatabase();
    
    const transaction = this.db.transaction(['donors'], 'readwrite');
    const store = transaction.objectStore('donors');
    
    donors.forEach(donor => {
      store.put({ ...donor, _cachedAt: Date.now() });
    });
    
    return new Promise((resolve, reject) => {
      transaction.oncomplete = () => resolve();
      transaction.onerror = () => reject(transaction.error);
    });
  }

  // Get cached donors
  async getCachedDonors(filters = {}) {
    if (!this.db) await this.initDatabase();
    
    return new Promise((resolve, reject) => {
      const transaction = this.db.transaction(['donors'], 'readonly');
      const store = transaction.objectStore('donors');
      const request = store.getAll();
      
      request.onsuccess = () => {
        let donors = request.result;
        
        // Apply filters
        if (filters.bloodGroup) {
          donors = donors.filter(d => d.bloodGroup === filters.bloodGroup);
        }
        if (filters.district) {
          donors = donors.filter(d => d.district === filters.district);
        }
        
        resolve(donors);
      };
      
      request.onerror = () => reject(request.error);
    });
  }

  // Save request to offline cache
  async cacheRequest(requestData) {
    if (!this.db) await this.initDatabase();
    
    const transaction = this.db.transaction(['requests'], 'readwrite');
    const store = transaction.objectStore('requests');
    store.put({ ...requestData, _cachedAt: Date.now() });
    
    return new Promise((resolve, reject) => {
      transaction.oncomplete = () => resolve();
      transaction.onerror = () => reject(transaction.error);
    });
  }

  // Add pending action (will sync when online)
  async addPendingAction(action) {
    if (!this.db) await this.initDatabase();
    
    const transaction = this.db.transaction(['pendingActions'], 'readwrite');
    const store = transaction.objectStore('pendingActions');
    store.add({
      ...action,
      _createdAt: Date.now(),
      _retries: 0
    });
    
    return new Promise((resolve, reject) => {
      transaction.oncomplete = () => {
        // Try to sync immediately if online
        if (this.isOnline) {
          this.syncPendingActions();
        }
        resolve();
      };
      transaction.onerror = () => reject(transaction.error);
    });
  }

  // Sync pending actions when online
  async syncPendingActions() {
    if (!this.isOnline) return;
    if (!this.db) await this.initDatabase();
    
    const transaction = this.db.transaction(['pendingActions'], 'readonly');
    const store = transaction.objectStore('pendingActions');
    const request = store.getAll();
    
    request.onsuccess = async () => {
      const actions = request.result;
      if (actions.length === 0) return;
      
      console.log(`🔄 Syncing ${actions.length} pending actions...`);
      let synced = 0;
      
      for (const action of actions) {
        try {
          await this.executeAction(action);
          // Remove successfully synced action
          const deleteTransaction = this.db.transaction(['pendingActions'], 'readwrite');
          const deleteStore = deleteTransaction.objectStore('pendingActions');
          deleteStore.delete(action.id);
          synced++;
        } catch (error) {
          console.error('Sync failed for action:', action, error);
          // Increment retry count
          const updateTransaction = this.db.transaction(['pendingActions'], 'readwrite');
          const updateStore = updateTransaction.objectStore('pendingActions');
          action._retries = (action._retries || 0) + 1;
          updateStore.put(action);
        }
      }
      
      if (synced > 0) {
        Toast.show(`✅ ${synced} pending actions synced!`, 'success');
      }
    };
  }

  // Execute a pending action
  async executeAction(action) {
    switch (action.type) {
      case 'create_request':
        // Re-create blood request
        await db.collection('bloodRequests').add(action.data);
        break;
      case 'update_profile':
        // Update profile
        await db.collection('users').doc(action.userId).update(action.data);
        break;
      case 'send_message':
        // Send message
        await db.collection('chatMessages').add(action.data);
        break;
      default:
        console.warn('Unknown action type:', action.type);
    }
  }

  // Get offline status
  getOnlineStatus() {
    return this.isOnline;
  }

  // Clear all cached data
  async clearCache() {
    if (!this.db) await this.initDatabase();
    
    const stores = ['donors', 'requests', 'pendingActions'];
    for (const storeName of stores) {
      const transaction = this.db.transaction([storeName], 'readwrite');
      const store = transaction.objectStore(storeName);
      store.clear();
      await new Promise(resolve => transaction.oncomplete = resolve);
    }
    
    Toast.show('🧹 Cache cleared successfully!', 'info');
  }
}

// Initialize Offline Manager
const offlineManager = new OfflineDataManager();

// Override searchDonors to use cache when offline
const originalSearchDonors = searchDonors;
searchDonors = async function(page = 1) {
  const bloodGroup = document.getElementById('searchBloodGroup')?.value || '';
  const district = document.getElementById('searchDistrict')?.value || '';
  const results = document.getElementById('donorResults');
  if (!results) return;
  
  // Check if online
  if (!navigator.onLine) {
    results.innerHTML = '<div class="loading-spinner"><i class="fas fa-wifi"></i> Loading from cache...</div>';
    
    try {
      const cachedDonors = await offlineManager.getCachedDonors({ bloodGroup, district });
      if (cachedDonors.length > 0) {
        filteredDonors = cachedDonors;
        renderDonorPage(1);
        Toast.show('📡 Showing cached donors (offline mode)', 'info');
        return;
      } else {
        results.innerHTML = `
          <div class="empty-state">
            <i class="fas fa-database"></i>
            <p>No cached donors found. Please connect to the internet to search.</p>
          </div>
        `;
        return;
      }
    } catch (error) {
      results.innerHTML = `
        <div class="empty-state">
          <i class="fas fa-exclamation-triangle"></i>
          <p>Error loading cached data. Please connect to the internet.</p>
        </div>
      `;
      return;
    }
  }
  
  // Online: Use original function
  originalSearchDonors(page);
};

// Cache donors when loaded
const originalRenderDonorPage = renderDonorPage;
renderDonorPage = function(page) {
  originalRenderDonorPage(page);
  
  // Cache donors for offline use
  if (navigator.onLine && filteredDonors.length > 0) {
    offlineManager.cacheDonors(filteredDonors)
      .then(() => console.log('💾 Donors cached for offline use'))
      .catch(err => console.error('Cache error:', err));
  }
};

// Modify blood request submission to work offline
const originalRequestSubmit = document.getElementById('bloodRequestForm')?.addEventListener;
if (originalRequestSubmit) {
  // The form submit is already handled in your code
  // We'll add offline support by overriding the submit handler
  document.addEventListener('DOMContentLoaded', () => {
    const form = document.getElementById('bloodRequestForm');
    if (form) {
      const originalSubmit = form.submit;
      form.addEventListener('submit', async (e) => {
        if (!navigator.onLine) {
          e.preventDefault();
          e.stopPropagation();
          
          // Get form data
          const formData = new FormData(form);
          const requestData = {};
          formData.forEach((value, key) => {
            requestData[key] = value;
          });
          
          // Save as pending action
          await offlineManager.addPendingAction({
            type: 'create_request',
            data: {
              ...requestData,
              requesterUid: currentUser?.uid || 'anonymous',
              requesterName: userProfile?.fullName || 'Anonymous',
              status: 'pending_sync',
              createdAt: firebase.firestore.FieldValue.serverTimestamp()
            }
          });
          
          Toast.show('📡 Request saved offline. Will sync when online.', 'success');
          router.navigate('my-requests');
          return false;
        }
        // Online: let the original handler work
        return true;
      }, true);
    }
  });
}

// গ্লোবাল ইমেজ প্রটেকশন
document.addEventListener('contextmenu', function(e) {
    if (e.target.tagName === 'IMG' && 
        (e.target.src.includes('ibb.co') || e.target.src.includes('imgbb'))) {
        e.preventDefault();
        Toast.show('📷 Image download is disabled for privacy', 'warning');
        return false;
    }
});

document.addEventListener('dragstart', function(e) {
    if (e.target.tagName === 'IMG') {
        e.preventDefault();
        return false;
    }
});

// Show offline status indicator
function addOfflineIndicator() {
  const indicator = document.createElement('div');
  indicator.id = 'offlineIndicator';
  indicator.style.cssText = `
    position: fixed;
    top: 60px;
    right: 20px;
    background: #f57c00;
    color: white;
    padding: 8px 16px;
    border-radius: 25px;
    font-size: 13px;
    font-weight: 600;
    z-index: 999;
    box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    display: none;
    align-items: center;
    gap: 8px;
    animation: fadeInUp 0.3s ease;
  `;
  indicator.innerHTML = `<i class="fas fa-wifi-slash"></i> Offline Mode`;
  document.body.appendChild(indicator);
  
  window.addEventListener('online', () => {
    indicator.style.display = 'none';
  });
  
  window.addEventListener('offline', () => {
    indicator.style.display = 'flex';
  });
  
  // Check initial state
  if (!navigator.onLine) {
    indicator.style.display = 'flex';
  }
}

// Add offline indicator on load
document.addEventListener('DOMContentLoaded', addOfflineIndicator);

// Export for debugging
window.offlineManager = offlineManager;
window.clearOfflineCache = () => offlineManager.clearCache();

</script>
