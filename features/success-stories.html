<script>
// ============================================
// TOGGLE COMMENTS ON STORY CARD - আপডেটেড
// ============================================
async function toggleStoryComments(storyId, event) {
  // event স্টপ প্রপাগেশন
  if (event) {
    event.stopPropagation();
  }
  
  // Find the story card by data attribute
  const card = document.querySelector(`.story-card[data-story-id="${storyId}"]`);
  
  if (!card) {
    Toast.show('Please click on the story to view comments', 'info');
    router.navigate(`story-details/${storyId}`);
    return;
  }
  
  let commentsSection = card.querySelector('.story-comments-section');
  
  if (commentsSection) {
    if (commentsSection.style.display === 'none' || commentsSection.style.display === '') {
      commentsSection.style.display = 'block';
      await loadCommentsForCard(storyId, commentsSection);
    } else {
      commentsSection.style.display = 'none';
    }
    return;
  }
  
  commentsSection = document.createElement('div');
  commentsSection.className = 'story-comments-section';
  commentsSection.style.cssText = `
    margin-top: 12px;
    padding-top: 12px;
    border-top: 2px solid #f0f0f0;
    display: block;
    animation: fadeIn 0.3s ease;
  `;
  commentsSection.innerHTML = `
    <div style="text-align: center; padding: 12px; color: #999;">
      <i class="fas fa-spinner fa-spin"></i> Loading comments...
    </div>
  `;
  
  const actionDiv = card.querySelector('div[style*="margin-top: 12px; display: flex; gap: 16px;"]');
  if (actionDiv) {
    actionDiv.after(commentsSection);
  } else {
    card.querySelector('div[style*="padding: 20px;"]').appendChild(commentsSection);
  }
  
  await loadCommentsForCard(storyId, commentsSection);
}

// ============================================
// LOAD COMMENTS FOR CARD - UPDATED WITH PROFILE PICTURES
// ============================================
async function loadCommentsForCard(storyId, container) {
  try {
    const doc = await db.collection('successStories').doc(storyId).get();
    if (!doc.exists) {
      container.innerHTML = `
        <p style="text-align: center; color: #999; font-size: 13px; padding: 12px;">
          <i class="fas fa-exclamation-triangle"></i> Story not found
        </p>
      `;
      return;
    }
    
    const story = doc.data();
    const comments = story.comments || [];
    
    // Get user details for all commenters to show profile pictures
    const commentUsers = {};
    for (const comment of comments) {
      if (comment.userId && !commentUsers[comment.userId]) {
        try {
          const userDoc = await db.collection('users').doc(comment.userId).get();
          if (userDoc.exists) {
            commentUsers[comment.userId] = userDoc.data();
          }
        } catch (e) {
          console.warn('Could not fetch user for comment:', comment.userId);
        }
      }
    }
    
    if (comments.length === 0) {
      container.innerHTML = `
        <p style="text-align: center; color: #999; font-size: 13px; padding: 12px;">
          <i class="fas fa-comment-slash"></i> No comments yet
        </p>
        ${currentUser ? `
          <div style="display: flex; gap: 10px; margin-top: 8px;">
            <input type="text" id="quickComment_${storyId}" placeholder="Write a comment..." 
                   style="flex: 1; padding: 10px 14px; border: 2px solid #e0e0e0; border-radius: 25px; font-size: 13px;"
                   onkeypress="if(event.key==='Enter'){ addQuickComment('${storyId}', event); }">
            <button onclick="addQuickComment('${storyId}', event)" class="btn btn-primary" 
                    style="border-radius: 25px; padding: 10px 20px; font-size: 13px;">
              <i class="fas fa-paper-plane"></i>
            </button>
          </div>
        ` : `
          <button onclick="promptRegistration()" class="btn btn-outline btn-block" style="margin-top: 8px; font-size: 13px; padding: 8px;">
            <i class="fas fa-lock"></i> Login to Comment
          </button>
        `}
      `;
      return;
    }
    
    const sortedComments = [...comments].reverse().slice(0, 3);
    
    container.innerHTML = `
      ${sortedComments.map(comment => {
        // Get user data for this comment
        const userData = comment.userId ? commentUsers[comment.userId] : null;
        
        // Determine avatar URL
        let avatarUrl;
        if (userData && userData.profilePic) {
          avatarUrl = userData.profilePic;
        } else if (userData) {
          // Use gender-based avatar
          const gender = userData.gender || 'male';
          avatarUrl = gender === 'female' 
            ? 'https://i.ibb.co/ZzL8pT3K/1000020380.png' 
            : 'https://i.ibb.co/WNH98LbN/1000020379.png';
        } else {
          // Fallback: use default avatar
          avatarUrl = 'https://i.ibb.co/WNH98LbN/1000020379.png';
        }
        
        const displayName = comment.userName || 'Anonymous';
        const commentDate = comment.createdAt?.toDate?.()?.toLocaleDateString() || '';
        
        return `
          <div style="display: flex; gap: 10px; padding: 8px 0; border-bottom: 1px solid #f0f0f0;">
            <div style="
              width: 32px; 
              height: 32px; 
              border-radius: 50%; 
              overflow: hidden;
              flex-shrink: 0;
              border: 2px solid #b71c1c;
              background: #f0f0f0;
            ">
              <img 
                src="${avatarUrl}" 
                alt="${displayName}" 
                style="width: 100%; height: 100%; object-fit: cover;"
                onerror="this.src='${userData?.gender === 'female' ? 'https://i.ibb.co/ZzL8pT3K/1000020380.png' : 'https://i.ibb.co/WNH98LbN/1000020379.png'}'"
              >
            </div>
            <div style="flex: 1;">
              <div style="display: flex; justify-content: space-between; align-items: center;">
                <strong style="font-size: 13px;">${displayName}</strong>
                <span style="font-size: 10px; color: #999;">${commentDate}</span>
              </div>
              <p style="margin: 2px 0 0; font-size: 13px; color: #444;">${comment.comment}</p>
            </div>
          </div>
        `;
      }).join('')}
      
      ${comments.length > 3 ? `
        <div style="text-align: center; padding: 8px 0;">
          <button onclick="router.navigate('story-details/${storyId}')" 
                  style="background: none; border: none; color: #b71c1c; cursor: pointer; font-weight: 600; font-size: 13px;">
            View all ${comments.length} comments <i class="fas fa-chevron-right"></i>
          </button>
        </div>
      ` : ''}
      
      ${currentUser ? `
        <div style="display: flex; gap: 10px; margin-top: 8px;">
          <input type="text" id="quickComment_${storyId}" placeholder="Write a comment..." 
                 style="flex: 1; padding: 10px 14px; border: 2px solid #e0e0e0; border-radius: 25px; font-size: 13px;"
                 onkeypress="if(event.key==='Enter'){ addQuickComment('${storyId}', event); }">
          <button onclick="addQuickComment('${storyId}', event)" class="btn btn-primary" 
                  style="border-radius: 25px; padding: 10px 20px; font-size: 13px;">
            <i class="fas fa-paper-plane"></i>
          </button>
        </div>
      ` : `
        <button onclick="promptRegistration()" class="btn btn-outline btn-block" style="margin-top: 8px; font-size: 13px; padding: 8px;">
          <i class="fas fa-lock"></i> Login to Comment
        </button>
      `}
    `;
    
  } catch (error) {
    console.error('Error loading comments:', error);
    container.innerHTML = `
      <p style="text-align: center; color: #d32f2f; font-size: 13px; padding: 12px;">
        <i class="fas fa-exclamation-triangle"></i> Failed to load comments
      </p>
    `;
  }
}

// ============================================
// ADD QUICK COMMENT FROM CARD - FIXED
// ============================================
async function addQuickComment(storyId, event) {
  if (event) {
    event.stopPropagation();
  }
  
  if (!currentUser) {
    promptRegistration();
    return;
  }
  
  const input = document.getElementById(`quickComment_${storyId}`);
  if (!input) {
    Toast.show('Comment input not found', 'error');
    return;
  }
  
  const commentText = input.value.trim();
  if (!commentText) {
    Toast.show('Please write a comment', 'warning');
    return;
  }
  
  try {
    const storyRef = db.collection('successStories').doc(storyId);
    const doc = await storyRef.get();
    
    if (!doc.exists) {
      Toast.show('Story not found', 'error');
      return;
    }
    
    const story = doc.data();
    const comments = story.comments || [];
    
    // 🔥 FIX: Use a regular JavaScript timestamp instead of FieldValue.serverTimestamp()
    // This is the key change - serverTimestamp() is NOT allowed inside arrays
    const newComment = {
      id: `c_${Date.now()}_${Math.random().toString(36).substr(2, 6)}`,
      userId: currentUser.uid,
      userName: userProfile.fullName,
      comment: commentText,
      createdAt: new Date().toISOString() // Use ISO string or timestamp number
    };
    
    comments.push(newComment);
    
    // Update the document with the new comments array
    await storyRef.update({
      comments: comments,
      updatedAt: firebase.firestore.FieldValue.serverTimestamp() // This is fine here - it's not inside an array
    });
    
    input.value = '';
    Toast.show('💬 Comment added!', 'success');
    
    // Reload comments for this card
    const card = document.querySelector(`.story-card[data-story-id="${storyId}"]`);
    if (card) {
      const commentsSection = card.querySelector('.story-comments-section');
      if (commentsSection) {
        await loadCommentsForCard(storyId, commentsSection);
      }
    }
    
    // Update comment count in card
    updateCommentCount(storyId, comments.length);
    
  } catch (error) {
    console.error('Error adding comment:', error);
    Toast.show('Failed to add comment: ' + error.message, 'error');
  }
}

// ============================================
// UPDATE COMMENT COUNT IN CARD
// ============================================
function updateCommentCount(storyId, count) {
  const allSpans = document.querySelectorAll(`span[onclick*="toggleStoryComments('${storyId}')"]`);
  allSpans.forEach(span => {
    const countSpan = span.querySelector('span:last-child');
    if (countSpan) {
      countSpan.textContent = count;
    }
  });
}

// ============================================

// ============================================
window.toggleStoryComments = toggleStoryComments;
window.loadCommentsForCard = loadCommentsForCard;
window.addQuickComment = addQuickComment;
window.updateCommentCount = updateCommentCount;

// Global variables
let allStoriesData = [];
let displayedCount = 0;
const STORIES_PER_PAGE = 6;

// Load Stories from Firestore
async function loadAllStories() {
  const grid = document.getElementById('storiesGrid');
  if (!grid) return;

  try {
    const snapshot = await db.collection('successStories')
      .orderBy('createdAt', 'desc')
      .limit(50)
      .get();

    allStoriesData = [];
    snapshot.forEach(doc => {
      const data = doc.data();
      allStoriesData.push({ id: doc.id, ...data });
    });

    // Update stats
    updateStoryStats(allStoriesData);

    // Render
    displayedCount = 0;
    renderStories(allStoriesData);

  } catch (error) {
    console.error('Error loading stories:', error);
    grid.innerHTML = `
      <div style="grid-column: 1 / -1; text-align: center; padding: 60px; color: #d32f2f;">
        <i class="fas fa-exclamation-triangle" style="font-size: 48px;"></i>
        <p>Failed to load stories. Please refresh.</p>
      </div>
    `;
  }
}

// Render Stories
function renderStories(stories) {
  const grid = document.getElementById('storiesGrid');
  const loadMoreContainer = document.getElementById('loadMoreContainer');
  if (!grid) return;

  const start = displayedCount;
  const end = Math.min(start + STORIES_PER_PAGE, stories.length);
  const pageStories = stories.slice(start, end);

  if (displayedCount === 0) {
    grid.innerHTML = '';
  }

  if (pageStories.length === 0 && displayedCount === 0) {
    grid.innerHTML = `
      <div style="grid-column: 1 / -1; text-align: center; padding: 60px; color: #666;">
        <i class="fas fa-heart" style="font-size: 48px; opacity: 0.3;"></i>
        <h3 style="margin: 16px 0;">No Stories Yet</h3>
        <p>Be the first to share your experience!</p>
        <button onclick="openStoryModal()" class="btn btn-primary" style="margin-top: 16px;">
          <i class="fas fa-plus-circle"></i> Share Your Story
        </button>
      </div>
    `;
    return;
  }

  pageStories.forEach(story => {
    const card = createStoryCard(story);
    grid.appendChild(card);
  });

  displayedCount = end;

  if (loadMoreContainer) {
    loadMoreContainer.style.display = displayedCount < stories.length ? 'block' : 'none';
  }
}

// Create Story Card - With Profile Picture (Fixed)
function createStoryCard(story) {

  `;

  // ✅ কার্ডে ক্লিক করলে story-details এ যাবে - আপডেটেড

  if (e.target.closest('span') || e.target.closest('button') || e.target.closest('input') || e.target.closest('textarea') || e.target.closest('form')) {
    return;
  }
  router.navigate(`story-details/${story.id}`);
});

    year: 'numeric',

  // 🔥 PROFILE PICTURE LOGIC
  // ============================================

    avatarUrl = 'https://i.ibb.co/WNH98LbN/1000020379.png';

  } else {
    const gender = story.gender || 'male';
    avatarUrl = gender === 'female' 
      ? 'https://i.ibb.co/ZzL8pT3K/1000020380.png' 
      : 'https://i.ibb.co/WNH98LbN/1000020379.png';
  }

        </span>
        
        ${hasAdminAccess() ? `
          <span class="story-delete-btn" data-story-id="${story.id}" style="cursor: pointer; color: #d32f2f; margin-left: auto; padding: 4px 8px; border-radius: 4px; transition: background 0.2s;">
            <i class="fas fa-trash"></i>
          </span>
        ` : ''}
      </div>
    </div>
  `;

  // ============================================
  // 🔥 ইভেন্ট লিসেনার যোগ করুন (onclick এর পরিবর্তে)
  // ============================================
  
  // Like বাটন
  const likeBtn = card.querySelector('.story-like-btn');
  if (likeBtn) {
    likeBtn.addEventListener('click', function(e) {
      e.stopPropagation();
      const storyId = this.dataset.storyId;
      likeStory(storyId);
    });
  }

  // Comment বাটন
const commentBtn = card.querySelector('.story-comment-btn');
if (commentBtn) {
  commentBtn.addEventListener('click', function(e) {
    e.stopPropagation();
    const storyId = this.dataset.storyId;
    toggleStoryComments(storyId, e);
  });
}

  // Share বাটন
  const shareBtn = card.querySelector('.story-share-btn');
  if (shareBtn) {
    shareBtn.addEventListener('click', function(e) {
      e.stopPropagation();
      const storyId = this.dataset.storyId;
      shareStoryDirect(storyId);
    });
  }

  // Delete বাটন (Admin Only)
  const deleteBtn = card.querySelector('.story-delete-btn');
  if (deleteBtn) {
    deleteBtn.addEventListener('click', function(e) {
      e.stopPropagation();
      const storyId = this.dataset.storyId;
      deleteStory(storyId);
    });
  }

  // ⭐ Hover Effects (কার্ডের ভেতরের স্প্যানগুলোর জন্য)
  card.querySelectorAll('.story-like-btn, .story-comment-btn, .story-share-btn, .story-delete-btn').forEach(el => {
    el.addEventListener('mouseenter', function() {
      this.style.backgroundColor = '#f5f5f5';
    });
    el.addEventListener('mouseleave', function() {
      this.style.backgroundColor = 'transparent';
    });
  });

  return card;
}

// Filter Stories
function filterStories() {
  const bloodGroup = document.getElementById('storyFilterBlood')?.value || '';
  const district = document.getElementById('storyFilterDistrict')?.value || '';
  const sortBy = document.getElementById('storyFilterSort')?.value || 'newest';

  let filtered = [...allStoriesData];

  if (bloodGroup) {
    filtered = filtered.filter(s => s.bloodGroup === bloodGroup);
  }
  if (district) {
    filtered = filtered.filter(s => s.district === district);
  }

  switch (sortBy) {
    case 'newest':
      filtered.sort((a, b) => (b.createdAt?.toDate?.() || 0) - (a.createdAt?.toDate?.() || 0));
      break;
    case 'oldest':
      filtered.sort((a, b) => (a.createdAt?.toDate?.() || 0) - (b.createdAt?.toDate?.() || 0));
      break;
    case 'popular':
      filtered.sort((a, b) => (b.likes || 0) - (a.likes || 0));
      break;
  }

  displayedCount = 0;
  renderStories(filtered);
}

// Load More
function loadMoreStories() {
  renderStories(allStoriesData);
}

// Update Stats
function updateStoryStats(stories) {
  const totalStoriesEl = document.getElementById('totalStories');
  const totalLikesEl = document.getElementById('totalLikes');
  const totalCommentsEl = document.getElementById('totalComments');

  if (totalStoriesEl) {
    totalStoriesEl.textContent = stories.length;
  }
  if (totalLikesEl) {
    const totalLikes = stories.reduce((sum, s) => sum + (s.likes || 0), 0);
    totalLikesEl.textContent = totalLikes;
  }
  if (totalCommentsEl) {
    const totalComments = stories.reduce((sum, s) => sum + (s.comments || []).length, 0);
    totalCommentsEl.textContent = totalComments;
  }
}
