<script>
// ============================================
// 🔐 BIOMETRIC LOCK SYSTEM - COMPLETE
// ============================================

// ----- STATE -----
let biometricLockEnabled = false;
let lastActivityTime = Date.now();
let lockCheckInterval = null;
const LOCK_TIMEOUT = 5 * 60 * 1000; // 5 minutes

// ============================================
// CHECK IF BIOMETRIC IS SUPPORTED
// ============================================

/**
 * Check if browser supports WebAuthn (biometric authentication)
 */
function isBiometricSupported() {
    return window.PublicKeyCredential !== undefined;
}

/**
 * Check if device has biometric sensor available
 */
async function isBiometricAvailable() {
    if (!isBiometricSupported()) return false;
    try {
        return await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable();
    } catch (e) {
        return false;
    }
}

// ============================================
// GET BIOMETRIC DEVICE NAME
// ============================================

/**
 * Detect and return the biometric device name
 */
async function getBiometricDeviceName() {
    try {
        const available = await isBiometricAvailable();
        if (!available) return '❌ Not Available';

        const ua = navigator.userAgent;
        if (/android/i.test(ua)) {
            return '🔒 Android Fingerprint / Face Unlock';
        } else if (/iPhone|iPad|iPod/i.test(ua)) {
            return '🔒 Face ID / Touch ID';
        } else if (/Windows/i.test(ua)) {
            return '🔒 Windows Hello';
        } else if (/Mac/i.test(ua)) {
            return '🔒 Touch ID';
        }
        return '🔒 Biometric Available';
    } catch (e) {
        return '❌ Not Available';
    }
}

// ============================================
// REGISTER BIOMETRIC
// ============================================

/**
 * Register biometric (fingerprint/face) for the current user
 */
async function registerBiometric() {
    if (!currentUser) {
        Toast.show('Please login first', 'warning');
        return false;
    }

    if (!isBiometricSupported()) {
        Toast.show('This browser does not support biometrics. Please use Chrome on Android.', 'error');
        return false;
    }

    const available = await isBiometricAvailable();
    if (!available) {
        Toast.show('No biometric sensor found. Set up fingerprint/face unlock in device settings first.', 'warning');
        return false;
    }

    try {
        Toast.show('🔐 Please place your finger or look at your device...', 'info');

        const challenge = new Uint8Array(32);
        crypto.getRandomValues(challenge);

        const options = {
            publicKey: {
                rp: {
                    id: window.location.hostname,
                    name: 'Blood Donor BD'
                },
                user: {
                    id: new TextEncoder().encode(currentUser.uid),
                    name: userProfile.email || currentUser.uid,
                    displayName: userProfile.fullName || 'Blood Donor'
                },
                challenge: challenge,
                pubKeyCredParams: [
                    { alg: -7, type: 'public-key' },
                    { alg: -257, type: 'public-key' }
                ],
                authenticatorSelection: {
                    authenticatorAttachment: 'platform',
                    residentKey: 'preferred',
                    userVerification: 'required'
                },
                timeout: 60000,
                attestation: 'none'
            }
        };

        const credential = await navigator.credentials.create(options);

        await db.collection('users').doc(currentUser.uid).update({
            biometricCredentialId: credential.id,
            biometricRegisteredAt: firebase.firestore.FieldValue.serverTimestamp(),
            biometricDevice: 'android_biometric'
        });

        localStorage.setItem('biometricRegistered', 'true');
        localStorage.setItem('biometricUserId', currentUser.uid);

        Toast.show('✅ Biometric registered successfully!', 'success');
        updateBiometricLockUI();
        return true;

    } catch (error) {
        console.error('Registration error:', error);
        if (error.name === 'NotAllowedError') {
            Toast.show('❌ Registration cancelled', 'error');
        } else if (error.name === 'NotSupportedError') {
            Toast.show('❌ Biometric not supported on this device', 'error');
        } else {
            Toast.show('❌ Registration failed: ' + error.message, 'error');
        }
        return false;
    }
}

// ============================================
// VERIFY BIOMETRIC
// ============================================

/**
 * Verify biometric (fingerprint/face) for the current user
 */
async function verifyBiometric() {
    if (!currentUser) {
        Toast.show('Please login first', 'warning');
        return false;
    }

    if (!isBiometricSupported()) {
        Toast.show('Browser does not support biometrics.', 'error');
        return false;
    }

    const hasBiometric = localStorage.getItem('biometricRegistered') === 'true' &&
        localStorage.getItem('biometricUserId') === currentUser.uid;

    if (!hasBiometric) {
        Toast.show('Please register biometric first', 'warning');
        return false;
    }

    try {
        const userDoc = await db.collection('users').doc(currentUser.uid).get();
        const userData = userDoc.data();

        if (!userData.biometricCredentialId) {
            Toast.show('Biometric not found. Please register again.', 'warning');
            return false;
        }

        const challenge = new Uint8Array(32);
        crypto.getRandomValues(challenge);

        const options = {
            publicKey: {
                challenge: challenge,
                allowCredentials: [{
                    id: Uint8Array.from(atob(userData.biometricCredentialId), c => c.charCodeAt(0)),
                    type: 'public-key'
                }],
                timeout: 60000,
                userVerification: 'required',
                rpId: window.location.hostname
            }
        };

        await navigator.credentials.get(options);

        Toast.show('✅ Biometric verified!', 'success');
        sessionStorage.setItem('biometricVerified', 'true');
        sessionStorage.setItem('biometricVerifiedTime', Date.now().toString());
        lastActivityTime = Date.now();

        showBiometricSuccess();
        return true;

    } catch (error) {
        console.error('Verification error:', error);
        if (error.name === 'NotAllowedError') {
            Toast.show('❌ Verification cancelled', 'error');
        } else {
            Toast.show('❌ Verification failed', 'error');
        }
        return false;
    }
}

// ============================================
// TOGGLE BIOMETRIC LOCK
// ============================================

/**
 * Enable or disable biometric lock
 */
async function toggleBiometricLock() {
    const toggle = document.getElementById('biometricLockToggle');
    const label = document.getElementById('lockToggleLabel');
    const status = document.getElementById('biometricLockStatus');
    const info = document.getElementById('biometricLockInfo');
    const message = document.getElementById('biometricLockMessage');
    const testBtn = document.getElementById('testBiometricBtn');
    const removeBtn = document.getElementById('removeBiometricLockBtn');

    if (!currentUser) {
        Toast.show('Please login first', 'warning');
        toggle.checked = false;
        return;
    }

    const available = await isBiometricAvailable();
    if (!available) {
        Toast.show('❌ No biometric sensor found on this device. Please set up fingerprint/face unlock in device settings.', 'error');
        toggle.checked = false;
        return;
    }

    const isEnabling = toggle.checked;

    if (isEnabling) {
        const hasBiometric = localStorage.getItem('biometricRegistered') === 'true' &&
            localStorage.getItem('biometricUserId') === currentUser.uid;

        if (!hasBiometric) {
            Toast.show('🔐 Please register your fingerprint/face first', 'info');
            const registered = await registerBiometric();
            if (!registered) {
                toggle.checked = false;
                return;
            }
        }

        Toast.show('🔐 Please verify to enable biometric lock', 'info');
        const verified = await verifyBiometric();
        if (!verified) {
            toggle.checked = false;
            return;
        }

        biometricLockEnabled = true;
        localStorage.setItem('biometricLockEnabled', 'true');
        localStorage.setItem('biometricLockUserId', currentUser.uid);
        lastActivityTime = Date.now();

        label.textContent = '✅ Biometric Lock Enabled';
        status.innerHTML = '<i class="fas fa-circle" style="font-size: 8px; color: #2e7d32;"></i> Active';
        status.className = 'status-badge active';
        info.className = 'status-info show';
        message.textContent = '🔒 Your account is protected. You\'ll need biometric verification after 5 minutes of inactivity.';
        testBtn.style.display = 'inline-flex';
        removeBtn.style.display = 'inline-flex';

        startLockChecker();

        Toast.show('✅ Biometric Lock Enabled!', 'success');

    } else {
        if (!confirm('Disable biometric lock? Your account will no longer require biometric verification.')) {
            toggle.checked = true;
            return;
        }

        biometricLockEnabled = false;
        localStorage.removeItem('biometricLockEnabled');
        localStorage.removeItem('biometricLockUserId');
        sessionStorage.removeItem('biometricVerified');
        sessionStorage.removeItem('biometricVerifiedTime');

        label.textContent = 'Enable Biometric Lock';
        status.innerHTML = '<i class="fas fa-circle" style="font-size: 8px; color: #999;"></i> Inactive';
        status.className = 'status-badge';
        info.className = 'status-info';
        testBtn.style.display = 'none';
        removeBtn.style.display = 'none';

        if (lockCheckInterval) {
            clearInterval(lockCheckInterval);
            lockCheckInterval = null;
        }

        Toast.show('🔓 Biometric Lock Disabled', 'info');
    }
}

// ============================================
// START LOCK CHECKER
// ============================================

/**
 * Start checking for inactivity and lock the app if needed
 */
function startLockChecker() {
    if (lockCheckInterval) {
        clearInterval(lockCheckInterval);
    }

    lockCheckInterval = setInterval(() => {
        if (!biometricLockEnabled) return;
        if (!currentUser) return;

        const now = Date.now();
        const elapsed = now - lastActivityTime;

        if (elapsed >= LOCK_TIMEOUT) {
            const verified = sessionStorage.getItem('biometricVerified') === 'true';
            const verifiedTime = parseInt(sessionStorage.getItem('biometricVerifiedTime') || '0');
            const verifiedElapsed = now - verifiedTime;

            if (!verified || verifiedElapsed > LOCK_TIMEOUT) {
                showBiometricLockScreen();
            }
        }
    }, 10000);
}

// ============================================
// SHOW BIOMETRIC LOCK SCREEN
// ============================================

/**
 * Show the biometric lock screen overlay
 */
function showBiometricLockScreen() {
    if (document.getElementById('biometricLockScreen')) return;

    const overlay = document.createElement('div');
    overlay.id = 'biometricLockScreen';
    overlay.className = 'biometric-lock-screen';

    overlay.innerHTML = `
        <div style="text-align: center; max-width: 400px; width: 100%;">
            <div class="lock-icon">
                <i class="fas fa-fingerprint"></i>
            </div>

            <h2>🔒 Account Locked</h2>
            <p class="sub-text">Verify your identity to continue</p>

            <div class="user-info">
                <span><i class="fas fa-user"></i> ${userProfile?.fullName || 'User'}</span>
                <span><i class="fas fa-clock"></i> Locked for inactivity</span>
            </div>

            <button onclick="unlockWithBiometric()" id="unlockBiometricBtn" class="unlock-btn">
                <i class="fas fa-fingerprint"></i> Verify with Fingerprint / Face
            </button>

            <button onclick="logoutFromLockScreen()" class="logout-btn">
                <i class="fas fa-sign-out-alt"></i> Logout Instead
            </button>

            <div id="unlockStatus" class="unlock-status">
                <i class="fas fa-spinner fa-spin"></i> Waiting for biometric verification...
            </div>
        </div>
    `;

    document.body.appendChild(overlay);

    // Auto-trigger biometric verification
    setTimeout(() => {
        unlockWithBiometric();
    }, 500);
}

// ============================================
// UNLOCK WITH BIOMETRIC
// ============================================

/**
 * Attempt to unlock using biometric verification
 */
async function unlockWithBiometric() {
    const btn = document.getElementById('unlockBiometricBtn');
    const status = document.getElementById('unlockStatus');

    if (!btn || !status) return;

    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Verifying...';
    status.innerHTML = '🔐 Please place your finger or look at your device...';
    status.className = 'unlock-status';

    try {
        const verified = await verifyBiometric();

        if (verified) {
            status.innerHTML = '✅ Verified! Unlocking...';
            status.className = 'unlock-status success';

            lastActivityTime = Date.now();
            sessionStorage.setItem('biometricVerified', 'true');
            sessionStorage.setItem('biometricVerifiedTime', Date.now().toString());

            setTimeout(() => {
                const screen = document.getElementById('biometricLockScreen');
                if (screen) {
                    screen.style.opacity = '0';
                    screen.style.transition = 'opacity 0.5s ease';
                    setTimeout(() => screen.remove(), 500);
                }
                Toast.show('🔓 Unlocked successfully!', 'success');
            }, 500);

        } else {
            status.innerHTML = '❌ Verification failed. Please try again.';
            status.className = 'unlock-status error';
            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-fingerprint"></i> Try Again';
            btn.onclick = () => unlockWithBiometric();
        }

    } catch (error) {
        console.error('Unlock error:', error);
        status.innerHTML = '❌ Error: ' + error.message;
        status.className = 'unlock-status error';
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-fingerprint"></i> Try Again';
        btn.onclick = () => unlockWithBiometric();
    }
}

// ============================================
// LOGOUT FROM LOCK SCREEN
// ============================================

/**
 * Logout from the lock screen
 */
function logoutFromLockScreen() {
    if (confirm('Logout from your account?')) {
        const screen = document.getElementById('biometricLockScreen');
        if (screen) screen.remove();
        if (typeof authSystem !== 'undefined' && authSystem.logout) {
            authSystem.logout();
        }
    }
}

// ============================================
// TEST BIOMETRIC LOCK
// ============================================

/**
 * Test the biometric lock by triggering it manually
 */
function testBiometricLock() {
    if (!biometricLockEnabled) {
        Toast.show('Please enable biometric lock first', 'warning');
        return;
    }

    Toast.show('🔐 Lock test triggered! You\'ll be locked in 5 seconds.', 'info');
    lastActivityTime = Date.now() - LOCK_TIMEOUT + 5000;

    setTimeout(() => {
        showBiometricLockScreen();
    }, 5000);
}

// ============================================
// REMOVE BIOMETRIC LOCK
// ============================================

/**
 * Remove biometric lock and delete biometric data
 */
async function removeBiometricLock() {
    if (!currentUser) return;

    if (!confirm('Remove biometric lock and fingerprint data from your account?')) return;

    try {
        await db.collection('users').doc(currentUser.uid).update({
            biometricCredentialId: firebase.firestore.FieldValue.delete(),
            biometricRegisteredAt: firebase.firestore.FieldValue.delete(),
            biometricDevice: firebase.firestore.FieldValue.delete()
        });

        localStorage.removeItem('biometricRegistered');
        localStorage.removeItem('biometricUserId');
        localStorage.removeItem('biometricLockEnabled');
        localStorage.removeItem('biometricLockUserId');
        sessionStorage.removeItem('biometricVerified');
        sessionStorage.removeItem('biometricVerifiedTime');

        biometricLockEnabled = false;

        if (lockCheckInterval) {
            clearInterval(lockCheckInterval);
            lockCheckInterval = null;
        }

        const toggle = document.getElementById('biometricLockToggle');
        if (toggle) toggle.checked = false;

        Toast.show('✅ Biometric lock removed', 'success');
        updateBiometricLockUI();

    } catch (error) {
        Toast.show('❌ Failed to remove: ' + error.message, 'error');
    }
}

// ============================================
// UPDATE BIOMETRIC LOCK UI
// ============================================

/**
 * Update the biometric lock UI based on current state
 */
function updateBiometricLockUI() {
    const toggle = document.getElementById('biometricLockToggle');
    const label = document.getElementById('lockToggleLabel');
    const status = document.getElementById('biometricLockStatus');
    const info = document.getElementById('biometricLockInfo');
    const message = document.getElementById('biometricLockMessage');
    const testBtn = document.getElementById('testBiometricBtn');
    const removeBtn = document.getElementById('removeBiometricLockBtn');
    const deviceName = document.getElementById('biometricDeviceName');

    if (!toggle) return;

    const isEnabled = localStorage.getItem('biometricLockEnabled') === 'true' &&
        localStorage.getItem('biometricLockUserId') === currentUser?.uid;

    if (isEnabled && currentUser) {
        biometricLockEnabled = true;
        toggle.checked = true;
        label.textContent = '✅ Biometric Lock Enabled';
        status.innerHTML = '<i class="fas fa-circle" style="font-size: 8px; color: #2e7d32;"></i> Active';
        status.className = 'status-badge active';
        info.className = 'status-info show';
        message.textContent = '🔒 Your account is protected. You\'ll need biometric verification after 5 minutes of inactivity.';
        testBtn.style.display = 'inline-flex';
        removeBtn.style.display = 'inline-flex';
        startLockChecker();
    } else {
        biometricLockEnabled = false;
        toggle.checked = false;
        label.textContent = 'Enable Biometric Lock';
        status.innerHTML = '<i class="fas fa-circle" style="font-size: 8px; color: #999;"></i> Inactive';
        status.className = 'status-badge';
        info.className = 'status-info';
        testBtn.style.display = 'none';
        removeBtn.style.display = 'none';
        if (lockCheckInterval) {
            clearInterval(lockCheckInterval);
            lockCheckInterval = null;
        }
    }

    if (deviceName) {
        getBiometricDeviceName().then(name => {
            deviceName.textContent = name;
        });
    }
}

// ============================================
// SHOW BIOMETRIC SUCCESS ANIMATION
// ============================================

/**
 * Show a success animation after biometric verification
 */
function showBiometricSuccess() {
    const overlay = document.createElement('div');
    overlay.style.cssText = `
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(46, 125, 50, 0.9);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 99999;
        animation: fadeIn 0.3s ease;
    `;
    overlay.innerHTML = `
        <div style="text-align: center; color: white;">
            <i class="fas fa-fingerprint" style="font-size: 80px; animation: pulse 1s ease-in-out infinite;"></i>
            <h2 style="margin-top: 20px;">✅ Verified!</h2>
            <p>Biometric authentication successful</p>
        </div>
    `;

    setTimeout(() => {
        overlay.style.opacity = '0';

// ============================================
// TRACK USER ACTIVITY
// ============================================

/**
 * Track user activity to reset the inactivity timer
 */
function trackUserActivity() {
    if (biometricLockEnabled && currentUser) {
        lastActivityTime = Date.now();
    }
}

// Attach activity listeners
document.addEventListener('click', trackUserActivity);
document.addEventListener('scroll', trackUserActivity);
document.addEventListener('keydown', trackUserActivity);
document.addEventListener('touchstart', trackUserActivity);

// ============================================
// INITIALIZE BIOMETRIC LOCK
// ============================================

/**
 * Initialize the biometric lock system
 */
function initBiometricLock() {
    const wasEnabled = localStorage.getItem('biometricLockEnabled') === 'true' &&
        localStorage.getItem('biometricLockUserId') === currentUser?.uid;

    if (wasEnabled && currentUser) {
        biometricLockEnabled = true;

        const verified = sessionStorage.getItem('biometricVerified') === 'true';
        const verifiedTime = parseInt(sessionStorage.getItem('biometricVerifiedTime') || '0');
        const elapsed = Date.now() - verifiedTime;

        if (!verified || elapsed > LOCK_TIMEOUT) {
            setTimeout(() => {
                showBiometricLockScreen();
            }, 1000);
        } else {
            lastActivityTime = Date.now();
            startLockChecker();
        }
    }

    setTimeout(updateBiometricLockUI, 500);
}

// ============================================
// EXPOSE FUNCTIONS TO GLOBAL SCOPE
// ============================================

// Make all functions globally accessible
window.registerBiometric = registerBiometric;
window.verifyBiometric = verifyBiometric;
window.toggleBiometricLock = toggleBiometricLock;
window.unlockWithBiometric = unlockWithBiometric;
window.logoutFromLockScreen = logoutFromLockScreen;
window.testBiometricLock = testBiometricLock;
window.removeBiometricLock = removeBiometricLock;
window.initBiometricLock = initBiometricLock;
window.updateBiometricLockUI = updateBiometricLockUI;
window.isBiometricAvailable = isBiometricAvailable;
window.isBiometricSupported = isBiometricSupported;
window.getBiometricDeviceName = getBiometricDeviceName;
window.showBiometricLockScreen = showBiometricLockScreen;

// ============================================
// AUTO-INITIALIZE ON LOAD
// ============================================

// Initialize after Firebase auth is ready
if (typeof auth !== 'undefined') {
    const originalOnAuthStateChanged = auth.onAuthStateChanged;

    auth.onAuthStateChanged = async function(callback) {
        originalOnAuthStateChanged.call(auth, async (user) => {
            await callback(user);
            if (user) {
                setTimeout(initBiometricLock, 1000);
            }
        });
    };
}

// Also try to initialize on DOM ready
document.addEventListener('DOMContentLoaded', () => {
    setTimeout(() => {
        if (typeof currentUser !== 'undefined' && currentUser) {
            initBiometricLock();
        }
    }, 2000);
});

// GLOBAL IMAGE CROPPER ENGINE

let cropperInstance = null;

function openImageCropper(file, onCropSuccess) {
  const modal = document.getElementById('cropperModal');
  const imageElement = document.getElementById('imageToCrop');
  const confirmBtn = document.getElementById('confirmCropBtn');

  // 1. Read the selected file as a Data URL
  const reader = new FileReader();
  reader.onload = function (e) {
    imageElement.src = e.target.result;
    modal.style.display = 'flex';

    // 2. Destroy previous instance if it exists
    if (cropperInstance) {
      cropperInstance.destroy();
    }

    // 3. Initialize Cropper.js
    cropperInstance = new Cropper(imageElement, {
      aspectRatio: 1, // Locks crop box to a 1:1 Square
      viewMode: 1,    // Restricts crop box to not exceed image canvas
      dragMode: 'move',
      autoCropArea: 0.9,
      restore: false,
      guides: true,
      center: true,
      highlight: false,
      cropBoxMovable: true,
      cropBoxResizable: true,
      toggleDragModeOnDblclick: false,
    });
  };
  reader.readAsDataURL(file);

  // 4. Handle Crop Confirmation
  confirmBtn.onclick = function () {
    if (!cropperInstance) return;

    // Get cropped canvas and automatically RESIZE it to 400x400px (saves bandwidth)
    const canvas = cropperInstance.getCroppedCanvas({
      width: 400,
      height: 400,
      imageSmoothingEnabled: true,
      imageSmoothingQuality: 'high',
      fillColor: '#ffffff', // 🔥 এই লাইনটি যুক্ত করা হয়েছে (ব্যাকগ্রাউন্ড সাদা করার জন্য)
    });

    // Convert canvas to a compressed JPEG Blob
    canvas.toBlob((blob) => {
      closeCropperModal();
      onCropSuccess(blob); // Send the cropped blob back to the upload workflow
    }, 'image/jpeg', 0.85); // 85% JPEG Quality
  };
}

function closeCropperModal() {
  const modal = document.getElementById('cropperModal');
  modal.style.display = 'none';
  if (cropperInstance) {
    cropperInstance.destroy();
    cropperInstance = null;
  }
}


</script>
