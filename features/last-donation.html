<script>
// ============================================
// LAST DONATION DATE - WITH PROOF (IMAGE OR CODE)
// ============================================

// Open Last Donation Modal
function openLastDonationModal() {
  if (!currentUser || !userProfile) {
    Toast.show('Please login first', 'warning');
    return;
  }

  // Check if user is a donor
  if (!userProfile.isDonor) {
    Toast.show('This feature is for blood donors only', 'warning');
    return;
  }

  // Remove any existing modal to prevent duplicates
  const existingModal = document.querySelector('.last-donation-modal-overlay');
  if (existingModal) {
    existingModal.remove();
  }

  const modal = document.createElement('div');
  modal.className = 'last-donation-modal-overlay';
  modal.style.cssText = `
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.7);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 10001;
    padding: 20px;
    animation: fadeIn 0.3s ease;
  `;

  // Close modal when clicking outside
  modal.addEventListener('click', function(e) {
    if (e.target === this) {
      closeLastDonationModal(this);
    }
  });

  // Get last donation date from userProfile
  const lastDonation = userProfile.lastDonationDate || '';
  const formattedLastDonation = lastDonation ? 
    new Date(lastDonation).toLocaleDateString('en-US', {
      year: 'numeric',
      month: 'long',
      day: 'numeric'
    }) : 'Not recorded yet';

  // Get approval status
  const approvalStatus = userProfile.lastDonationApprovalStatus || 'pending';
  const approvalStatusText = approvalStatus === 'approved' ? '✅ Approved' : 
                             approvalStatus === 'rejected' ? '❌ Rejected' : '⏳ Donation Pending ';

  // Calculate days since last donation
  let daysSince = 'N/A';
  let isEligible = false;
  let nextEligibleDate = '';

  if (lastDonation && approvalStatus === 'approved') {
    const lastDate = new Date(lastDonation);
    const today = new Date();
    const diffTime = today - lastDate;
    const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
    daysSince = diffDays;

    const waitDays = userProfile.gender === 'female' ? 120 : 90;
    isEligible = diffDays >= waitDays;

    const nextDate = new Date(lastDate);
    nextDate.setDate(nextDate.getDate() + waitDays);
    nextEligibleDate = nextDate.toLocaleDateString('en-US', {
      year: 'numeric',
      month: 'long',
      day: 'numeric'
    });
  }

  modal.innerHTML = `
    <div style="
      background: white;
      border-radius: 16px;
      max-width: 520px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      padding: 32px;
      animation: scaleIn 0.3s ease;
      position: relative;
    ">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <h2 style="margin: 0; color: #b71c1c;">
          <i class="fas fa-calendar-check"></i> Last Donation
        </h2>
        <button onclick="closeLastDonationModal(this.closest('.last-donation-modal-overlay'))" style="
          background: none;
          border: none;
          font-size: 28px;
          cursor: pointer;
          color: #999;
          transition: color 0.3s;
          padding: 4px 8px;
          line-height: 1;
          border-radius: 4px;
        " onmouseover="this.style.color='#333'; this.style.background='#f0f0f0'" 
           onmouseout="this.style.color='#999'; this.style.background='transparent'">
          <i class="fas fa-times"></i>
        </button>
      </div>

      <!-- Current Status -->
      <div style="
        background: #f5f5f5;
        padding: 20px;
        border-radius: 12px;
        margin-bottom: 20px;
        text-align: center;
      ">
        <div style="font-size: 48px; margin-bottom: 8px;">
          ${lastDonation && approvalStatus === 'approved' ? (isEligible ? '✅' : '⏳') : '📝'}
        </div>
        <div style="font-size: 14px; color: #666;">Last Donation Date</div>
        <div style="font-size: 20px; font-weight: 700; color: #333;">${formattedLastDonation}</div>
        
        <!-- Approval Status Badge -->
        <div style="margin-top: 8px;">
          <span style="
            background: ${approvalStatus === 'approved' ? '#e8f5e9' : approvalStatus === 'rejected' ? '#ffebee' : '#fff3e0'};
            color: ${approvalStatus === 'approved' ? '#2e7d32' : approvalStatus === 'rejected' ? '#d32f2f' : '#f57c00'};
            padding: 4px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
          ">
            ${approvalStatusText}
          </span>
        </div>
        
        ${lastDonation && approvalStatus === 'approved' ? `
          <div style="margin-top: 12px; padding-top: 12px; border-top: 1px solid #e0e0e0;">
            <div style="display: flex; justify-content: space-around; flex-wrap: wrap; gap: 8px;">
              <div>
                <div style="font-size: 12px; color: #666;">Days Since</div>
                <div style="font-size: 24px; font-weight: 700; color: #b71c1c;">${daysSince}</div>
              </div>
              <div>
                <div style="font-size: 12px; color: #666;">Status</div>
                <div style="font-size: 18px; font-weight: 700; color: ${isEligible ? '#2e7d32' : '#f57c00'};">
                  ${isEligible ? '🟢 Eligible' : '🟡 Waiting'}
                </div>
              </div>
              <div>
                <div style="font-size: 12px; color: #666;">Next Eligible</div>
                <div style="font-size: 16px; font-weight: 600; color: #1565c0;">${nextEligibleDate}</div>
              </div>
            </div>
          </div>
        ` : ''}
        
        ${approvalStatus === 'pending' ? `
          <div style="margin-top: 12px; padding: 12px; background: #fff3e0; border-radius: 8px; border-left: 4px solid #f57c00;">
            <p style="font-size: 13px; color: #666; margin: 0;">
              <i class="fas fa-clock"></i> Your donation proof is pending admin approval.
            </p>
          </div>
        ` : ''}
        
        ${approvalStatus === 'rejected' ? `
          <div style="margin-top: 12px; padding: 12px; background: #ffebee; border-radius: 8px; border-left: 4px solid #d32f2f;">
            <p style="font-size: 13px; color: #d32f2f; margin: 0;">
              <i class="fas fa-exclamation-circle"></i> Your donation proof was rejected. Please submit a valid proof.
            </p>
          </div>
        ` : ''}
      </div>

      <!-- Update Form -->
      <form id="lastDonationForm">
        <div class="form-group">
          <label for="donationDateInput">
            <i class="fas fa-calendar-alt"></i> Donation Date *
          </label>
          <input 
            type="date" 
            id="donationDateInput" 
            class="form-control"
            value="${lastDonation || ''}"
            max="${new Date().toISOString().split('T')[0]}"
            style="width: 100%; padding: 14px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 16px;"
            required
          >
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
          <div class="form-group">
            <label for="donationGenderSelect">Gender</label>
            <select id="donationGenderSelect" style="width: 100%; padding: 14px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 16px;">
              <option value="male" ${userProfile.gender === 'female' ? '' : 'selected'}>Male (90 days wait)</option>
              <option value="female" ${userProfile.gender === 'female' ? 'selected' : ''}>Female (120 days wait)</option>
            </select>
          </div>
          <div class="form-group">
            <label for="donationUnitsInput">Units Donated *</label>
            <input 
              type="number" 
              id="donationUnitsInput" 
              min="1" 
              max="10" 
              value="${userProfile.lastDonationUnits || 1}"
              style="width: 100%; padding: 14px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 16px;"
              required
            >
          </div>
        </div>

        <!-- ===== PROOF UPLOAD SECTION ===== -->
        <div style="
          border: 2px dashed #e0e0e0;
          border-radius: 12px;
          padding: 20px;
          text-align: center;
          cursor: pointer;
          transition: all 0.3s ease;
          background: #fafafa;
          margin-bottom: 16px;
        " 
        id="donationProofUploadArea"
        onmouseenter="this.style.borderColor='#b71c1c'; this.style.background='#fff5f5';"
        onmouseleave="if(!this.dataset.hasImage){this.style.borderColor='#e0e0e0'; this.style.background='#fafafa';}">
          
          <div id="donationProofPreview" style="display: none; margin-bottom: 10px;">
            <img id="donationProofPreviewImg" src="" alt="Donation Proof" style="
              width: 120px;
              height: 120px;
              border-radius: 8px;
              object-fit: cover;
              border: 3px solid #2e7d32;
              box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            ">
          </div>
          
          <div id="donationProofPlaceholder">
            <i class="fas fa-camera" style="font-size: 36px; color: #b71c1c; opacity: 0.5;"></i>
            <p style="margin-top: 8px; color: #666; font-size: 14px;">
              <strong>Upload Donation Proof</strong><br>
              <span style="font-size: 12px;">Photo of donation certificate or blood bank receipt</span>
            </p>
          </div>
          
          <input type="file" id="donationProofInput" accept="image/*" style="display: none;">
        </div>

        <!-- OR Divider -->
        <div style="display: flex; align-items: center; gap: 12px; margin: 12px 0;">
          <div style="flex: 1; height: 1px; background: #e0e0e0;"></div>
          <span style="color: #999; font-size: 13px; font-weight: 600;">OR</span>
          <div style="flex: 1; height: 1px; background: #e0e0e0;"></div>
        </div>

        <!-- Code Input -->
        <div class="form-group" style="margin-bottom: 8px;">
          <label for="donationCodeInput">
            <i class="fas fa-key"></i> Enter Verification Code
          </label>
          <div style="display: flex; gap: 10px;">
            <input 
              type="text" 
              id="donationCodeInput" 
              placeholder="Enter code from WhatsApp"
              style="flex: 1; padding: 14px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 16px;"
            >
            <a href="https://wa.me/8801612018221?text=Hello%2C%20I%20need%20a%20donation%20verification%20code" 
               target="_blank" 
               class="btn btn-primary"
               style="padding: 14px 20px; font-size: 14px; white-space: nowrap; text-decoration: none;">
              <i class="fab fa-whatsapp"></i> Get Code
            </a>
          </div>
          <small style="color: #666; display: block; margin-top: 6px;">
            <i class="fas fa-info-circle"></i> Contact us on WhatsApp to get a verification code if you don't have a photo.
          </small>
        </div>

        <button type="submit" class="btn btn-primary btn-block" style="margin-top: 8px;" id="donationSubmitBtn">
          <i class="fas fa-save"></i> Submit for Approval
        </button>
      </form>

      <!-- Quick Stats -->
      <div style="margin-top: 20px; padding-top: 16px; border-top: 1px solid #e0e0e0;">
        <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; text-align: center;">
          <div>
            <div style="font-size: 11px; color: #999;">Total Donations</div>
            <div style="font-size: 20px; font-weight: 700; color: #b71c1c;">${userProfile.totalDonations || 0}</div>
          </div>
          <div>
            <div style="font-size: 11px; color: #999;">Total Units</div>
            <div style="font-size: 20px; font-weight: 700; color: #1565c0;">${userProfile.totalUnitsDonated || 0}</div>
          </div>
          <div>
            <div style="font-size: 11px; color: #999;">Lives Saved</div>
            <div style="font-size: 20px; font-weight: 700; color: #2e7d32;">${(userProfile.totalUnitsDonated || 0) * 3}</div>
          </div>
        </div>
      </div>
    </div>
  `;

  document.body.appendChild(modal);

  // ===== PROOF UPLOAD HANDLER =====
  const uploadArea = document.getElementById('donationProofUploadArea');
  const fileInput = document.getElementById('donationProofInput');
  const previewContainer = document.getElementById('donationProofPreview');
  const previewImg = document.getElementById('donationProofPreviewImg');
  const placeholder = document.getElementById('donationProofPlaceholder');
  let uploadedProofUrl = null;

  // Click to upload
  uploadArea.addEventListener('click', () => fileInput.click());

  // Drag and drop
  uploadArea.addEventListener('dragover', (e) => {
    e.preventDefault();
    uploadArea.style.borderColor = '#b71c1c';
    uploadArea.style.background = '#fff5f5';
  });

  uploadArea.addEventListener('dragleave', () => {
    uploadArea.style.borderColor = '#e0e0e0';
    uploadArea.style.background = '#fafafa';
  });

  uploadArea.addEventListener('drop', (e) => {
    e.preventDefault();
    uploadArea.style.borderColor = '#e0e0e0';
    uploadArea.style.background = '#fafafa';
    if (e.dataTransfer.files.length) {
      fileInput.files = e.dataTransfer.files;
      handleDonationProofSelect();
    }
  });

  fileInput.addEventListener('change', handleDonationProofSelect);

  async function handleDonationProofSelect() {
    if (fileInput.files && fileInput.files[0]) {
      const file = fileInput.files[0];
      
      if (!file.type.match('image.*')) {
        Toast.show('Please select an image file', 'error');
        return;
      }
      
      if (file.size > 10 * 1024 * 1024) {
        Toast.show('Image must be less than 10MB', 'error');
        return;
      }
      
      // Open cropper for donation proof
      openImageCropper(file, async (croppedBlob) => {
        // Show preview
        previewImg.src = URL.createObjectURL(croppedBlob);
        previewContainer.style.display = 'block';
        placeholder.style.display = 'none';
        uploadArea.dataset.hasImage = 'true';
        uploadArea.style.borderColor = '#2e7d32';
        uploadArea.style.background = '#e8f5e9';

        // Upload to ImgBB
        try {
          Toast.show('Uploading proof...', 'info');
          const formData = new FormData();
          formData.append('image', croppedBlob, 'donation_proof.jpg');
          
          const response = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
            method: 'POST',
            body: formData
          });
          
          const data = await response.json();
          
          if (data.success) {
            uploadedProofUrl = data.data.url;
            Toast.show('Proof uploaded successfully!', 'success');
          } else {
            throw new Error(data.error?.message || 'Upload failed');
          }
        } catch (error) {
          console.error('Upload error:', error);
          Toast.show('Failed to upload proof. Try again or use code.', 'error');
          uploadedProofUrl = null;
        }
      });
    }
  }

  // ===== FORM SUBMIT HANDLER =====
  document.getElementById('lastDonationForm').addEventListener('submit', async (e) => {
    e.preventDefault();

    const donationDate = document.getElementById('donationDateInput').value;
    const gender = document.getElementById('donationGenderSelect').value;
    const units = parseInt(document.getElementById('donationUnitsInput').value) || 1;
    const code = document.getElementById('donationCodeInput').value.trim();

    if (!donationDate) {
      Toast.show('Please select a donation date', 'warning');
      return;
    }

    // Validate date is not in the future
    const selectedDate = new Date(donationDate);
    const today = new Date();
    if (selectedDate > today) {
      Toast.show('Date cannot be in the future', 'error');
      return;
    }

    // Check if user provided either image OR code
    if (!uploadedProofUrl && !code) {
      Toast.show('Please upload a photo OR enter a verification code', 'warning');
      return;
    }

    try {
      const submitBtn = document.getElementById('donationSubmitBtn');
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Submitting...';

      const updates = {
        lastDonationDate: donationDate,
        gender: gender,
        lastDonationUnits: units,
        lastDonationApprovalStatus: 'pending',
        lastDonationProof: uploadedProofUrl || null,
        lastDonationCode: code || null,
        lastDonationSubmittedAt: firebase.firestore.FieldValue.serverTimestamp(),
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      };

      await db.collection('users').doc(currentUser.uid).update(updates);
      
      // Reload user profile
      await authSystem.loadUserProfile(currentUser.uid);
      
      Toast.show('Donation record submitted for approval! 🎉', 'success');
      closeLastDonationModal(modal);
      
      // Refresh dashboard
      router.navigate('dashboard');
    } catch (error) {
      console.error('Error submitting donation:', error);
      Toast.show('Failed to submit donation record', 'error');
    } finally {
      const submitBtn = document.getElementById('donationSubmitBtn');
      submitBtn.disabled = false;
      submitBtn.innerHTML = '<i class="fas fa-save"></i> Submit for Approval';
    }
  });
}

// Close Last Donation Modal
function closeLastDonationModal(modalElement) {
  if (!modalElement) {
    modalElement = document.querySelector('.last-donation-modal-overlay');
  }
  if (modalElement) {
    modalElement.style.opacity = '0';
    modalElement.style.transition = 'opacity 0.3s ease';
    setTimeout(() => {
      modalElement.remove();
    }, 300);
  }
}

</script>
