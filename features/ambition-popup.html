<!-- ============================================
     FEATURE: ambition-popup
     এই ফাইলে এই ফিচারের HTML, CSS ও JavaScript একসাথে আছে
     ============================================ -->

<style>

    /* ============================================
       AMBITIONS POPUP - STYLES
       (content lives in ambitions.popup.html)
       ============================================ */
    .ambition-popup-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.65);
      z-index: 999999;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
</style>

<script>
  // ============================================
  // AMBITIONS POPUP LOADER
  // কনটেন্ট আসে ambitions.popup.html থেকে,
  // এই ফাইলে শুধু show/hide করার লজিক।
  // ============================================

  function closeAmbitionPopup() {
    const overlay = document.getElementById('ambitionPopupOverlay');
    if (!overlay) return;
    overlay.classList.remove('show');
    setTimeout(() => overlay.remove(), 300);
  }
  window.closeAmbitionPopup = closeAmbitionPopup;

  function initAmbitionPopup() {
    fetch('ambitions.popup.html')
      .then(res => {
        if (!res.ok) throw new Error('ambitions.popup.html not found');
        return res.text();
      })
      .then(html => {
        const overlay = document.createElement('div');
        overlay.id = 'ambitionPopupOverlay';
        overlay.className = 'ambition-popup-overlay';
        overlay.innerHTML = html;

        // Click outside the box closes the popup
        overlay.addEventListener('click', (e) => {
          if (e.target === overlay) closeAmbitionPopup();
        });

        document.body.appendChild(overlay);
        requestAnimationFrame(() => overlay.classList.add('show'));
      })
      .catch(err => {
        console.warn('Ambition popup could not be loaded:', err);
      });
  }

  // ESC key closes the popup
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeAmbitionPopup();
  });

  document.addEventListener('DOMContentLoaded', initAmbitionPopup);
</script>
