<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="#b71c1c">
  <meta name="apple-mobile-web-app-title" content="Blood Donor BD">
  <meta name="theme-color" content="#b71c1c">
  
  <title>Advanced Profile · Blood Donor BD</title>
  
  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
  
  <!-- Cropper.js (optional for future) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.css" />
  
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #f0f2f5;
      color: #1c1e21;
      min-height: 100vh;
    }
    .navbar {
      background: white;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
      position: sticky;
      top:0;
      z-index:1000;
      padding:0 20px;
    }
    .nav-container {
      max-width:1200px;
      margin:0 auto;
      display:flex;
      align-items:center;
      justify-content:space-between;
      height:64px;
    }
    .nav-brand {
      display:flex;
      align-items:center;
      gap:10px;
      font-size:20px;
      font-weight:700;
      color:#b71c1c;
      text-decoration:none;
      cursor:pointer;
    }
    .nav-brand img {
      width:40px;
      height:40px;
      border-radius:50%;
      object-fit:cover;
    }
    .nav-actions {
      display:flex;
      align-items:center;
      gap:8px;
    }
    .btn {
      padding:8px 14px;
      border:none;
      border-radius:40px;
      font-weight:600;
      cursor:pointer;
      transition:all 0.2s ease;
      font-size:14px;
      display:inline-flex;
      align-items:center;
      gap:6px;
      background:#f0f2f5;
      color:#1c1e21;
    }
    .btn-primary { background:#b71c1c; color:white; }
    .btn-primary:hover { background:#8b0000; transform:scale(1.02); }
    .btn-outline { background:transparent; border:2px solid #b71c1c; color:#b71c1c; }
    .btn-outline:hover { background:#b71c1c; color:white; }
    .btn-ghost { background:#f0f2f5; color:#1c1e21; }
    .btn-ghost:hover { background:#e4e6eb; }
    .btn-logout { background:transparent; border:1px solid #ddd; color:#666; padding:8px 14px; border-radius:40px; cursor:pointer; transition:all 0.2s; font-weight:600; display:flex; align-items:center; gap:6px; }
    .btn-logout:hover { background:#ffebee; border-color:#d32f2f; color:#d32f2f; }
    
    /* Profile */
    .profile-container { max-width:820px; margin:20px auto; padding:0 16px; }
    .cover-section {
      position:relative;
      background:white;
      border-radius:16px 16px 0 0;
      overflow:hidden;
      height:260px;
      box-shadow:0 1px 4px rgba(0,0,0,0.06);
    }
    .cover-image { width:100%; height:100%; object-fit:cover; }
    .cover-placeholder {
      width:100%; height:100%;
      background:linear-gradient(135deg, #b71c1c, #e53935);
      display:flex;
      align-items:center;
      justify-content:center;
      color:white;
      font-size:48px;
      opacity:0.5;
    }
    .cover-upload-btn {
      position:absolute;
      bottom:16px;
      right:16px;
      background:rgba(255,255,255,0.92);
      backdrop-filter:blur(4px);
      border:none;
      padding:8px 18px;
      border-radius:40px;
      font-weight:600;
      cursor:pointer;
      display:flex;
      align-items:center;
      gap:8px;
      box-shadow:0 2px 8px rgba(0,0,0,0.1);
      font-size:14px;
    }
    .cover-upload-btn:hover { background:white; transform:scale(1.02); }
    .profile-info-section {
      background:white;
      padding:0 24px 20px;
      border-radius:0 0 16px 16px;
      box-shadow:0 1px 4px rgba(0,0,0,0.06);
      margin-bottom:16px;
    }
    .profile-avatar-wrapper {
      position:relative;
      margin-top:-56px;
      margin-bottom:12px;
      display:inline-block;
    }
    .profile-avatar {
      width:112px; height:112px;
      border-radius:50%;
      border:4px solid white;
      object-fit:cover;
      box-shadow:0 4px 20px rgba(0,0,0,0.12);
      background:#f0f2f5;
    }
    .profile-avatar-placeholder {
      width:112px; height:112px;
      border-radius:50%;
      border:4px solid white;
      background:linear-gradient(135deg, #b71c1c, #e53935);
      display:flex;
      align-items:center;
      justify-content:center;
      color:white;
      font-size:48px;
      font-weight:700;
      box-shadow:0 4px 20px rgba(0,0,0,0.12);
    }
    .avatar-upload-btn {
      position:absolute;
      bottom:4px;
      right:4px;
      background:#b71c1c;
      color:white;
      border:2px solid white;
      width:34px;
      height:34px;
      border-radius:50%;
      cursor:pointer;
      display:flex;
      align-items:center;
      justify-content:center;
      transition:0.2s;
      box-shadow:0 2px 8px rgba(0,0,0,0.2);
    }
    .avatar-upload-btn:hover { transform:scale(1.1); background:#8b0000; }
    .profile-name {
      font-size:28px;
      font-weight:800;
      color:#1c1e21;
      display:flex;
      align-items:center;
      gap:10px;
      flex-wrap:wrap;
    }
    .profile-bio { color:#65676b; font-size:15px; margin-bottom:12px; word-wrap:break-word; }
    .profile-meta {
      display:flex;
      flex-wrap:wrap;
      gap:16px 24px;
      color:#65676b;
      font-size:14px;
      margin-bottom:12px;
    }
    .profile-meta span { display:flex; align-items:center; gap:6px; }
    .profile-actions {
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      border-top:1px solid #e4e6eb;
      padding-top:16px;
    }
    .profile-actions .btn { padding:8px 20px; border-radius:40px; font-weight:600; font-size:14px; border:none; cursor:pointer; transition:0.2s; }
    .btn-follow { background:#b71c1c; color:white; }
    .btn-follow:hover { background:#8b0000; }
    .btn-following { background:#e4e6eb; color:#1c1e21; }
    .btn-following:hover { background:#d0d2d6; }
    .btn-message { background:#e4e6eb; color:#1c1e21; }
    .btn-message:hover { background:#d0d2d6; }
    .stats-bar {
      display:flex;
      gap:32px;
      padding:12px 0;
      border-top:1px solid #e4e6eb;
      margin-top:8px;
      flex-wrap:wrap;
    }
    .stats-bar .stat-item { text-align:center; cursor:pointer; padding:4px 12px; border-radius:8px; transition:0.2s; }
    .stats-bar .stat-item:hover { background:#f0f2f5; }
    .stats-bar .stat-number { font-weight:700; font-size:20px; color:#1c1e21; }
    .stats-bar .stat-label { font-size:13px; color:#65676b; }

    /* Post composer */
    .post-composer {
      background:white;
      border-radius:16px;
      padding:16px 20px;
      box-shadow:0 1px 4px rgba(0,0,0,0.06);
      margin-bottom:16px;
    }
    .composer-header { display:flex; gap:12px; align-items:center; margin-bottom:12px; }
    .composer-avatar { width:40px; height:40px; border-radius:50%; object-fit:cover; flex-shrink:0; }
    .composer-input {
      flex:1;
      background:#f0f2f5;
      border:none;
      padding:10px 16px;
      border-radius:40px;
      font-size:15px;
      cursor:pointer;
      transition:0.2s;
      font-family:inherit;
    }
    .composer-input:hover { background:#e4e6eb; }
    .composer-tools {
      display:flex;
      gap:8px;
      border-top:1px solid #e4e6eb;
      padding-top:12px;
      flex-wrap:wrap;
    }
    .composer-tools button {
      background:none;
      border:none;
      padding:6px 14px;
      border-radius:40px;
      font-weight:600;
      font-size:14px;
      cursor:pointer;
      display:flex;
      align-items:center;
      gap:6px;
      color:#65676b;
    }
    .composer-tools button:hover { background:#f0f2f5; }
    .photo-btn { color:#45bd62; }
    .poll-btn { color:#f7b928; }

    /* Feed */
    .feed { display:flex; flex-direction:column; gap:16px; }
    .feed-post {
      background:white;
      border-radius:16px;
      padding:16px 20px;
      box-shadow:0 1px 4px rgba(0,0,0,0.06);
      animation:fadeUp 0.3s ease;
    }
    @keyframes fadeUp { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:translateY(0); } }
    .post-header { display:flex; gap:12px; margin-bottom:12px; cursor:pointer; align-items:flex-start; }
    .post-avatar { width:40px; height:40px; border-radius:50%; object-fit:cover; flex-shrink:0; border:2px solid #b71c1c; }
    .post-author { flex:1; }
    .post-author-name { font-weight:600; font-size:15px; color:#1c1e21; display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
    .badge-donor { font-size:10px; padding:2px 10px; border-radius:30px; font-weight:700; background:#b71c1c; color:white; }
    .contact-donor-btn {
      background:#25D366;
      color:white;
      border:none;
      padding:2px 12px;
      border-radius:30px;
      font-size:11px;
      font-weight:600;
      cursor:pointer;
      transition:0.2s;
      display:inline-flex;
      align-items:center;
      gap:4px;
    }
    .contact-donor-btn:hover { transform:scale(1.04); }
    .post-time { font-size:12px; color:#65676b; display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
    .post-time .post-location { background:#f0f2f5; padding:0 10px; border-radius:30px; font-size:11px; color:#65676b; }
    .post-time .post-blood { background:#ffebee; padding:0 10px; border-radius:30px; font-size:11px; color:#b71c1c; }
    .post-text { font-size:15px; line-height:1.7; color:#1c1e21; margin-bottom:12px; white-space:pre-wrap; word-break:break-word; }
    .post-image { width:100%; border-radius:12px; margin-bottom:12px; max-height:500px; object-fit:contain; background:#f0f2f5; cursor:pointer; }
    .post-poll { background:#f0f2f5; border-radius:12px; padding:16px; margin-bottom:12px; }
    .post-poll .poll-question { font-weight:600; margin-bottom:12px; }
    .poll-option-result {
      display:flex;
      align-items:center;
      gap:12px;
      padding:8px 12px;
      margin-bottom:6px;
      background:white;
      border-radius:8px;
      cursor:pointer;
      border:2px solid transparent;
      position:relative;
      overflow:hidden;
      transition:0.15s;
    }
    .poll-option-result:hover { border-color:#b71c1c; }
    .poll-option-result .poll-bar {
      position:absolute;
      left:0; top:0; height:100%;
      background:rgba(183,28,28,0.08);
      transition:width 0.5s ease;
      border-radius:8px;
    }
    .poll-option-result .poll-text { position:relative; z-index:1; font-size:14px; flex:1; }
    .poll-option-result .poll-percent { position:relative; z-index:1; font-weight:600; color:#b71c1c; }
    .poll-option-result.selected { border-color:#b71c1c; background:rgba(183,28,28,0.04); }
    .poll-total-votes { font-size:13px; color:#65676b; margin-top:8px; text-align:center; }
    .post-actions {
      display:flex;
      gap:20px;
      padding-top:12px;
      border-top:1px solid #e4e6eb;
      flex-wrap:wrap;
    }
    .post-actions button {
      background:none;
      border:none;
      display:flex;
      align-items:center;
      gap:6px;
      font-weight:600;
      color:#65676b;
      cursor:pointer;
      padding:4px 8px;
      border-radius:8px;
      transition:0.15s;
      font-size:14px;
    }
    .post-actions button:hover { background:#f0f2f5; }
    .post-actions .liked { color:#b71c1c; }
    .post-actions .liked i { color:#b71c1c; }
    .post-comments { margin-top:12px; padding-top:12px; border-top:1px solid #e4e6eb; }
    .post-comment { display:flex; gap:10px; margin-bottom:8px; padding:4px 0; }
    .post-comment .comment-avatar { width:28px; height:28px; border-radius:50%; object-fit:cover; flex-shrink:0; cursor:pointer; }
    .post-comment .comment-body { flex:1; background:#f0f2f5; padding:8px 14px; border-radius:20px; }
    .post-comment .comment-author { font-weight:600; font-size:13px; cursor:pointer; }
    .post-comment .comment-author:hover { color:#b71c1c; }
    .post-comment .comment-text { font-size:14px; color:#1c1e21; }
    .post-comment .comment-time { font-size:11px; color:#65676b; margin-left:8px; }
    .post-comment-input { display:flex; gap:10px; margin-top:8px; }
    .post-comment-input input { flex:1; background:#f0f2f5; border:none; padding:8px 14px; border-radius:40px; font-size:14px; font-family:inherit; }
    .post-comment-input input:focus { outline:none; }
    .post-comment-input button { background:#b71c1c; color:white; border:none; padding:8px 18px; border-radius:40px; font-weight:600; cursor:pointer; transition:0.2s; font-size:13px; }
    .post-comment-input button:hover { background:#8b0000; }

    /* Modal */
    .post-modal {
      position:fixed;
      top:0; left:0; right:0; bottom:0;
      background:rgba(0,0,0,0.6);
      display:none;
      align-items:center;
      justify-content:center;
      z-index:10001;
      padding:20px;
      backdrop-filter:blur(4px);
    }
    .post-modal.active { display:flex; }
    .post-modal-content {
      background:white;
      border-radius:20px;
      max-width:560px;
      width:100%;
      max-height:90vh;
      overflow-y:auto;
      padding:24px;
      animation:scaleIn 0.25s ease;
    }
    @keyframes scaleIn { from { transform:scale(0.92); opacity:0; } to { transform:scale(1); opacity:1; } }
    .post-modal-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; }
    .post-modal-header h3 { font-size:20px; font-weight:700; }
    .post-modal-close { background:#f0f2f5; border:none; width:36px; height:36px; border-radius:50%; font-size:20px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
    .post-modal-close:hover { background:#e4e6eb; }
    .post-modal textarea { width:100%; min-height:120px; border:none; resize:vertical; font-size:16px; font-family:inherit; padding:8px 0; outline:none; }
    .post-modal textarea::placeholder { color:#999; }
    .post-image-preview { margin:12px 0; border-radius:12px; overflow:hidden; position:relative; display:none; background:#f0f2f5; max-height:400px; }
    .post-image-preview img { width:100%; height:auto; max-height:400px; object-fit:contain; }
    .post-image-preview .remove-image { position:absolute; top:8px; right:8px; background:rgba(0,0,0,0.7); color:white; border:none; width:32px; height:32px; border-radius:50%; cursor:pointer; }
    .post-modal-footer { display:flex; justify-content:space-between; align-items:center; padding-top:16px; border-top:1px solid #e4e6eb; flex-wrap:wrap; gap:10px; }
    .post-modal-footer .btn { padding:8px 24px; border-radius:40px; font-weight:600; border:none; cursor:pointer; }
    .btn-post { background:#b71c1c; color:white; }
    .btn-post:hover { background:#8b0000; }
    .poll-option-input { display:flex; gap:10px; align-items:center; margin-bottom:8px; }
    .poll-option-input input { flex:1; padding:10px 14px; border:2px solid #e4e6eb; border-radius:12px; font-size:14px; font-family:inherit; }
    .poll-option-input input:focus { border-color:#b71c1c; outline:none; }
    .remove-option { background:none; border:none; color:#d32f2f; cursor:pointer; font-size:18px; padding:4px; }
    .add-poll-option { background:none; border:none; color:#b71c1c; font-weight:600; cursor:pointer; padding:8px 0; font-size:14px; }
    .add-poll-option:hover { text-decoration:underline; }

    .empty-state { text-align:center; padding:60px 20px; color:#65676b; }
    .empty-state i { font-size:48px; opacity:0.3; margin-bottom:16px; }
    .empty-state h3 { color:#1c1e21; margin-bottom:8px; }

    .toast-container { position:fixed; top:80px; right:20px; z-index:10002; display:flex; flex-direction:column; gap:8px; }
    .toast { background:white; padding:14px 20px; border-radius:14px; box-shadow:0 4px 20px rgba(0,0,0,0.12); display:flex; align-items:center; gap:12px; animation:slideIn 0.3s ease; max-width:380px; min-width:260px; }
    .toast.success { border-left:4px solid #2e7d32; }
    .toast.error { border-left:4px solid #d32f2f; }
    .toast.warning { border-left:4px solid #f57c00; }
    .toast.info { border-left:4px solid #b71c1c; }
    @keyframes slideIn { from { opacity:0; transform:translateX(30px); } to { opacity:1; transform:translateX(0); } }

    @media (max-width:768px) {
      .cover-section { height:180px; }
      .profile-avatar { width:80px; height:80px; }
      .profile-avatar-placeholder { width:80px; height:80px; font-size:32px; }
      .profile-avatar-wrapper { margin-top:-40px; }
      .profile-name { font-size:22px; }
      .profile-actions .btn { padding:6px 16px; font-size:13px; }
      .stats-bar { gap:16px; }
      .stats-bar .stat-number { font-size:16px; }
      .post-modal-content { padding:16px; margin:0 8px; }
      .cover-upload-btn { padding:6px 14px; font-size:12px; }
      .cover-upload-btn span { display:none; }
      .composer-tools button span { display:none; }
      .nav-actions .btn span { display:none; }
    }
  </style>
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar">
  <div class="nav-container">
    <a class="nav-brand" onclick="goHome()">
      <img src="https://i.ibb.co/RTdtn0RG/1000018751.png" alt="Logo">
      Blood Donor BD
    </a>
    <div class="nav-actions">
      <button class="btn btn-ghost" onclick="goHome()"><i class="fas fa-home"></i> <span>Home</span></button>
      <button class="btn btn-primary" onclick="openPostModal()"><i class="fas fa-plus"></i> <span>Create</span></button>
      <button class="btn btn-outline" onclick="goBack()"><i class="fas fa-arrow-left"></i> <span>Back</span></button>
      <button class="btn-logout" onclick="logout()"><i class="fas fa-sign-out-alt"></i></button>
    </div>
  </div>
</nav>

<!-- PROFILE CONTAINER -->
<div class="profile-container" id="profileContainer"></div>

<!-- POST MODAL -->
<div class="post-modal" id="postModal">
  <div class="post-modal-content">
    <div class="post-modal-header">
      <h3 id="postModalTitle">Create Post</h3>
      <button class="post-modal-close" onclick="closePostModal()"><i class="fas fa-times"></i></button>
    </div>
    <div style="display:flex; gap:10px; align-items:center; margin-bottom:12px;">
      <img id="modalUserAvatar" src="" alt="Avatar" style="width:36px; height:36px; border-radius:50%; object-fit:cover;">
      <div>
        <strong id="modalUserName">User</strong>
        <div style="font-size:12px; color:#65676b;">
          <select id="postVisibility" style="border:none; background:transparent; font-size:12px; color:#65676b; font-weight:600; cursor:pointer;">
            <option value="public">🌍 Public</option>
            <option value="friends">👥 Friends</option>
            <option value="private">🔒 Only Me</option>
          </select>
        </div>
      </div>
    </div>
    <textarea id="postTextInput" placeholder="What's on your mind?"></textarea>
    <div class="post-image-preview" id="postImagePreview">
      <img id="postPreviewImg" src="" alt="Preview">
      <button class="remove-image" onclick="removePostImage()"><i class="fas fa-times"></i></button>
    </div>
    <div id="pollOptionsContainer" style="display:none; margin:12px 0; padding:12px; background:#f0f2f5; border-radius:12px;">
      <div style="font-weight:600; margin-bottom:8px;">Poll Options</div>
      <div id="pollOptionList">
        <div class="poll-option-input">
          <input type="text" placeholder="Option 1" class="poll-option" data-index="0">
          <button class="remove-option" onclick="removePollOption(this)" style="display:none;"><i class="fas fa-times"></i></button>
        </div>
        <div class="poll-option-input">
          <input type="text" placeholder="Option 2" class="poll-option" data-index="1">
          <button class="remove-option" onclick="removePollOption(this)" style="display:none;"><i class="fas fa-times"></i></button>
        </div>
      </div>
      <button class="add-poll-option" onclick="addPollOption()"><i class="fas fa-plus"></i> Add Option</button>
      <div style="margin-top:8px; display:flex; flex-wrap:wrap; gap:12px;">
        <label style="font-size:13px; color:#65676b; display:flex; align-items:center; gap:8px; cursor:pointer;">
          <input type="checkbox" id="pollMultiple"> Multiple choices
        </label>
        <label style="font-size:13px; color:#65676b; display:flex; align-items:center; gap:8px; cursor:pointer;">
          <input type="number" id="pollDuration" value="7" min="1" max="30" style="width:60px; padding:4px 8px; border:1px solid #e4e6eb; border-radius:8px;"> days
        </label>
      </div>
    </div>
    <div style="display:flex; gap:8px; padding:8px 0; border-top:1px solid #e4e6eb; margin-top:8px; flex-wrap:wrap;">
      <button onclick="triggerImageUpload()" style="background:none; border:none; cursor:pointer; padding:6px 12px; border-radius:8px; display:flex; align-items:center; gap:6px; color:#45bd62; font-weight:600;"><i class="fas fa-image"></i> Photo</button>
      <button onclick="togglePollMode()" style="background:none; border:none; cursor:pointer; padding:6px 12px; border-radius:8px; display:flex; align-items:center; gap:6px; color:#f7b928; font-weight:600;"><i class="fas fa-poll"></i> Poll</button>
      <input type="file" id="postImageInput" accept="image/*" style="display:none;" onchange="handlePostImageSelect(event)">
    </div>
    <div class="post-modal-footer">
      <span id="postCharCount">0 characters</span>
      <button class="btn btn-post" id="postSubmitBtn" onclick="submitPost()"><i class="fas fa-paper-plane"></i> Post</button>
    </div>
  </div>
</div>

<!-- TOAST -->
<div class="toast-container" id="toastContainer"></div>

<script>
  // ===== FIREBASE =====
  const firebaseConfig = {
    apiKey: "AIzaSyCnky8bzx3KuFoujU5DSlLRYSZgiAF8840",
    authDomain: "blood-donor-bd-2025.firebaseapp.com",
    projectId: "blood-donor-bd-2025",
    storageBucket: "blood-donor-bd-2025.firebasestorage.app",
    messagingSenderId: "271945142840",
    appId: "1:271945142840:web:b0edefddb55cac5f604ccd",
    measurementId: "G-28KGSJREBR"
  };
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();
  const IMGBB_API_KEY = '54ffbc26529e5d05fa5cffad23712429';

  // ===== STATE =====
  let currentUser = null, userProfile = null, viewedUserId = null, viewedUserProfile = null, isOwnProfile = false;
  let posts = [], selectedImageFile = null, isPollMode = false, isFollowing = false, userCache = {};

  // ===== TOAST =====
  function showToast(msg, type='info') {
    const c = document.getElementById('toastContainer');
    const t = document.createElement('div');
    t.className = `toast ${type}`;
    const icon = type==='success'?'fa-check-circle':type==='error'?'fa-exclamation-circle':type==='warning'?'fa-exclamation-triangle':'fa-info-circle';
    t.innerHTML = `<i class="fas ${icon}"></i> ${msg}`;
    c.appendChild(t);
    setTimeout(()=>t.remove(), 5000);
  }

  // ===== NAV =====
  function goHome() { window.location.href='index.html'; }
  function goBack() { window.history.back(); }
  async function logout() { try { await auth.signOut(); window.location.href='index.html'; } catch(e) { showToast('Logout failed','error'); } }

  function getUrlParams() { return Object.fromEntries(new URLSearchParams(window.location.search)); }

  function getTimeAgo(date) {
    const diff = Date.now() - date.getTime();
    const s=Math.floor(diff/1000), m=Math.floor(s/60), h=Math.floor(m/60), d=Math.floor(h/24), w=Math.floor(d/7), mo=Math.floor(d/30), y=Math.floor(d/365);
    if(s<60) return 'Just now';
    if(m<60) return m+'m ago';
    if(h<24) return h+'h ago';
    if(d<7) return d+'d ago';
    if(w<4) return w+'w ago';
    if(mo<12) return mo+'mo ago';
    return y+'y ago';
  }
  function getAvatarUrl(u) {
    if(u?.profilePic) return u.profilePic;
    if(u?.userAvatar) return u.userAvatar;
    return u?.gender==='female' ? 'https://i.ibb.co/ZzL8pT3K/1000020380.png' : 'https://i.ibb.co/WNH98LbN/1000020379.png';
  }
  async function getUserData(uid) {
    if(userCache[uid]) return userCache[uid];
    try {
      const doc=await db.collection('users').doc(uid).get();
      if(doc.exists) { userCache[uid]=doc.data(); return doc.data(); }
    } catch(e) {}
    return null;
  }

  // ===== GO TO PRIVATE DM (from bh.html) =====
  function goToPrivateDM(userId) {
    if(!currentUser) return showToast('Please login to send message','warning');
    if(userId===currentUser.uid) return showToast('You cannot message yourself','warning');
    window.location.href = `dm.donor.html?userId=${userId}`;
  }

  // ===== LOAD PROFILE =====
  async function loadProfile() {
    const container = document.getElementById('profileContainer');
    const user = auth.currentUser;
    if(!user) {
      container.innerHTML = `<div style="text-align:center;padding:60px;background:white;border-radius:16px;">
        <i class="fas fa-user-slash" style="font-size:48px;color:#999;"></i>
        <h3 style="margin-top:16px;color:#1c1e21;">Please Login</h3>
        <p style="color:#65676b;margin-bottom:20px;">You need to be logged in to view profiles.</p>
        <button onclick="window.location.href='index.html'" class="btn btn-primary" style="padding:12px 32px;"><i class="fas fa-sign-in-alt"></i> Dashboard</button>
      </div>`;
      return;
    }
    currentUser = user;
    container.innerHTML = `<div style="text-align:center;padding:60px;"><i class="fas fa-spinner fa-spin" style="font-size:48px;color:#b71c1c;"></i><p style="margin-top:16px;color:#65676b;">Loading profile...</p></div>`;

    try {
      const userDoc = await db.collection('users').doc(user.uid).get();
      if(!userDoc.exists) { showToast('Profile not found','warning'); return; }
      userProfile = { id:userDoc.id, ...userDoc.data() };

      const params = getUrlParams();
      const targetId = params.id;
      if(targetId && targetId!==user.uid) {
        const tDoc = await db.collection('users').doc(targetId).get();
        if(tDoc.exists) { viewedUserId=targetId; viewedUserProfile={id:tDoc.id,...tDoc.data()}; isOwnProfile=false; }
        else { viewedUserId=user.uid; viewedUserProfile=userProfile; isOwnProfile=true; }
      } else { viewedUserId=user.uid; viewedUserProfile=userProfile; isOwnProfile=true; }

      if(!isOwnProfile && currentUser) {
        const fDoc = await db.collection('follows').where('followerId','==',currentUser.uid).where('followingId','==',viewedUserId).get();
        isFollowing = !fDoc.empty;
      }
      await loadPosts();
      renderProfile();
    } catch(e) {
      console.error(e);
      container.innerHTML = `<div style="text-align:center;padding:60px;background:white;border-radius:16px;"><i class="fas fa-exclamation-triangle" style="font-size:48px;color:#d32f2f;"></i><h3 style="margin-top:16px;">Failed to load</h3><button onclick="location.reload()" class="btn btn-primary" style="margin-top:16px;">Refresh</button></div>`;
    }
  }

  async function loadPosts() {
    try {
      const q = await db.collection('userPosts').where('userId','==',viewedUserId).orderBy('createdAt','desc').get();
      posts = []; q.forEach(d=>posts.push({id:d.id,...d.data()}));
    } catch(e) {
      try {
        const q2 = await db.collection('userPosts').where('userId','==',viewedUserId).get();
        posts = []; q2.forEach(d=>posts.push({id:d.id,...d.data()}));
        posts.sort((a,b)=> (b.createdAt?.toDate?.()||0) - (a.createdAt?.toDate?.()||0));
      } catch(e2) { posts=[]; }
    }
    // enrich
    const enriched=[];
    for(const p of posts) {
      const u = await getUserData(p.userId);
      enriched.push({ ...p, userProfilePic: u?.profilePic || p.userAvatar || null, userGender: u?.gender || p.gender || 'male', userFullName: u?.fullName || p.userName || 'Unknown', userPhone: u?.phoneNumber || p.phoneNumber || null, userBloodGroup: u?.bloodGroup || p.bloodGroup || null, userDistrict: u?.district || p.district || null, isDonor: u?.isDonor || p.isDonor || false });
    }
    posts = enriched;
  }

  function renderProfile() {
    const container=document.getElementById('profileContainer');
    const p=viewedUserProfile;
    if(!p) { container.innerHTML=`<div style="text-align:center;padding:60px;"><i class="fas fa-user-slash" style="font-size:48px;color:#999;"></i><h3>User not found</h3></div>`; return; }
    const avatar=getAvatarUrl(p), cover=p.coverPic||null, displayName=p.fullName||'Unknown', bio=p.bio||'No bio yet';
    const bloodGroup=p.isDonor?`🩸 ${p.bloodGroup||'N/A'}`:'🔍 Donor Seeker';
    const location=p.district?`📍 ${p.district}`:'';
    const totalPosts=posts.length, totalLikes=posts.reduce((s,po)=>s+(po.likes||0),0), totalComments=posts.reduce((s,po)=>s+(po.comments||[]).length,0);

    container.innerHTML = `
      <div class="cover-section">
        ${cover?`<img src="${cover}" alt="Cover" class="cover-image" loading="lazy">`:`<div class="cover-placeholder"><i class="fas fa-camera"></i></div>`}
        ${isOwnProfile?`<button class="cover-upload-btn" onclick="uploadCoverPhoto()"><i class="fas fa-camera"></i> <span>Update Cover</span></button>`:''}
      </div>
      <div class="profile-info-section">
        <div style="display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap;">
          <div>
            <div class="profile-avatar-wrapper">
              ${avatar?`<img src="${avatar}" alt="Profile" class="profile-avatar" loading="lazy">`:`<div class="profile-avatar-placeholder">${displayName.charAt(0).toUpperCase()}</div>`}
              ${isOwnProfile?`<button class="avatar-upload-btn" onclick="uploadAvatar()"><i class="fas fa-camera"></i></button>`:''}
            </div>
            <div class="profile-name">${displayName} ${p.isDonor?`<span style="font-size:14px;background:#b71c1c;color:white;padding:2px 12px;border-radius:30px;font-weight:600;">Donor</span>`:''} ${p.role==='main_admin'?`<span style="font-size:14px;background:#ffd700;color:#1c1e21;padding:2px 12px;border-radius:30px;font-weight:600;">👑 Admin</span>`:''}</div>
            <div class="profile-bio">${bio}</div>
            <div class="profile-meta">
              <span><i class="fas fa-tint"></i> ${bloodGroup}</span>
              ${location?`<span><i class="fas fa-map-marker-alt"></i> ${location}</span>`:''}
              ${p.phoneNumber?`<span><i class="fas fa-phone"></i> ${p.phoneNumber}</span>`:''}
              <span><i class="fas fa-calendar-alt"></i> Joined ${p.createdAt?.toDate?.()?.toLocaleDateString()||'N/A'}</span>
            </div>
          </div>
          <div class="profile-actions" style="border-top:none;padding-top:0;">
            ${!isOwnProfile?`
              <button class="btn ${isFollowing?'btn-following':'btn-follow'}" onclick="toggleFollow()">${isFollowing?'<i class="fas fa-user-check"></i> Following':'<i class="fas fa-user-plus"></i> Follow'}</button>
              <button class="btn btn-message" onclick="goToPrivateDM('${viewedUserId}')"><i class="fas fa-comment"></i> Message</button>
              ${p.phoneNumber?`<button class="btn btn-ghost" onclick="window.location.href='tel:${p.phoneNumber}'"><i class="fas fa-phone"></i></button>`:''}
            `:`<button class="btn btn-ghost" onclick="goToEditProfile()"><i class="fas fa-edit"></i> Edit Profile</button>`}
          </div>
        </div>
        <div class="stats-bar">
          <div class="stat-item"><div class="stat-number">${totalPosts}</div><div class="stat-label">Posts</div></div>
          <div class="stat-item"><div class="stat-number">${totalLikes}</div><div class="stat-label">Likes</div></div>
          <div class="stat-item"><div class="stat-number">${totalComments}</div><div class="stat-label">Comments</div></div>
          <div class="stat-item"><div class="stat-number">${p.followers||0}</div><div class="stat-label">Followers</div></div>
          <div class="stat-item"><div class="stat-number">${p.following||0}</div><div class="stat-label">Following</div></div>
        </div>
      </div>
      ${isOwnProfile?`
        <div class="post-composer">
          <div class="composer-header"><img src="${avatar}" alt="Avatar" class="composer-avatar" loading="lazy"><input class="composer-input" placeholder="What's on your mind?" onclick="openPostModal()" readonly></div>
          <div class="composer-tools"><button class="photo-btn" onclick="openPostModal()"><i class="fas fa-image"></i> <span>Photo</span></button><button class="poll-btn" onclick="openPollModal()"><i class="fas fa-poll"></i> <span>Poll</span></button></div>
        </div>
      `:''}
      <div class="feed" id="feedContainer">${renderPosts()}</div>
    `;
    document.getElementById('modalUserAvatar').src=avatar;
    document.getElementById('modalUserName').textContent=displayName;
  }

  function renderPosts() {
    if(!posts.length) return `<div class="empty-state"><i class="fas fa-newspaper"></i><h3>No posts yet</h3><p>${isOwnProfile?'Share your first post!':'This user has no posts yet.'}</p>${isOwnProfile?`<button class="btn btn-primary" onclick="openPostModal()" style="margin-top:12px;">Create Post</button>`:''}</div>`;
    return posts.map(p=>renderSinglePost(p)).join('');
  }

  function renderSinglePost(p) {
    const isLiked = p.likedBy && p.likedBy.includes(currentUser?.uid);
    const comments = p.comments||[];
    const dispComments = comments.slice(0,3);
    const authorName = p.userFullName || p.userName || 'Unknown';
    const authorAvatar = getAvatarUrl({ profilePic:p.userProfilePic, userAvatar:p.userAvatar, gender:p.userGender });
    const createdAt = p.createdAt?.toDate?.() || new Date();
    const timeAgo = getTimeAgo(createdAt);
    const isDonor = p.isDonor||false;
    const phone = p.userPhone||p.phoneNumber||null;
    const bloodGroup = p.userBloodGroup||p.bloodGroup||null;
    const district = p.userDistrict||p.district||null;
    let pollHTML = '';
    if(p.poll) pollHTML = renderPoll(p);
    let imageHTML = p.imageUrl ? `<img src="${p.imageUrl}" alt="Post image" class="post-image" loading="lazy" onclick="openImageModal('${p.imageUrl}')">` : '';
    return `
      <div class="feed-post" data-post-id="${p.id}">
        <div class="post-header" onclick="goToUserProfile('${p.userId}')">
          <img src="${authorAvatar}" alt="Avatar" class="post-avatar" loading="lazy">
          <div class="post-author">
            <div class="post-author-name">${authorName} ${isDonor?`<span class="badge-donor">🩸 Donor</span>`:''} ${phone?`<button class="contact-donor-btn" onclick="event.stopPropagation(); contactDonor('${p.userId}','${phone}','${authorName}')"><i class="fab fa-whatsapp"></i> Contact</button>`:''}</div>
            <div class="post-time"><span>${timeAgo}</span> <span>·</span> <span>${p.visibility==='private'?'🔒 Only me':p.visibility==='friends'?'👥 Friends':'🌍 Public'}</span> ${district?`<span class="post-location"><i class="fas fa-map-marker-alt"></i> ${district}</span>`:''} ${bloodGroup?`<span class="post-blood">🩸 ${bloodGroup}</span>`:''}</div>
          </div>
          ${isOwnProfile?`<button onclick="deletePost('${p.id}')" style="background:none;border:none;color:#999;cursor:pointer;padding:4px 8px;border-radius:8px;" onmouseenter="this.style.color='#d32f2f';this.style.background='#ffebee';" onmouseleave="this.style.color='#999';this.style.background='transparent';"><i class="fas fa-trash"></i></button>`:''}
        </div>
        ${p.text?`<div class="post-text">${p.text}</div>`:''}
        ${imageHTML}
        ${pollHTML}
        <div class="post-actions">
          <button onclick="likePost('${p.id}')" class="${isLiked?'liked':''}"><i class="fas fa-heart"></i> <span>${p.likes||0}</span></button>
          <button onclick="toggleComments('${p.id}')"><i class="fas fa-comment"></i> <span>${comments.length}</span></button>
          <button onclick="sharePost('${p.id}')"><i class="fas fa-share-alt"></i> <span>Share</span></button>
          ${phone?`<button onclick="contactDonor('${p.userId}','${phone}','${authorName}')" style="color:#25D366;"><i class="fab fa-whatsapp"></i> <span>Contact</span></button>`:''}
        </div>
        <div class="post-comments" id="comments-${p.id}" style="${comments.length?'display:block;':'display:none;'}">
          ${dispComments.map(c=>`
            <div class="post-comment"><img src="${c.avatar||'https://i.ibb.co/WNH98LbN/1000020379.png'}" alt="Avatar" class="comment-avatar" loading="lazy" onclick="goToUserProfile('${c.userId}')"><div class="comment-body"><span class="comment-author" onclick="goToUserProfile('${c.userId}')">${c.userName||'Anonymous'}</span><span class="comment-time">${getTimeAgo(c.createdAt?.toDate?.()||new Date())}</span><div class="comment-text">${c.comment}</div></div></div>
          `).join('')}
          ${comments.length>3?`<div style="text-align:center;padding:4px 0;font-size:13px;color:#65676b;"><button onclick="loadAllComments('${p.id}')" style="background:none;border:none;color:#b71c1c;cursor:pointer;font-weight:600;">View all ${comments.length}</button></div>`:''}
          ${currentUser?`
            <div class="post-comment-input"><input type="text" id="commentInput-${p.id}" placeholder="Write a comment..." onkeypress="if(event.key==='Enter') addComment('${p.id}')"><button onclick="addComment('${p.id}')">Post</button></div>
          `:`<div style="text-align:center;padding:8px;font-size:13px;color:#65676b;"><a href="javascript:void(0)" onclick="goHome()" style="color:#b71c1c;font-weight:600;">Login</a> to comment</div>`}
        </div>
      </div>
    `;
  }

  function renderPoll(p) {
    const poll=p.poll, total=poll.options.reduce((s,o)=>s+(o.votes||0),0);
    const hasVoted=poll.voters&&poll.voters.includes(currentUser?.uid);
    const isMult=poll.multiple||false;
    return `
      <div class="post-poll">
        <div class="poll-question">📊 ${poll.question}</div>
        ${poll.options.map((o,i)=>{ const pct=total?Math.round((o.votes/total)*100):0; const sel=hasVoted&&o.voters&&o.voters.includes(currentUser?.uid); return `<div class="poll-option-result ${sel?'selected':''}" onclick="votePoll('${p.id}',${i})"><div class="poll-bar" style="width:${pct}%;"></div><span class="poll-text">${o.text}</span><span class="poll-percent">${pct}%</span></div>`; }).join('')}
        <div class="poll-total-votes">${total} ${total===1?'vote':'votes'}</div>
        ${!hasVoted&&currentUser?`<div style="text-align:center;margin-top:8px;font-size:13px;color:#65676b;">${isMult?'Select multiple':'Select one'}</div>`:hasVoted?`<div style="text-align:center;margin-top:8px;font-size:13px;color:#2e7d32;"><i class="fas fa-check-circle"></i> You voted</div>`:''}
      </div>
    `;
  }

  // ===== POST CRUD =====
  async function submitPost() {
    const text=document.getElementById('postTextInput').value.trim(), visibility=document.getElementById('postVisibility').value;
    const btn=document.getElementById('postSubmitBtn'); btn.disabled=true; btn.innerHTML='<i class="fas fa-spinner fa-spin"></i> Posting...';
    try {
      let pollData=null;
      if(isPollMode) {
        const opts=document.querySelectorAll('.poll-option');
        const optionTexts=[]; opts.forEach(inp=>{ if(inp.value.trim()) optionTexts.push(inp.value.trim()); });
        if(optionTexts.length<2) { showToast('Add at least 2 poll options','warning'); btn.disabled=false; btn.innerHTML='<i class="fas fa-paper-plane"></i> Post'; return; }
        const multiple=document.getElementById('pollMultiple').checked, duration=parseInt(document.getElementById('pollDuration').value)||7;
        pollData={ question:text||'What do you think?', options:optionTexts.map(t=>({text:t,votes:0,voters:[]})), multiple, duration, voters:[] };
      }
      let imageUrl=null;
      if(selectedImageFile) imageUrl=await uploadImage(selectedImageFile);
      const postData={ userId:currentUser.uid, userName:userProfile?.fullName||'Anonymous', userAvatar:userProfile?.profilePic||null, gender:userProfile?.gender||'male', isDonor:userProfile?.isDonor||false, phoneNumber:userProfile?.phoneNumber||null, bloodGroup:userProfile?.bloodGroup||null, district:userProfile?.district||null, text:text||(pollData?'':''), imageUrl, poll:pollData, visibility:visibility||'public', likes:0, likedBy:[], comments:[], createdAt:firebase.firestore.FieldValue.serverTimestamp() };
      const ref=await db.collection('userPosts').add(postData);
      const newPost={id:ref.id,...postData};
      posts.unshift(newPost);
      closePostModal();
      showToast('Post created! 🎉','success');
      document.getElementById('feedContainer').innerHTML=renderPosts();
      updateStats();
    } catch(e) { showToast('Failed: '+e.message,'error'); } finally { btn.disabled=false; btn.innerHTML='<i class="fas fa-paper-plane"></i> Post'; }
  }

  async function uploadImage(file) {
    const fd=new FormData(); fd.append('image',file);
    const res=await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`,{method:'POST',body:fd});
    const data=await res.json();
    if(data.success) return data.data.url;
    throw new Error(data.error?.message||'Upload failed');
  }

  async function likePost(id) {
    if(!currentUser) return showToast('Login to like','warning');
    try {
      const ref=db.collection('userPosts').doc(id);
      const doc=await ref.get();
      if(!doc.exists) return;
      const data=doc.data(), likedBy=data.likedBy||[];
      const idx=likedBy.indexOf(currentUser.uid);
      if(idx>-1) { await ref.update({ likes:firebase.firestore.FieldValue.increment(-1), likedBy:firebase.firestore.FieldValue.arrayRemove(currentUser.uid) }); }
      else { await ref.update({ likes:firebase.firestore.FieldValue.increment(1), likedBy:firebase.firestore.FieldValue.arrayUnion(currentUser.uid) }); }
      await loadPosts();
      document.getElementById('feedContainer').innerHTML=renderPosts();
    } catch(e) { showToast('Error liking','error'); }
  }

  async function addComment(postId) {
    if(!currentUser) return showToast('Login to comment','warning');
    const input=document.getElementById(`commentInput-${postId}`);
    if(!input) return;
    const txt=input.value.trim();
    if(!txt) return showToast('Write a comment','warning');
    try {
      const comment={ userId:currentUser.uid, userName:userProfile?.fullName||'Anonymous', avatar:userProfile?.profilePic||null, comment:txt, createdAt:new Date().toISOString() };
      await db.collection('userPosts').doc(postId).update({ comments:firebase.firestore.FieldValue.arrayUnion(comment) });
      input.value='';
      await loadPosts();
      document.getElementById('feedContainer').innerHTML=renderPosts();
      showToast('Comment added','success');
    } catch(e) { showToast('Failed to comment','error'); }
  }

  async function deletePost(id) {
    if(!confirm('Delete this post?')) return;
    try { await db.collection('userPosts').doc(id).delete(); posts=posts.filter(p=>p.id!==id); document.getElementById('feedContainer').innerHTML=renderPosts(); updateStats(); showToast('Post deleted','success'); } catch(e) { showToast('Error deleting','error'); }
  }

  async function votePoll(postId, idx) {
    if(!currentUser) return showToast('Login to vote','warning');
    try {
      const ref=db.collection('userPosts').doc(postId);
      const doc=await ref.get();
      if(!doc.exists) return;
      const data=doc.data(), poll=data.poll;
      if(!poll) return;
      if(poll.voters&&poll.voters.includes(currentUser.uid)) return showToast('Already voted','warning');
      const options=poll.options.map((o,i)=>{ if(i===idx) return {...o, votes:(o.votes||0)+1, voters:[...(o.voters||[]), currentUser.uid]}; return o; });
      await ref.update({ poll:{...poll, options, voters:[...(poll.voters||[]), currentUser.uid] } });
      showToast('Vote recorded!','success');
      await loadPosts();
      document.getElementById('feedContainer').innerHTML=renderPosts();
    } catch(e) { showToast('Vote failed','error'); }
  }

  async function toggleFollow() {
    if(!currentUser) return showToast('Login to follow','warning');
    try {
      if(isFollowing) {
        const snap=await db.collection('follows').where('followerId','==',currentUser.uid).where('followingId','==',viewedUserId).get();
        snap.forEach(async d=>await db.collection('follows').doc(d.id).delete());
        await db.collection('users').doc(currentUser.uid).update({ following:firebase.firestore.FieldValue.increment(-1) });
        await db.collection('users').doc(viewedUserId).update({ followers:firebase.firestore.FieldValue.increment(-1) });
        isFollowing=false; showToast('Unfollowed','info');
      } else {
        await db.collection('follows').add({ followerId:currentUser.uid, followingId:viewedUserId, createdAt:firebase.firestore.FieldValue.serverTimestamp() });
        await db.collection('users').doc(currentUser.uid).update({ following:firebase.firestore.FieldValue.increment(1) });
        await db.collection('users').doc(viewedUserId).update({ followers:firebase.firestore.FieldValue.increment(1) });
        isFollowing=true; showToast('Following!','success');
      }
      await loadProfile();
    } catch(e) { showToast('Follow action failed','error'); }
  }

  function contactDonor(userId, phone, name) {
    if(!phone) return showToast('Phone not available','warning');
    if(!currentUser) return showToast('Login to contact','warning');
    let clean=phone.replace(/[^0-9+]/g,'');
    if(!clean.startsWith('+')&&!clean.startsWith('0')) clean='0'+clean;
    if(clean.startsWith('0')&&clean.length===11) clean='+880'+clean.substring(1);
    window.open(`https://wa.me/${clean}?text=Hello%2C%20I%20saw%20your%20post%20on%20Blood%20Donor%20BD%20and%20would%20like%20to%20connect.`,'_blank');
    showToast(`Opening WhatsApp to ${name}...`,'success');
  }

  // ===== UI HELPERS =====
  function openPostModal() { document.getElementById('postModal').classList.add('active'); document.body.style.overflow='hidden'; document.getElementById('postModalTitle').textContent='Create Post'; document.getElementById('postTextInput').value=''; document.getElementById('postCharCount').textContent='0 characters'; document.getElementById('postImagePreview').style.display='none'; document.getElementById('pollOptionsContainer').style.display='none'; isPollMode=false; selectedImageFile=null; }
  function openPollModal() { openPostModal(); document.getElementById('postModalTitle').textContent='Create Poll'; document.getElementById('pollOptionsContainer').style.display='block'; isPollMode=true; }
  function closePostModal() { document.getElementById('postModal').classList.remove('active'); document.body.style.overflow=''; }
  function togglePollMode() { const c=document.getElementById('pollOptionsContainer'); if(c.style.display==='block'){c.style.display='none';isPollMode=false;}else{c.style.display='block';isPollMode=true;} }
  function triggerImageUpload() { document.getElementById('postImageInput').click(); }
  function handlePostImageSelect(e) {
    const file=e.target.files[0]; if(!file) return;
    if(!file.type.startsWith('image/')||file.size>10*1024*1024) return showToast('Invalid image','warning');
    selectedImageFile=file; const preview=document.getElementById('postImagePreview'); document.getElementById('postPreviewImg').src=URL.createObjectURL(file); preview.style.display='block';
  }
  function removePostImage() { selectedImageFile=null; document.getElementById('postImagePreview').style.display='none'; document.getElementById('postImageInput').value=''; }
  function addPollOption() {
    const list=document.getElementById('pollOptionList'), idx=list.children.length;
    const div=document.createElement('div'); div.className='poll-option-input'; div.innerHTML=`<input type="text" placeholder="Option ${idx+1}" class="poll-option" data-index="${idx}"><button class="remove-option" onclick="removePollOption(this)"><i class="fas fa-times"></i></button>`;
    list.appendChild(div);
  }
  function removePollOption(btn) { if(document.getElementById('pollOptionList').children.length<=2) return showToast('Need at least 2 options','warning'); btn.closest('.poll-option-input').remove(); }
  function toggleComments(id) { const el=document.getElementById(`comments-${id}`); if(el) el.style.display=el.style.display==='none'?'block':'none'; }
  function loadAllComments(postId) {
    const p=posts.find(po=>po.id===postId); if(!p) return;
    const comments=p.comments||[];
    if(!comments.length) return showToast('No comments','info');
    const list=comments.map(c=>`<div style="display:flex;gap:10px;padding:8px 0;border-bottom:1px solid #f0f2f5;"><img src="${c.avatar||'https://i.ibb.co/WNH98LbN/1000020379.png'}" style="width:32px;height:32px;border-radius:50%;object-fit:cover;"><div><strong style="font-size:14px;">${c.userName||'Anonymous'}</strong><span style="font-size:11px;color:#65676b;margin-left:8px;">${getTimeAgo(c.createdAt?.toDate?.()||new Date())}</span><div style="font-size:14px;">${c.comment}</div></div></div>`).join('');
    const modal=document.createElement('div'); modal.style.cssText='position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center;z-index:10002;padding:20px;backdrop-filter:blur(4px);';
    modal.innerHTML=`<div style="background:white;border-radius:20px;max-width:500px;width:100%;max-height:80vh;padding:24px;overflow-y:auto;animation:scaleIn 0.3s ease;"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;"><h3 style="font-size:18px;">All Comments (${comments.length})</h3><button onclick="this.closest('div[style]').parentElement.remove()" style="background:#f0f2f5;border:none;width:36px;height:36px;border-radius:50%;font-size:20px;cursor:pointer;"><i class="fas fa-times"></i></button></div>${list}</div>`;
    document.body.appendChild(modal); modal.addEventListener('click',e=>{if(e.target===modal)modal.remove();});
  }
  function sharePost(id) {
    const p=posts.find(po=>po.id===id); if(!p) return;
    const text=`🩸 ${p.text||'Check out this post on Blood Donor BD!'}`;
    const url=`${window.location.origin}/user.profile.html?id=${p.userId}`;
    if(navigator.share) navigator.share({title:'Blood Donor BD Post',text,url}).catch(()=>{});
    else { navigator.clipboard.writeText(`${text}\n\nView profile: ${url}`).then(()=>showToast('Link copied!','success')).catch(()=>prompt('Share:',`${text}\n${url}`)); }
  }
  function goToUserProfile(id) { if(id) window.location.href=`user.profile.html?id=${id}`; }
  function openImageModal(url) {
    const m=document.createElement('div'); m.style.cssText='position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.9);display:flex;align-items:center;justify-content:center;z-index:10003;padding:20px;cursor:pointer;';
    m.innerHTML=`<img src="${url}" style="max-width:95%;max-height:95%;object-fit:contain;border-radius:8px;"><button onclick="this.parentElement.remove()" style="position:absolute;top:20px;right:20px;background:rgba(255,255,255,0.2);border:none;color:white;width:40px;height:40px;border-radius:50%;font-size:20px;cursor:pointer;"><i class="fas fa-times"></i></button>`;
    m.addEventListener('click',e=>{if(e.target===m)m.remove();}); document.body.appendChild(m);
  }
  function uploadAvatar() {
    const inp=document.createElement('input'); inp.type='file'; inp.accept='image/*';
    inp.onchange=async e=>{ const file=e.target.files[0]; if(!file) return; try { showToast('Uploading avatar...','info'); const url=await uploadImage(file); await db.collection('users').doc(currentUser.uid).update({profilePic:url}); showToast('Avatar updated!','success'); await loadProfile(); } catch(e){showToast('Upload failed','error');} };
    inp.click();
  }
  function uploadCoverPhoto() {
    const inp=document.createElement('input'); inp.type='file'; inp.accept='image/*';
    inp.onchange=async e=>{ const file=e.target.files[0]; if(!file) return; try { showToast('Uploading cover...','info'); const url=await uploadImage(file); await db.collection('users').doc(currentUser.uid).update({coverPic:url}); showToast('Cover updated!','success'); await loadProfile(); } catch(e){showToast('Upload failed','error');} };
    inp.click();
  }
  function goToEditProfile() { window.location.href='profile.html'; }
  function updateStats() {
    const totalPosts=posts.length, totalLikes=posts.reduce((s,p)=>s+(p.likes||0),0), totalComments=posts.reduce((s,p)=>s+(p.comments||[]).length,0);
    const items=document.querySelectorAll('.stat-item');
    if(items.length>=3){ items[0].querySelector('.stat-number').textContent=totalPosts; items[1].querySelector('.stat-number').textContent=totalLikes; items[2].querySelector('.stat-number').textContent=totalComments; }
  }

  // ===== INIT =====
  document.addEventListener('DOMContentLoaded', ()=>{
    document.getElementById('postTextInput').addEventListener('input', ()=> document.getElementById('postCharCount').textContent = document.getElementById('postTextInput').value.length+' characters');
    auth.onAuthStateChanged(user=>{ if(user){ currentUser=user; loadProfile(); } else { document.getElementById('profileContainer').innerHTML=`<div style="text-align:center;padding:60px;background:white;border-radius:16px;"><i class="fas fa-user-slash" style="font-size:48px;color:#999;"></i><h3 style="margin-top:16px;">Please Login</h3><button onclick="window.location.href='index.html'" class="btn btn-primary" style="margin-top:16px;padding:12px 32px;">Dashboard</button></div>`; } });
    document.getElementById('postModal').addEventListener('click',e=>{ if(e.target===e.currentTarget) closePostModal(); });
    document.addEventListener('keydown',e=>{ if(e.key==='Escape') closePostModal(); });
  });

  window.goHome=goHome; window.goBack=goBack; window.logout=logout; window.openPostModal=openPostModal; window.openPollModal=openPollModal; window.closePostModal=closePostModal;
  window.togglePollMode=togglePollMode; window.triggerImageUpload=triggerImageUpload; window.handlePostImageSelect=handlePostImageSelect; window.removePostImage=removePostImage;
  window.addPollOption=addPollOption; window.removePollOption=removePollOption; window.submitPost=submitPost; window.likePost=likePost; window.addComment=addComment;
  window.deletePost=deletePost; window.votePoll=votePoll; window.toggleFollow=toggleFollow; window.toggleComments=toggleComments; window.loadAllComments=loadAllComments;
  window.sharePost=sharePost; window.goToUserProfile=goToUserProfile; window.openImageModal=openImageModal; window.contactDonor=contactDonor; window.uploadAvatar=uploadAvatar;
  window.uploadCoverPhoto=uploadCoverPhoto; window.goToPrivateDM=goToPrivateDM; window.goToEditProfile=goToEditProfile; window.showToast=showToast;
</script>
</body>
</html>
