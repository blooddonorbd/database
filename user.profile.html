<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="#b71c1c">
  <meta name="apple-mobile-web-app-title" content="Blood Donor BD">
  <meta name="theme-color" content="#b71c1c">

  <title>Profile · Blood Donor BD</title>
  <link id="dynamicFavicon" rel="icon" type="image/png" href="">
  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">

  <style>
    * { margin:0; padding:0; box-sizing:border-box; }

    :root {
      --bg: #f0f2f5;
      --card: #ffffff;
      --text: #1c1e21;
      --text-muted: #65676b;
      --border: #e4e6eb;
      --border-soft: #f0f2f5;
      --accent: #b71c1c;
      --accent-dark: #8b0000;
      --accent-soft: #ffebee;
      --input-bg: #f0f2f5;
      --shadow: rgba(0,0,0,0.08);
    }
    [data-theme="dark"] {
      --bg: #18191a;
      --card: #242526;
      --text: #e4e6eb;
      --text-muted: #b0b3b8;
      --border: #3a3b3c;
      --border-soft: #3a3b3c;
      --accent: #ef5350;
      --accent-dark: #d32f2f;
      --accent-soft: #3a1f1f;
      --input-bg: #3a3b3c;
      --shadow: rgba(0,0,0,0.4);
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      transition: background 0.2s ease, color 0.2s ease;
    }
    .navbar {
      background: var(--card);
      box-shadow: 0 1px 4px var(--shadow);
      position: sticky;
      top:0;
      z-index:1000;
      padding:0 20px;
    }
    .nav-container { max-width:1200px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; height:64px; }
    .nav-brand { display:flex; align-items:center; gap:10px; font-size:20px; font-weight:700; color:var(--accent); text-decoration:none; cursor:pointer; }
    .nav-brand img { width:40px; height:40px; border-radius:50%; object-fit:cover; }
    .nav-actions { display:flex; align-items:center; gap:8px; }
    .btn { padding:8px 14px; border:none; border-radius:40px; font-weight:600; cursor:pointer; transition:all 0.2s ease; font-size:14px; display:inline-flex; align-items:center; gap:6px; background:var(--border-soft); color:var(--text); }
    .btn-primary { background:var(--accent); color:white; }
    .btn-primary:hover { background:var(--accent-dark); transform:scale(1.02); }
    .btn-outline { background:transparent; border:2px solid var(--accent); color:var(--accent); }
    .btn-outline:hover { background:var(--accent); color:white; }
    .btn-ghost { background:var(--border-soft); color:var(--text); }
    .btn-ghost:hover { background:var(--border); }
    .btn-danger { background:#d32f2f; color:white; }
    .btn-danger:hover { background:var(--accent); }
    .btn:disabled { opacity:0.6; cursor:not-allowed; transform:none !important; }
    .btn-logout { background:transparent; border:1px solid var(--border); color:var(--text-muted); padding:8px 14px; border-radius:40px; cursor:pointer; transition:all 0.2s; font-weight:600; display:flex; align-items:center; gap:6px; }
    .btn-logout:hover { background:var(--accent-soft); border-color:#d32f2f; color:#d32f2f; }
    .theme-toggle { width:40px; height:40px; border-radius:50%; border:1px solid var(--border); background:var(--border-soft); color:var(--text); cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:15px; transition:all 0.2s; }
    .theme-toggle:hover { background:var(--border); }

    /* Profile */
    .profile-container { max-width:820px; margin:20px auto; padding:0 16px; }
    .cover-section { position:relative; background:var(--card); border-radius:16px 16px 0 0; overflow:hidden; height:260px; box-shadow:0 1px 4px var(--shadow); }
    .cover-image { width:100%; height:100%; object-fit:cover; }
    .cover-placeholder { width:100%; height:100%; background:linear-gradient(135deg, var(--accent), #e53935); display:flex; align-items:center; justify-content:center; color:white; font-size:48px; opacity:0.5; }
    .cover-upload-btn { position:absolute; bottom:16px; right:16px; background:rgba(255,255,255,0.92); backdrop-filter:blur(4px); border:none; padding:8px 18px; border-radius:40px; font-weight:600; cursor:pointer; display:flex; align-items:center; gap:8px; box-shadow:0 2px 8px rgba(0,0,0,0.1); font-size:14px; color:#1c1e21; }
    .cover-upload-btn:hover { background:white; transform:scale(1.02); }
    .profile-info-section { background:var(--card); padding:0 24px 20px; border-radius:0 0 16px 16px; box-shadow:0 1px 4px var(--shadow); margin-bottom:16px; }
    .profile-avatar-wrapper { position:relative; margin-top:-56px; margin-bottom:12px; display:inline-block; }
    .profile-avatar { width:112px; height:112px; border-radius:50%; border:4px solid var(--card); object-fit:cover; box-shadow:0 4px 20px rgba(0,0,0,0.12); background:var(--border-soft); }
    .profile-avatar-placeholder { width:112px; height:112px; border-radius:50%; border:4px solid var(--card); background:linear-gradient(135deg, var(--accent), #e53935); display:flex; align-items:center; justify-content:center; color:white; font-size:48px; font-weight:700; box-shadow:0 4px 20px rgba(0,0,0,0.12); }
    .avatar-upload-btn { position:absolute; bottom:4px; right:4px; background:var(--accent); color:white; border:2px solid var(--card); width:34px; height:34px; border-radius:50%; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:0.2s; box-shadow:0 2px 8px rgba(0,0,0,0.2); }
    .avatar-upload-btn:hover { transform:scale(1.1); background:var(--accent-dark); }
    .profile-name { font-size:28px; font-weight:800; color:var(--text); display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
    .profile-bio { color:var(--text-muted); font-size:15px; margin-bottom:12px; word-wrap:break-word; }
    .profile-meta { display:flex; flex-wrap:wrap; gap:16px 24px; color:var(--text-muted); font-size:14px; margin-bottom:12px; }
    .profile-meta span { display:flex; align-items:center; gap:6px; }
    .profile-actions { display:flex; gap:10px; flex-wrap:wrap; border-top:1px solid var(--border); padding-top:16px; align-items:center; }
    .profile-actions .btn { padding:8px 20px; border-radius:40px; font-weight:600; font-size:14px; border:none; cursor:pointer; transition:0.2s; }
    .btn-follow { background:var(--accent); color:white; }
    .btn-follow:hover { background:var(--accent-dark); }
    .btn-following { background:var(--border); color:var(--text); }
    .btn-following:hover { background:var(--border-soft); }
    .btn-message { background:var(--border); color:var(--text); }
    .btn-message:hover { background:var(--border-soft); }
    .more-menu-wrapper { position:relative; margin-left:auto; }
    .more-menu-btn { background:var(--border-soft); border:none; width:36px; height:36px; border-radius:50%; cursor:pointer; color:var(--text); }
    .more-menu-btn:hover { background:var(--border); }
    .more-menu-dropdown { position:absolute; right:0; top:42px; background:var(--card); border-radius:12px; box-shadow:0 4px 20px var(--shadow); min-width:180px; z-index:50; overflow:hidden; display:none; }
    .more-menu-dropdown.open { display:block; }
    .more-menu-dropdown button { width:100%; text-align:left; background:none; border:none; padding:12px 16px; font-size:14px; color:var(--text); cursor:pointer; display:flex; align-items:center; gap:10px; }
    .more-menu-dropdown button:hover { background:var(--border-soft); }
    .more-menu-dropdown button.danger { color:#d32f2f; }
    .stats-bar { display:flex; gap:32px; padding:12px 0; border-top:1px solid var(--border); margin-top:8px; flex-wrap:wrap; }
    .stats-bar .stat-item { text-align:center; cursor:pointer; padding:4px 12px; border-radius:8px; transition:0.2s; }
    .stats-bar .stat-item:hover { background:var(--border-soft); }
    .stats-bar .stat-number { font-weight:700; font-size:20px; color:var(--text); }
    .stats-bar .stat-label { font-size:13px; color:var(--text-muted); }

    .block-banner { background:var(--card); border-radius:16px; padding:40px 24px; text-align:center; box-shadow:0 1px 4px var(--shadow); }
    .block-banner i { font-size:40px; color:#d32f2f; margin-bottom:12px; }

    /* Feed filter */
    .feed-filters { display:flex; gap:8px; margin-bottom:16px; overflow-x:auto; scrollbar-width:none; }
    .feed-filters::-webkit-scrollbar { display:none; }
    .filter-chip { padding:8px 16px; border-radius:40px; border:none; background:var(--card); color:var(--text-muted); font-weight:600; font-size:13px; cursor:pointer; box-shadow:0 1px 3px var(--shadow); white-space:nowrap; transition:0.15s; }
    .filter-chip:hover { background:var(--border-soft); }
    .filter-chip.active { background:var(--accent); color:white; }

    /* Post composer */
    .post-composer { background:var(--card); border-radius:16px; padding:16px 20px; box-shadow:0 1px 4px var(--shadow); margin-bottom:16px; }
    .composer-header { display:flex; gap:12px; align-items:center; margin-bottom:12px; }
    .composer-avatar { width:40px; height:40px; border-radius:50%; object-fit:cover; flex-shrink:0; }
    .composer-input { flex:1; background:var(--input-bg); border:none; padding:10px 16px; border-radius:40px; font-size:15px; cursor:pointer; transition:0.2s; font-family:inherit; color:var(--text); }
    .composer-input:hover { background:var(--border); }
    .composer-tools { display:flex; gap:8px; border-top:1px solid var(--border); padding-top:12px; flex-wrap:wrap; }
    .composer-tools button { background:none; border:none; padding:6px 14px; border-radius:40px; font-weight:600; font-size:14px; cursor:pointer; display:flex; align-items:center; gap:6px; color:var(--text-muted); }
    .composer-tools button:hover { background:var(--border-soft); }
    .photo-btn { color:#45bd62; }
    .poll-btn { color:#f7b928; }

    /* Feed */
    .feed { display:flex; flex-direction:column; gap:16px; }
    .feed-post { background:var(--card); border-radius:16px; padding:16px 20px; box-shadow:0 1px 4px var(--shadow); animation:fadeUp 0.3s ease; }
    @keyframes fadeUp { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:translateY(0); } }
    .post-header { display:flex; gap:12px; margin-bottom:12px; cursor:pointer; align-items:flex-start; }
    .post-avatar { width:40px; height:40px; border-radius:50%; object-fit:cover; flex-shrink:0; border:2px solid var(--accent); }
    .post-author { flex:1; }
    .post-author-name { font-weight:600; font-size:15px; color:var(--text); display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
    .badge-donor { font-size:10px; padding:2px 10px; border-radius:30px; font-weight:700; background:var(--accent); color:white; }
    .contact-donor-btn { background:#25D366; color:white; border:none; padding:2px 12px; border-radius:30px; font-size:11px; font-weight:600; cursor:pointer; transition:0.2s; display:inline-flex; align-items:center; gap:4px; }
    .contact-donor-btn:hover { transform:scale(1.04); }
    .post-time { font-size:12px; color:var(--text-muted); display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
    .post-time .post-location { background:var(--border-soft); padding:0 10px; border-radius:30px; font-size:11px; color:var(--text-muted); }
    .post-time .post-blood { background:var(--accent-soft); padding:0 10px; border-radius:30px; font-size:11px; color:var(--accent); }
    .post-text { font-size:15px; line-height:1.7; color:var(--text); margin-bottom:12px; white-space:pre-wrap; word-break:break-word; }
    .post-image { width:100%; border-radius:12px; margin-bottom:12px; max-height:500px; object-fit:contain; background:var(--border-soft); cursor:pointer; }
    .post-poll { background:var(--border-soft); border-radius:12px; padding:16px; margin-bottom:12px; }
    .post-poll .poll-question { font-weight:600; margin-bottom:12px; }
    .poll-option-result { display:flex; align-items:center; gap:12px; padding:8px 12px; margin-bottom:6px; background:var(--card); border-radius:8px; cursor:pointer; border:2px solid transparent; position:relative; overflow:hidden; transition:0.15s; }
    .poll-option-result:hover { border-color:var(--accent); }
    .poll-option-result .poll-bar { position:absolute; left:0; top:0; height:100%; background:rgba(183,28,28,0.12); transition:width 0.5s ease; border-radius:8px; }
    .poll-option-result .poll-text { position:relative; z-index:1; font-size:14px; flex:1; }
    .poll-option-result .poll-percent { position:relative; z-index:1; font-weight:600; color:var(--accent); }
    .poll-option-result.selected { border-color:var(--accent); background:rgba(183,28,28,0.06); }
    .poll-total-votes { font-size:13px; color:var(--text-muted); margin-top:8px; text-align:center; }
    .post-actions { display:flex; gap:14px; padding-top:12px; border-top:1px solid var(--border); flex-wrap:wrap; align-items:center; }
    .post-actions button { background:none; border:none; display:flex; align-items:center; gap:6px; font-weight:600; color:var(--text-muted); cursor:pointer; padding:4px 8px; border-radius:8px; transition:0.15s; font-size:14px; }
    .post-actions button:hover { background:var(--border-soft); }
    .post-actions .liked { color:var(--accent); }
    .post-actions .liked i { color:var(--accent); }
    .post-actions .saved { color:#f7b928; }
    .post-comments { margin-top:12px; padding-top:12px; border-top:1px solid var(--border); }
    .post-comment { display:flex; gap:10px; margin-bottom:8px; padding:4px 0; }
    .post-comment .comment-avatar { width:28px; height:28px; border-radius:50%; object-fit:cover; flex-shrink:0; cursor:pointer; }
    .post-comment .comment-body { flex:1; background:var(--border-soft); padding:8px 14px; border-radius:20px; position:relative; }
    .post-comment .comment-author { font-weight:600; font-size:13px; cursor:pointer; }
    .post-comment .comment-author:hover { color:var(--accent); }
    .post-comment .comment-text { font-size:14px; color:var(--text); }
    .post-comment .comment-time { font-size:11px; color:var(--text-muted); margin-left:8px; }
    .comment-delete-btn { background:none; border:none; color:var(--text-muted); font-size:11px; cursor:pointer; margin-left:6px; }
    .comment-delete-btn:hover { color:#d32f2f; }
    .post-comment-input { display:flex; gap:10px; margin-top:8px; align-items:center; }
    .post-comment-input input { flex:1; background:var(--input-bg); border:none; padding:8px 14px; border-radius:40px; font-size:14px; font-family:inherit; color:var(--text); }
    .post-comment-input input:focus { outline:none; }
    .post-comment-input button { background:var(--accent); color:white; border:none; padding:8px 18px; border-radius:40px; font-weight:600; cursor:pointer; transition:0.2s; font-size:13px; }
    .post-comment-input button:hover { background:var(--accent-dark); }
    .emoji-row { display:flex; gap:4px; margin-top:6px; }
    .emoji-row button { background:none; border:none; font-size:16px; cursor:pointer; padding:2px 4px; border-radius:6px; }
    .emoji-row button:hover { background:var(--border-soft); }

    .load-more-wrap { text-align:center; padding:8px 0 24px; }
    .load-more-btn { background:var(--card); border:2px solid var(--border); color:var(--text); padding:10px 28px; border-radius:40px; font-weight:600; cursor:pointer; transition:0.2s; }
    .load-more-btn:hover { border-color:var(--accent); color:var(--accent); }

    /* Modals */
    .modal-overlay { position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.6); display:none; align-items:center; justify-content:center; z-index:10001; padding:20px; backdrop-filter:blur(4px); }
    .modal-overlay.active { display:flex; }
    .modal-content { background:var(--card); color:var(--text); border-radius:20px; max-width:560px; width:100%; max-height:90vh; overflow-y:auto; padding:24px; animation:scaleIn 0.25s ease; }
    @keyframes scaleIn { from { transform:scale(0.92); opacity:0; } to { transform:scale(1); opacity:1; } }
    .modal-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; }
    .modal-header h3 { font-size:20px; font-weight:700; }
    .modal-close { background:var(--border-soft); border:none; width:36px; height:36px; border-radius:50%; font-size:20px; cursor:pointer; display:flex; align-items:center; justify-content:center; color:var(--text); }
    .modal-close:hover { background:var(--border); }
    .modal-body textarea { width:100%; min-height:120px; border:none; resize:vertical; font-size:16px; font-family:inherit; padding:8px 0; outline:none; background:transparent; color:var(--text); }
    .modal-body textarea::placeholder { color:var(--text-muted); }
    .image-preview { margin:12px 0; border-radius:12px; overflow:hidden; position:relative; display:none; background:var(--border-soft); max-height:400px; }
    .image-preview img { width:100%; height:auto; max-height:400px; object-fit:contain; }
    .image-preview .remove-image { position:absolute; top:8px; right:8px; background:rgba(0,0,0,0.7); color:white; border:none; width:32px; height:32px; border-radius:50%; cursor:pointer; }
    .modal-footer { display:flex; justify-content:space-between; align-items:center; padding-top:16px; border-top:1px solid var(--border); flex-wrap:wrap; gap:10px; }
    .modal-footer .btn { padding:8px 24px; border-radius:40px; font-weight:600; border:none; cursor:pointer; }
    .btn-post { background:var(--accent); color:white; }
    .btn-post:hover { background:var(--accent-dark); }
    .poll-option-input { display:flex; gap:10px; align-items:center; margin-bottom:8px; }
    .poll-option-input input { flex:1; padding:10px 14px; border:2px solid var(--border); border-radius:12px; font-size:14px; font-family:inherit; background:var(--input-bg); color:var(--text); }
    .poll-option-input input:focus { border-color:var(--accent); outline:none; }
    .remove-option { background:none; border:none; color:#d32f2f; cursor:pointer; font-size:18px; padding:4px; }
    .add-poll-option { background:none; border:none; color:var(--accent); font-weight:600; cursor:pointer; padding:8px 0; font-size:14px; }
    .add-poll-option:hover { text-decoration:underline; }
    .post-actions-admin { display:flex; gap:8px; margin-left:auto; }
    .draft-hint { font-size:11px; color:var(--text-muted); font-style:italic; margin-top:4px; }

    .follow-list-item { display:flex; align-items:center; gap:12px; padding:10px 0; border-bottom:1px solid var(--border-soft); }
    .follow-list-item:last-child { border-bottom:none; }
    .follow-list-item img { width:44px; height:44px; border-radius:50%; object-fit:cover; cursor:pointer; }
    .follow-list-item .fli-name { font-weight:600; font-size:14px; cursor:pointer; }
    .follow-list-item .fli-name:hover { color:var(--accent); }
    .follow-list-item .fli-meta { font-size:12px; color:var(--text-muted); }

    .empty-state { text-align:center; padding:60px 20px; color:var(--text-muted); }
    .empty-state i { font-size:48px; opacity:0.3; margin-bottom:16px; }
    .empty-state h3 { color:var(--text); margin-bottom:8px; }

    .toast-container { position:fixed; top:80px; right:20px; z-index:10002; display:flex; flex-direction:column; gap:8px; max-width:calc(100vw - 40px); }
    .toast { background:var(--card); color:var(--text); padding:14px 16px; border-radius:14px; box-shadow:0 4px 20px var(--shadow); display:flex; align-items:center; gap:12px; animation:slideIn 0.3s ease; max-width:380px; min-width:260px; position:relative; overflow:hidden; }
    .toast .toast-msg { flex:1; font-size:13px; }
    .toast .toast-close { background:none; border:none; color:var(--text-muted); cursor:pointer; font-size:14px; }
    .toast.success { border-left:4px solid #2e7d32; }
    .toast.error { border-left:4px solid #d32f2f; }
    .toast.warning { border-left:4px solid #f57c00; }
    .toast.info { border-left:4px solid var(--accent); }
    .toast .toast-bar { position:absolute; bottom:0; left:0; height:3px; background:currentColor; opacity:0.3; animation:toastTimer 4.5s linear forwards; }
    @keyframes slideIn { from { opacity:0; transform:translateX(30px); } to { opacity:1; transform:translateX(0); } }
    @keyframes toastTimer { from { width:100%; } to { width:0%; } }

    @media (max-width:768px) {
      .cover-section { height:180px; }
      .profile-avatar { width:80px; height:80px; }
      .profile-avatar-placeholder { width:80px; height:80px; font-size:32px; }
      .profile-avatar-wrapper { margin-top:-40px; }
      .profile-name { font-size:22px; }
      .profile-actions .btn { padding:6px 16px; font-size:13px; }
      .stats-bar { gap:16px; }
      .stats-bar .stat-number { font-size:16px; }
      .modal-content { padding:16px; margin:0 8px; }
      .cover-upload-btn { padding:6px 14px; font-size:12px; }
      .cover-upload-btn span { display:none; }
      .composer-tools button span { display:none; }
      .nav-actions .btn span { display:none; }
    }
  </style>
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar">
  <div class="nav-container">
    <a class="nav-brand" onclick="goHome()">
      <img id="navbarLogo" src="" alt="Logo">
      Blood Donor BD
    </a>

<script>
  // ===== FIREBASE =====
  const firebaseConfig = {
    apiKey: "AIzaSyCnky8bzx3KuFoujU5DSlLRYSZgiAF8840",
    authDomain: "blood-donor-bd-2025.firebaseapp.com",

  };
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();
  const IMGBB_API_KEY = '54ffbc26529e5d05fa5cffad23712429';

  // ===== CONSTANTS =====
  const PAGE_SIZE = 6;
  const MAX_POST_LENGTH = 1000;
  const COMMENT_EMOJIS = ['👍','❤️','🩸','🙏','😢','🎉'];

  // ===== STATE =====
  let currentUser = null, userProfile = null, viewedUserId = null, viewedUserProfile = null, isOwnProfile = false;
  let posts = [], selectedImageFile = null, isPollMode = false, isFollowing = false, userCache = {};
  let editingPostId = null;
  let activeFeedFilter = 'all';
  let visibleCount = PAGE_SIZE;

  // ===== THEME =====
  function initTheme() {
    const saved = localStorage.getItem('bdbd_theme') || 'light';
    document.documentElement.setAttribute('data-theme', saved);
    updateThemeIcon(saved);
  }
  function toggleTheme() {
    const cur = document.documentElement.getAttribute('data-theme') || 'light';
    const next = cur === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem('bdbd_theme', next);
    updateThemeIcon(next);
  }
  function updateThemeIcon(theme) {
    const icon = document.getElementById('themeIcon');
    if (icon) icon.className = theme === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
  }
  initTheme();

  // ===== TOAST =====
  function showToast(msg, type='info') {
    const c = document.getElementById('toastContainer');
    const t = document.createElement('div');
    t.className = `toast ${type}`;
    const icon = type==='success'?'fa-check-circle':type==='error'?'fa-exclamation-circle':type==='warning'?'fa-exclamation-triangle':'fa-info-circle';
    t.innerHTML = `<i class="fas ${icon}"></i><span class="toast-msg">${msg}</span><button class="toast-close" onclick="this.parentElement.remove()"><i class="fas fa-times"></i></button><div class="toast-bar"></div>`;
    c.appendChild(t);
    setTimeout(()=>t.remove(), 4500);
  }

  // ===== CONFIRM / GENERIC MODAL =====
  function showConfirmModal({ title='Are you sure?', message='', confirmText='Confirm', danger=false }) {
    return new Promise((resolve) => {
      const overlay = document.createElement('div');
      overlay.className = 'modal-overlay active';
      overlay.style.zIndex = '10005';
      overlay.innerHTML = `
        <div class="modal-content" style="max-width:400px;">
          <h3 style="display:flex;align-items:center;gap:8px;margin-bottom:10px;"><i class="fas fa-exclamation-triangle" style="color:${danger?'#d32f2f':'#f57c00'}"></i> ${title}</h3>
          <p style="font-size:14px;color:var(--text-muted);line-height:1.5;margin-bottom:18px;">${message}</p>
          <div style="display:flex;gap:10px;justify-content:flex-end;">
            <button class="btn btn-ghost" id="gcCancel">Cancel</button>
            <button class="btn ${danger?'btn-danger':'btn-primary'}" id="gcConfirm">${confirmText}</button>
          </div>
        </div>`;
      document.getElementById('modalContainer').appendChild(overlay);
      overlay.querySelector('#gcCancel').onclick = () => { overlay.remove(); resolve(false); };
      overlay.onclick = (e) => { if (e.target === overlay) { overlay.remove(); resolve(false); } };
      overlay.querySelector('#gcConfirm').onclick = () => { overlay.remove(); resolve(true); };
    });
  }

  function openReportModal(postId) {
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay active';
    overlay.style.zIndex = '10005';
    overlay.innerHTML = `
      <div class="modal-content" style="max-width:420px;">
        <h3 style="margin-bottom:10px;"><i class="fas fa-flag" style="color:#f57c00;"></i> Report Post</h3>
        <p style="font-size:13px;color:var(--text-muted);margin-bottom:12px;">Let us know what's wrong. Our team will review it.</p>
        <select id="reportReason" class="poll-option" style="width:100%;padding:10px 14px;border:2px solid var(--border);border-radius:12px;background:var(--input-bg);color:var(--text);margin-bottom:10px;">
          <option value="spam">Spam or misleading</option>
          <option value="inappropriate">Inappropriate content</option>
          <option value="fake_donor">Fake donor information</option>
          <option value="harassment">Harassment or hate speech</option>
          <option value="other">Other</option>
        </select>
        <textarea id="reportDetails" placeholder="Additional details (optional)" style="width:100%;min-height:70px;padding:10px 14px;border:2px solid var(--border);border-radius:12px;background:var(--input-bg);color:var(--text);font-family:inherit;"></textarea>
        <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:14px;">
          <button class="btn btn-ghost" id="reportCancel">Cancel</button>
          <button class="btn btn-danger" id="reportSubmit"><i class="fas fa-flag"></i> Submit Report</button>
        </div>
      </div>`;
    document.getElementById('modalContainer').appendChild(overlay);
    overlay.querySelector('#reportCancel').onclick = () => overlay.remove();
    overlay.onclick = (e) => { if (e.target === overlay) overlay.remove(); };
    overlay.querySelector('#reportSubmit').onclick = async () => {
      const reason = overlay.querySelector('#reportReason').value;
      const details = overlay.querySelector('#reportDetails').value.trim();
      overlay.remove();
      await submitReport(postId, reason, details);
    };
  }

  async function submitReport(postId, reason, details) {
    if (!currentUser) return showToast('Login to report', 'warning');
    try {
      const post = posts.find(p => p.id === postId);
      await db.collection('reports').add({
        postId, reportedUserId: post?.userId || null, reporterId: currentUser.uid,
        reason, details: details || '', status: 'pending',
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });
      showToast('Report submitted. Thank you.', 'success');
    } catch (e) { showToast('Failed to submit report', 'error'); }
  }

  // ===== NAV =====
  function goHome() { window.location.href='index.html'; }
  function goBack() { window.history.back(); }
  async function logout() { try { await auth.signOut(); window.location.href='index.html'; } catch(e) { showToast('Logout failed','error'); } }
  function getUrlParams() { return Object.fromEntries(new URLSearchParams(window.location.search)); }

  function getTimeAgo(date) {
    const diff = Date.now() - date.getTime();
    const s=Math.floor(diff/1000), m=Math.floor(s/60), h=Math.floor(m/60), d=Math.floor(h/24), w=Math.floor(d/7), mo=Math.floor(d/30), y=Math.floor(d/365);
    if(s<60) return 'Just now';
    if(m<60) return m+'m ago';
    if(h<24) return h+'h ago';
    if(d<7) return d+'d ago';
    if(w<4) return w+'w ago';
    if(mo<12) return mo+'mo ago';
    return y+'y ago';
  }
  function getAvatarUrl(u) {
    if(u?.profilePic) return u.profilePic;
    if(u?.userAvatar) return u.userAvatar;
    return u?.gender==='female' ? 'https://i.ibb.co/ZzL8pT3K/1000020380.png' : 'https://i.ibb.co/WNH98LbN/1000020379.png';
  }
  async function getUserData(uid) {
    if(userCache[uid]) return userCache[uid];
    try {
      const doc=await db.collection('users').doc(uid).get();
      if(doc.exists) { userCache[uid]=doc.data(); return doc.data(); }
    } catch(e) {}
    return null;
  }

  function goToPrivateDM(userId) {
    if(!currentUser) return showToast('Please login to send message','warning');
    if(userId===currentUser.uid) return showToast('You cannot message yourself','warning');
    if (isBlockedByMe(userId)) return showToast('Unblock this user first', 'warning');
    window.location.href = `dm.donor.html?userId=${userId}`;
  }

  function isAdmin(user) {
    if (!user) return false;
    const role = user.role || userProfile?.role || '';
    return role === 'main_admin' || role === 'admin';
  }
  function isBlockedByMe(uid) { return (userProfile?.blockedUsers || []).includes(uid); }
  function hasBlockedMe(uid) {
    // true if the *viewed* user has blocked the current user
    return (viewedUserProfile?.blockedUsers || []).includes(currentUser?.uid);
  }
  function isSaved(postId) { return (userProfile?.savedPosts || []).includes(postId); }

  // ===== IMAGE COMPRESSION =====
  function compressImage(file, maxDim = 900, quality = 0.85) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          let { width, height } = img;
          if (width > height && width > maxDim) { height = Math.round(height * (maxDim / width)); width = maxDim; }
          else if (height > maxDim) { width = Math.round(width * (maxDim / height)); height = maxDim; }
          const canvas = document.createElement('canvas');
          canvas.width = width; canvas.height = height;
          canvas.getContext('2d').drawImage(img, 0, 0, width, height);
          canvas.toBlob((blob) => blob ? resolve(blob) : reject(new Error('Compression failed')), 'image/jpeg', quality);
        };
        img.onerror = reject;
        img.src = e.target.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  async function loadWebsiteSettings() {
    try {
      const settingsDoc = await db.collection('settings').doc('website').get();

        const settings = settingsDoc.data();
        if (settings.logoUrl) { const l=document.getElementById('navbarLogo'); if(l) l.src=settings.logoUrl; }

      }
    } catch (e) { console.warn('Could not load website settings:', e); }
  }

  // ===== LOAD PROFILE =====
  async function loadProfile() {
    const container = document.getElementById('profileContainer');
    const user = auth.currentUser;
    if(!user) {
      container.innerHTML = `<div style="text-align:center;padding:60px;background:var(--card);border-radius:16px;">

        <p style="color:var(--text-muted);margin-bottom:20px;">You need to be logged in to view profiles.</p>
        <button onclick="window.location.href='index.html'" class="btn btn-primary" style="padding:12px 32px;"><i class="fas fa-sign-in-alt"></i> Dashboard</button>
      </div>`;
      return;
    }
    currentUser = user;
    container.innerHTML = `<div style="text-align:center;padding:60px;"><i class="fas fa-spinner fa-spin" style="font-size:48px;color:var(--accent);"></i><p style="margin-top:16px;color:var(--text-muted);">Loading profile...</p></div>`;

    try {
      const userDoc = await db.collection('users').doc(user.uid).get();
      if(!userDoc.exists) { showToast('Profile not found','warning'); return; }
      userProfile = { id:userDoc.id, ...userDoc.data() };

      const params = getUrlParams();
      const targetId = params.id;
      if(targetId && targetId!==user.uid) {
        const tDoc = await db.collection('users').doc(targetId).get();
        if(tDoc.exists) { viewedUserId=targetId; viewedUserProfile={id:tDoc.id,...tDoc.data()}; isOwnProfile=false; }
        else { viewedUserId=user.uid; viewedUserProfile=userProfile; isOwnProfile=true; }
      } else { viewedUserId=user.uid; viewedUserProfile=userProfile; isOwnProfile=true; }

      if(!isOwnProfile && currentUser) {
        const fDoc = await db.collection('follows').where('followerId','==',currentUser.uid).where('followingId','==',viewedUserId).get();
        isFollowing = !fDoc.empty;
      }
      activeFeedFilter = 'all';
      visibleCount = PAGE_SIZE;
      await loadPosts();
      renderProfile();
    } catch(e) {
      console.error(e);
      container.innerHTML = `<div style="text-align:center;padding:60px;background:var(--card);border-radius:16px;"><i class="fas fa-exclamation-triangle" style="font-size:48px;color:#d32f2f;"></i><h3 style="margin-top:16px;">Failed to load</h3><button onclick="location.reload()" class="btn btn-primary" style="margin-top:16px;">Refresh</button></div>`;
    }
  }

  async function loadPosts() {
    try {
      const q = await db.collection('userPosts').where('userId','==',viewedUserId).get();
      let raw = []; q.forEach(d=>raw.push({id:d.id,...d.data()}));
      raw.sort((a,b)=> (b.createdAt?.toDate?.()?.getTime()||0) - (a.createdAt?.toDate?.()?.getTime()||0));
      const enriched=[];
      for(const p of raw) {
        const u = await getUserData(p.userId);
        enriched.push({ ...p, userProfilePic: u?.profilePic || p.userAvatar || null, userGender: u?.gender || p.gender || 'male', userFullName: u?.fullName || p.userName || 'Unknown', userPhone: u?.phoneNumber || p.phoneNumber || null, userBloodGroup: u?.bloodGroup || p.bloodGroup || null, userDistrict: u?.district || p.district || null, isDonor: u?.isDonor || p.isDonor || false, userRole: u?.role || p.role || '' });
      }
      posts = enriched;
    } catch(e) { console.error(e); posts=[]; }
  }

  // Visibility-filtered + type-filtered posts (recomputed on each render)
  function getVisiblePosts() {
    let list = posts;
    if (!isOwnProfile) {
      list = list.filter(p => {
        if (p.visibility === 'private') return false;
        if (p.visibility === 'friends') return isFollowing;
        return true; // public or unset
      });
    }
    if (activeFeedFilter === 'photos') list = list.filter(p => !!p.imageUrl);
    else if (activeFeedFilter === 'polls') list = list.filter(p => !!p.poll);
    else if (activeFeedFilter === 'text') list = list.filter(p => !p.imageUrl && !p.poll);
    return list;
  }

    container.innerHTML = `

            <div class="profile-avatar-wrapper">

            <div class="profile-bio">${bio}</div>
            <div class="profile-meta">
              <span><i class="fas fa-tint"></i> ${bloodGroup}</span>
              ${location?`<span><i class="fas fa-map-marker-alt"></i> ${location}</span>`:''}
              ${(p.phoneNumber && (isOwnProfile || p.showPhonePublicly !== false))?`<span><i class="fas fa-phone"></i> ${p.phoneNumber}</span>`:''}

                ${p.phoneNumber?`<button class="btn btn-ghost" onclick="window.location.href='tel:${p.phoneNumber}'"><i class="fas fa-phone"></i></button>`:''}
                <div class="more-menu-wrapper">
                  <button class="more-menu-btn" onclick="toggleMoreMenu(event)"><i class="fas fa-ellipsis-h"></i></button>

                  </div>
                </div>
              `}
            `:`<button class="btn btn-ghost" onclick="goToEditProfile()"><i class="fas fa-edit"></i> Edit Profile</button>`}
          </div>
        </div>
        <div class="stats-bar">

          <div class="stat-item"><div class="stat-number">${totalComments}</div><div class="stat-label">Comments</div></div>
          <div class="stat-item" onclick="showFollowList('followers')"><div class="stat-number">${p.followers||0}</div><div class="stat-label">Followers</div></div>
          <div class="stat-item" onclick="showFollowList('following')"><div class="stat-number">${p.following||0}</div><div class="stat-label">Following</div></div>
        </div>
      </div>

      ${iBlockedThem ? `
        <div class="block-banner"><i class="fas fa-user-slash"></i><h3>You've blocked ${displayName}</h3><p style="color:var(--text-muted);margin-top:6px;">Unblock to see their posts and interact with them again.</p></div>
      ` : `
        ${isOwnProfile?`
          <div class="post-composer">
            <div class="composer-header"><img src="${avatar}" alt="Avatar" class="composer-avatar" loading="lazy"><input class="composer-input" placeholder="What's on your mind?" onclick="openPostModal()" readonly></div>
            <div class="composer-tools"><button class="photo-btn" onclick="openPostModal()"><i class="fas fa-image"></i> <span>Photo</span></button><button class="poll-btn" onclick="openPollModal()"><i class="fas fa-poll"></i> <span>Poll</span></button></div>
          </div>
        `:''}
        <div class="feed-filters">
          <button class="filter-chip ${activeFeedFilter==='all'?'active':''}" onclick="setFeedFilter('all')">All</button>
          <button class="filter-chip ${activeFeedFilter==='photos'?'active':''}" onclick="setFeedFilter('photos')"><i class="fas fa-image"></i> Photos</button>
          <button class="filter-chip ${activeFeedFilter==='polls'?'active':''}" onclick="setFeedFilter('polls')"><i class="fas fa-poll"></i> Polls</button>
          <button class="filter-chip ${activeFeedFilter==='text'?'active':''}" onclick="setFeedFilter('text')"><i class="fas fa-align-left"></i> Text</button>
        </div>
        <div class="feed" id="feedContainer">${renderPosts()}</div>
      `}
    `;
    document.getElementById('modalUserAvatar').src=avatar;
    document.getElementById('modalUserName').textContent=displayName;
  }

  function toggleMoreMenu(e) {
    e.stopPropagation();
    const dd = document.getElementById('moreMenuDropdown');
    if (!dd) return;
    dd.classList.toggle('open');
    const closeOnce = (ev) => { if (!dd.contains(ev.target)) { dd.classList.remove('open'); document.removeEventListener('click', closeOnce); } };
    setTimeout(() => document.addEventListener('click', closeOnce), 0);
  }

  function copyProfileLink() {
    const url = `${window.location.origin}${window.location.pathname}?id=${viewedUserId}`;
    navigator.clipboard.writeText(url).then(()=>showToast('Profile link copied!','success')).catch(()=>showToast(url,'info'));
  }

  async function toggleBlockUser() {
    if (!currentUser) return showToast('Login required', 'warning');
    const blocked = isBlockedByMe(viewedUserId);
    try {
      if (blocked) {
        await db.collection('users').doc(currentUser.uid).update({ blockedUsers: firebase.firestore.FieldValue.arrayRemove(viewedUserId) });
        userProfile.blockedUsers = (userProfile.blockedUsers||[]).filter(id=>id!==viewedUserId);
        showToast('User unblocked', 'success');
      } else {
        const ok = await showConfirmModal({ title:'Block this user?', message:"They won't be able to message or follow you, and you won't see their posts here until you unblock them.", confirmText:'Block', danger:true });
        if (!ok) return;
        await db.collection('users').doc(currentUser.uid).update({ blockedUsers: firebase.firestore.FieldValue.arrayUnion(viewedUserId) });
        userProfile.blockedUsers = [...(userProfile.blockedUsers||[]), viewedUserId];
        showToast('User blocked', 'success');
      }
      renderProfile();
    } catch (e) { showToast('Action failed', 'error'); }
  }

  function setFeedFilter(filter) {
    activeFeedFilter = filter;
    visibleCount = PAGE_SIZE;
    document.querySelectorAll('.filter-chip').forEach(c => c.classList.toggle('active', c.textContent.trim().toLowerCase().startsWith(filter==='all'?'all':filter.slice(0,-1)) || (filter==='all' && c.textContent.trim()==='All')));
    document.getElementById('feedContainer').innerHTML = renderPosts();
  }

  function renderPosts() {
    const visible = getVisiblePosts();
    if(!visible.length) return `<div class="empty-state"><i class="fas fa-newspaper"></i><h3>No posts yet</h3><p>${isOwnProfile?'Share your first post!':'This user has no posts to show.'}</p>${isOwnProfile?`<button class="btn btn-primary" onclick="openPostModal()" style="margin-top:12px;">Create Post</button>`:''}</div>`;
    const slice = visible.slice(0, visibleCount);
    const html = slice.map(p=>renderSinglePost(p)).join('');
    const hasMore = visible.length > visibleCount;
    return html + (hasMore ? `<div class="load-more-wrap"><button class="load-more-btn" onclick="loadMorePosts()"><i class="fas fa-chevron-down"></i> Load more posts</button></div>` : '');
  }

  function loadMorePosts() {
    visibleCount += PAGE_SIZE;
    document.getElementById('feedContainer').innerHTML = renderPosts();
  }

  function renderSinglePost(p) {
    const isLiked = p.likedBy && p.likedBy.includes(currentUser?.uid);
    const saved = isSaved(p.id);
    const comments = p.comments||[];
    const dispComments = comments.slice(0,3);
    const authorName = p.userFullName || p.userName || 'Unknown';
    const authorAvatar = getAvatarUrl({ profilePic:p.userProfilePic, userAvatar:p.userAvatar, gender:p.userGender });
    const createdAt = p.createdAt?.toDate?.() || new Date();
    const timeAgo = getTimeAgo(createdAt);
    const isDonor = p.isDonor||false;
    const phone = p.userPhone||p.phoneNumber||null;
    const bloodGroup = p.userBloodGroup||p.bloodGroup||null;
    const district = p.userDistrict||p.district||null;
    const canEditDelete = isOwnProfile || isAdmin(userProfile);
    let pollHTML = p.poll ? renderPoll(p) : '';
    let imageHTML = p.imageUrl ? `<img src="${p.imageUrl}" alt="Post image" class="post-image" loading="lazy" onclick="openImageModal('${p.imageUrl}')">` : '';
    return `
      <div class="feed-post" data-post-id="${p.id}">
        <div class="post-header" onclick="goToUserProfile('${p.userId}')">
          <img src="${authorAvatar}" alt="Avatar" class="post-avatar" loading="lazy">
          <div class="post-author">
            <div class="post-author-name">${authorName} ${isDonor?`<span class="badge-donor">🩸 Donor</span>`:''} ${phone?`<button class="contact-donor-btn" onclick="event.stopPropagation(); contactDonor('${p.userId}','${phone}','${authorName}')"><i class="fab fa-whatsapp"></i> Contact</button>`:''}</div>
            <div class="post-time"><span>${timeAgo}</span> <span>·</span> <span>${p.visibility==='private'?'🔒 Only me':p.visibility==='friends'?'👥 Friends':'🌍 Public'}</span> ${district?`<span class="post-location"><i class="fas fa-map-marker-alt"></i> ${district}</span>`:''} ${bloodGroup?`<span class="post-blood">🩸 ${bloodGroup}</span>`:''}</div>
          </div>
          <div class="post-actions-admin">
            ${canEditDelete ? `
              <button onclick="event.stopPropagation(); openEditPostModal('${p.id}')" style="background:none;border:none;color:var(--text-muted);cursor:pointer;padding:4px 8px;border-radius:8px;"><i class="fas fa-edit"></i></button>
              <button onclick="event.stopPropagation(); deletePost('${p.id}')" style="background:none;border:none;color:var(--text-muted);cursor:pointer;padding:4px 8px;border-radius:8px;"><i class="fas fa-trash"></i></button>
            ` : `
              <button onclick="event.stopPropagation(); openReportModal('${p.id}')" style="background:none;border:none;color:var(--text-muted);cursor:pointer;padding:4px 8px;border-radius:8px;" title="Report post"><i class="fas fa-flag"></i></button>
            `}
          </div>
        </div>
        ${p.text?`<div class="post-text">${p.text}</div>`:''}
        ${imageHTML}
        ${pollHTML}
        <div class="post-actions">
          <button onclick="likePost('${p.id}')" class="${isLiked?'liked':''}"><i class="fas fa-heart"></i> <span>${p.likes||0}</span></button>
          <button onclick="toggleComments('${p.id}')"><i class="fas fa-comment"></i> <span>${comments.length}</span></button>
          <button onclick="toggleSavePost('${p.id}')" class="${saved?'saved':''}"><i class="fa${saved?'s':'r'} fa-bookmark"></i> <span>${saved?'Saved':'Save'}</span></button>
          <button onclick="sharePost('${p.id}')"><i class="fas fa-share-alt"></i> <span>Share</span></button>
          ${phone?`<button onclick="contactDonor('${p.userId}','${phone}','${authorName}')" style="color:#25D366;"><i class="fab fa-whatsapp"></i> <span>Contact</span></button>`:''}
        </div>
        <div class="post-comments" id="comments-${p.id}" style="${comments.length?'display:block;':'display:none;'}">
          ${dispComments.map(c=>`
            <div class="post-comment"><img src="${c.avatar||'https://i.ibb.co/WNH98LbN/1000020379.png'}" alt="Avatar" class="comment-avatar" loading="lazy" onclick="goToUserProfile('${c.userId}')"><div class="comment-body"><span class="comment-author" onclick="goToUserProfile('${c.userId}')">${c.userName||'Anonymous'}</span><span class="comment-time">${getTimeAgo(c.createdAt?.toDate?.()?c.createdAt.toDate():new Date(c.createdAt||Date.now()))}</span>${(currentUser && (c.userId===currentUser.uid || isOwnProfile || isAdmin(userProfile))) ? `<button class="comment-delete-btn" onclick="deleteComment('${p.id}','${c.id||''}')">Delete</button>` : ''}<div class="comment-text">${c.comment}</div></div></div>
          `).join('')}
          ${comments.length>3?`<div style="text-align:center;padding:4px 0;font-size:13px;color:var(--text-muted);"><button onclick="loadAllComments('${p.id}')" style="background:none;border:none;color:var(--accent);cursor:pointer;font-weight:600;">View all ${comments.length}</button></div>`:''}
          ${currentUser?`
            <div class="post-comment-input"><input type="text" id="commentInput-${p.id}" placeholder="Write a comment..." onkeypress="if(event.key==='Enter') addComment('${p.id}')"><button onclick="addComment('${p.id}')">Post</button></div>
            <div class="emoji-row">${COMMENT_EMOJIS.map(em=>`<button onclick="insertEmoji('${p.id}','${em}')">${em}</button>`).join('')}</div>
          `:`<div style="text-align:center;padding:8px;font-size:13px;color:var(--text-muted);"><a href="javascript:void(0)" onclick="goHome()" style="color:var(--accent);font-weight:600;">Login</a> to comment</div>`}
        </div>
      </div>
    `;
  }

  function insertEmoji(postId, emoji) {
    const input = document.getElementById(`commentInput-${postId}`);
    if (input) { input.value += emoji; input.focus(); }
  }

  function renderPoll(p) {
    const poll=p.poll, total=poll.options.reduce((s,o)=>s+(o.votes||0),0);
    const hasVoted=poll.voters&&poll.voters.includes(currentUser?.uid);
    const isMult=poll.multiple||false;
    return `
      <div class="post-poll">
        <div class="poll-question">📊 ${poll.question}</div>
        ${poll.options.map((o,i)=>{ const pct=total?Math.round((o.votes/total)*100):0; const sel=hasVoted&&o.voters&&o.voters.includes(currentUser?.uid); return `<div class="poll-option-result ${sel?'selected':''}" onclick="votePoll('${p.id}',${i})"><div class="poll-bar" style="width:${pct}%;"></div><span class="poll-text">${o.text}</span><span class="poll-percent">${pct}%</span></div>`; }).join('')}
        <div class="poll-total-votes">${total} ${total===1?'vote':'votes'}</div>
        ${!hasVoted&&currentUser?`<div style="text-align:center;margin-top:8px;font-size:13px;color:var(--text-muted);">${isMult?'Select multiple':'Select one'}</div>`:hasVoted?`<div style="text-align:center;margin-top:8px;font-size:13px;color:#2e7d32;"><i class="fas fa-check-circle"></i> You voted</div>`:''}
      </div>
    `;
  }

  // ===== POST CRUD =====
  async function submitPost() {
    const text=document.getElementById('postTextInput').value.trim(), visibility=document.getElementById('postVisibility').value;
    if (text.length > MAX_POST_LENGTH) return showToast(`Post must be under ${MAX_POST_LENGTH} characters`, 'warning');
    const btn=document.getElementById('postSubmitBtn'); btn.disabled=true; btn.innerHTML='<i class="fas fa-spinner fa-spin"></i> ' + (editingPostId ? 'Updating...' : 'Posting...');
    try {
      let pollData=null;
      if(isPollMode) {
        const opts=document.querySelectorAll('.poll-option');
        const optionTexts=[]; opts.forEach(inp=>{ if(inp.value.trim()) optionTexts.push(inp.value.trim()); });
        if(optionTexts.length<2) { showToast('Add at least 2 poll options','warning'); btn.disabled=false; btn.innerHTML='<i class="fas fa-paper-plane"></i> ' + (editingPostId ? 'Update' : 'Post'); return; }
        const multiple=document.getElementById('pollMultiple').checked, duration=parseInt(document.getElementById('pollDuration').value)||7;
        pollData={ question:text||'What do you think?', options:optionTexts.map(t=>({text:t,votes:0,voters:[]})), multiple, duration, voters:[] };
      }
      let imageUrl=null;
      if(selectedImageFile) {
        showToast('Optimizing image...', 'info');
        const compressed = await compressImage(selectedImageFile);
        imageUrl = await uploadImage(compressed);
      }

      if (editingPostId) {
        const updateData = { text: text || '', visibility };
        if (imageUrl) updateData.imageUrl = imageUrl;
        if (pollData) updateData.poll = pollData;
        else if (document.getElementById('pollOptionsContainer').style.display === 'none') updateData.poll = null;
        await db.collection('userPosts').doc(editingPostId).update(updateData);
        showToast('Post updated! ✅','success');
        editingPostId = null;
      } else {
        const postData={ userId:currentUser.uid, userName:userProfile?.fullName||'Anonymous', userAvatar:userProfile?.profilePic||null, gender:userProfile?.gender||'male', isDonor:userProfile?.isDonor||false, phoneNumber:userProfile?.phoneNumber||null, bloodGroup:userProfile?.bloodGroup||null, district:userProfile?.district||null, text:text||'', imageUrl, poll:pollData, visibility:visibility||'public', likes:0, likedBy:[], comments:[], createdAt:firebase.firestore.FieldValue.serverTimestamp() };
        const ref=await db.collection('userPosts').add(postData);
        posts.unshift({id:ref.id,...postData});
        clearDraft();
        showToast('Post created! 🎉','success');
      }
      closePostModal();
      await loadPosts();
      visibleCount = PAGE_SIZE;
      document.getElementById('feedContainer').innerHTML=renderPosts();
    } catch(e) {
      showToast('Failed: '+e.message,'error');
      console.error(e);
    } finally {
      btn.disabled=false;
      btn.innerHTML='<i class="fas fa-paper-plane"></i> ' + (editingPostId ? 'Update' : 'Post');
    }
  }

  async function uploadImage(fileOrBlob) {
    const fd=new FormData(); fd.append('image',fileOrBlob);
    const res=await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`,{method:'POST',body:fd});
    const data=await res.json();
    if(data.success) return data.data.url;
    throw new Error(data.error?.message||'Upload failed');
  }

  async function likePost(id) {
    if(!currentUser) return showToast('Login to like','warning');
    try {
      const ref=db.collection('userPosts').doc(id);
      const doc=await ref.get();
      if(!doc.exists) return;
      const data=doc.data(), likedBy=data.likedBy||[];
      const idx=likedBy.indexOf(currentUser.uid);
      if(idx>-1) await ref.update({ likes:firebase.firestore.FieldValue.increment(-1), likedBy:firebase.firestore.FieldValue.arrayRemove(currentUser.uid) });
      else await ref.update({ likes:firebase.firestore.FieldValue.increment(1), likedBy:firebase.firestore.FieldValue.arrayUnion(currentUser.uid) });
      await loadPosts();
      document.getElementById('feedContainer').innerHTML=renderPosts();
    } catch(e) { showToast('Error liking','error'); }
  }

  async function toggleSavePost(postId) {
    if(!currentUser) return showToast('Login to save posts','warning');
    try {
      const saved = isSaved(postId);
      const ref = db.collection('users').doc(currentUser.uid);
      if (saved) {
        await ref.update({ savedPosts: firebase.firestore.FieldValue.arrayRemove(postId) });
        userProfile.savedPosts = (userProfile.savedPosts||[]).filter(id=>id!==postId);
        showToast('Removed from saved', 'info');
      } else {
        await ref.update({ savedPosts: firebase.firestore.FieldValue.arrayUnion(postId) });
        userProfile.savedPosts = [...(userProfile.savedPosts||[]), postId];
        showToast('Post saved', 'success');
      }
      document.getElementById('feedContainer').innerHTML = renderPosts();
    } catch(e) { showToast('Failed to save post', 'error'); }
  }

  async function addComment(postId) {
    if(!currentUser) return showToast('Login to comment','warning');
    const input=document.getElementById(`commentInput-${postId}`);
    if(!input) return;
    const txt=input.value.trim();
    if(!txt) return showToast('Write a comment','warning');
    try {
      const commentId = (crypto?.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random().toString(36).slice(2)}`);
      const comment={ id:commentId, userId:currentUser.uid, userName:userProfile?.fullName||'Anonymous', avatar:userProfile?.profilePic||null, comment:txt, createdAt:new Date().toISOString() };
      await db.collection('userPosts').doc(postId).update({ comments:firebase.firestore.FieldValue.arrayUnion(comment) });
      input.value='';
      await loadPosts();
      document.getElementById('feedContainer').innerHTML=renderPosts();
      showToast('Comment added','success');
    } catch(e) { showToast('Failed to comment','error'); }
  }

  async function deleteComment(postId, commentId) {
    if (!currentUser) return;
    const ok = await showConfirmModal({ title:'Delete comment?', message:'This cannot be undone.', confirmText:'Delete', danger:true });
    if (!ok) return;
    try {
      const ref = db.collection('userPosts').doc(postId);
      const doc = await ref.get();
      if (!doc.exists) return;
      const comments = (doc.data().comments || []).filter(c => (c.id || '') !== commentId);
      await ref.update({ comments });
      await loadPosts();
      document.getElementById('feedContainer').innerHTML=renderPosts();
      showToast('Comment deleted', 'success');
    } catch(e) { showToast('Failed to delete comment', 'error'); }
  }

  async function deletePost(id) {
    const ok = await showConfirmModal({ title:'Delete this post?', message:'This action cannot be undone.', confirmText:'Delete', danger:true });
    if (!ok) return;
    try {
      await db.collection('userPosts').doc(id).delete();
      posts=posts.filter(p=>p.id!==id);
      document.getElementById('feedContainer').innerHTML=renderPosts();
      showToast('Post deleted','success');
    } catch(e) { showToast('Error deleting','error'); }
  }

  // ===== EDIT POST =====
  function openEditPostModal(postId) {
    const post = posts.find(p => p.id === postId);
    if (!post) return showToast('Post not found','error');

    editingPostId = postId;
    document.getElementById('postModalTitle').textContent = 'Edit Post';
    document.getElementById('postTextInput').value = post.text || '';
    document.getElementById('postVisibility').value = post.visibility || 'public';
    document.getElementById('postCharCount').textContent = (post.text || '').length + ' / ' + MAX_POST_LENGTH;
    document.getElementById('draftHint').style.display = 'none';

    if (post.imageUrl) {
      document.getElementById('postPreviewImg').src = post.imageUrl;
      document.getElementById('postImagePreview').style.display = 'block';
    } else {
      document.getElementById('postImagePreview').style.display = 'none';
      selectedImageFile = null;
    }

    if (post.poll && post.poll.options && post.poll.options.length >= 2) {
      isPollMode = true;
      document.getElementById('pollOptionsContainer').style.display = 'block';
      const list = document.getElementById('pollOptionList');
      list.innerHTML = '';
      post.poll.options.forEach((opt, idx) => {
        const div = document.createElement('div');
        div.className = 'poll-option-input';
        div.innerHTML = `<input type="text" placeholder="Option ${idx+1}" class="poll-option" data-index="${idx}" value="${opt.text}"><button class="remove-option" onclick="removePollOption(this)" ${idx < 2 ? 'style="display:none;"' : ''}><i class="fas fa-times"></i></button>`;
        list.appendChild(div);
      });
      document.getElementById('pollMultiple').checked = post.poll.multiple || false;
      document.getElementById('pollDuration').value = post.poll.duration || 7;
    } else {
      isPollMode = false;
      document.getElementById('pollOptionsContainer').style.display = 'none';
    }

    document.getElementById('postSubmitBtn').innerHTML = '<i class="fas fa-paper-plane"></i> Update';
    document.getElementById('postModal').classList.add('active');
    document.body.style.overflow = 'hidden';
  }

  // ===== POLL VOTING =====
  async function votePoll(postId, idx) {
    if(!currentUser) return showToast('Login to vote','warning');
    try {
      const ref=db.collection('userPosts').doc(postId);
      const doc=await ref.get();
      if(!doc.exists) return;
      const data=doc.data(), poll=data.poll;
      if(!poll) return;
      if(poll.voters&&poll.voters.includes(currentUser.uid)) return showToast('Already voted','warning');
      const options=poll.options.map((o,i)=>{ if(i===idx) return {...o, votes:(o.votes||0)+1, voters:[...(o.voters||[]), currentUser.uid]}; return o; });
      await ref.update({ poll:{...poll, options, voters:[...(poll.voters||[]), currentUser.uid] } });
      showToast('Vote recorded!','success');
      await loadPosts();
      document.getElementById('feedContainer').innerHTML=renderPosts();
    } catch(e) { showToast('Vote failed','error'); }
  }

  async function toggleFollow() {
    if(!currentUser) return showToast('Login to follow','warning');
    if (isBlockedByMe(viewedUserId)) return showToast('Unblock this user first', 'warning');
    try {
      if(isFollowing) {
        const snap=await db.collection('follows').where('followerId','==',currentUser.uid).where('followingId','==',viewedUserId).get();
        for (const d of snap.docs) await db.collection('follows').doc(d.id).delete();
        await db.collection('users').doc(currentUser.uid).update({ following:firebase.firestore.FieldValue.increment(-1) });
        await db.collection('users').doc(viewedUserId).update({ followers:firebase.firestore.FieldValue.increment(-1) });
        isFollowing=false; showToast('Unfollowed','info');
      } else {
        await db.collection('follows').add({ followerId:currentUser.uid, followingId:viewedUserId, createdAt:firebase.firestore.FieldValue.serverTimestamp() });
        await db.collection('users').doc(currentUser.uid).update({ following:firebase.firestore.FieldValue.increment(1) });
        await db.collection('users').doc(viewedUserId).update({ followers:firebase.firestore.FieldValue.increment(1) });
        isFollowing=true; showToast('Following!','success');
      }
      await loadProfile();
    } catch(e) { showToast('Follow action failed','error'); }
  }

  // ===== FOLLOWERS / FOLLOWING LIST =====
  async function showFollowList(type) {
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay active';
    overlay.style.zIndex = '10005';
    overlay.innerHTML = `
      <div class="modal-content" style="max-width:420px;">
        <div class="modal-header"><h3>${type==='followers'?'Followers':'Following'}</h3><button class="modal-close" onclick="this.closest('.modal-overlay').remove()"><i class="fas fa-times"></i></button></div>
        <div id="followListBody"><div style="text-align:center;padding:30px;"><i class="fas fa-spinner fa-spin" style="font-size:28px;color:var(--accent);"></i></div></div>
      </div>`;
    document.getElementById('modalContainer').appendChild(overlay);
    overlay.onclick = (e) => { if (e.target === overlay) overlay.remove(); };

    try {
      const field = type === 'followers' ? 'followingId' : 'followerId';
      const otherField = type === 'followers' ? 'followerId' : 'followingId';
      const snap = await db.collection('follows').where(field, '==', viewedUserId).get();
      const ids = snap.docs.map(d => d.data()[otherField]);
      const body = overlay.querySelector('#followListBody');
      if (!ids.length) { body.innerHTML = `<div class="empty-state" style="padding:30px;"><i class="fas fa-users"></i><h3>No ${type} yet</h3></div>`; return; }
      const users = await Promise.all(ids.map(id => getUserData(id).then(u => ({ id, ...(u||{}) }))));
      body.innerHTML = users.map(u => `
        <div class="follow-list-item">
          <img src="${getAvatarUrl(u)}" onclick="goToUserProfile('${u.id}'); this.closest('.modal-overlay').remove();">
          <div style="flex:1;">
            <div class="fli-name" onclick="goToUserProfile('${u.id}'); this.closest('.modal-overlay')?.remove?.();">${u.fullName || 'Unknown'}</div>
            <div class="fli-meta">${u.isDonor ? `🩸 ${u.bloodGroup||''}` : 'Donor seeker'} ${u.district?`· ${u.district}`:''}</div>
          </div>
        </div>
      `).join('');
    } catch (e) {
      overlay.querySelector('#followListBody').innerHTML = `<div class="empty-state" style="padding:30px;"><h3>Could not load list</h3></div>`;
    }
  }

  function contactDonor(userId, phone, name) {
    if(!phone) return showToast('Phone not available','warning');
    if(!currentUser) return showToast('Login to contact','warning');
    if (isBlockedByMe(userId)) return showToast('Unblock this user first', 'warning');
    let clean=phone.replace(/[^0-9+]/g,'');
    if(!clean.startsWith('+')&&!clean.startsWith('0')) clean='0'+clean;
    if(clean.startsWith('0')&&clean.length===11) clean='+880'+clean.substring(1);
    window.open(`https://wa.me/${clean}?text=Hello%2C%20I%20saw%20your%20post%20on%20Blood%20Donor%20BD%20and%20would%20like%20to%20connect.`,'_blank');
    showToast(`Opening WhatsApp to ${name}...`,'success');
  }

  // ===== DRAFT AUTOSAVE (new posts only) =====
  function draftKey() { return currentUser ? `bdbd_post_draft_${currentUser.uid}` : null; }
  function saveDraft() {
    if (editingPostId) return;
    const key = draftKey(); if (!key) return;
    const text = document.getElementById('postTextInput').value;
    if (text.trim()) { localStorage.setItem(key, text); document.getElementById('draftHint').style.display = 'block'; }
    else { localStorage.removeItem(key); document.getElementById('draftHint').style.display = 'none'; }
  }
  function restoreDraft() {
    const key = draftKey(); if (!key) return;
    const draft = localStorage.getItem(key);
    if (draft) { document.getElementById('postTextInput').value = draft; document.getElementById('postCharCount').textContent = draft.length + ' / ' + MAX_POST_LENGTH; document.getElementById('draftHint').style.display = 'block'; }
  }
  function clearDraft() { const key = draftKey(); if (key) localStorage.removeItem(key); }

  // ===== UI HELPERS =====
  function openPostModal() {
    editingPostId = null;
    document.getElementById('postModalTitle').textContent = 'Create Post';
    document.getElementById('postTextInput').value = '';
    document.getElementById('postCharCount').textContent = '0 / ' + MAX_POST_LENGTH;
    document.getElementById('postImagePreview').style.display = 'none';
    document.getElementById('pollOptionsContainer').style.display = 'none';
    document.getElementById('draftHint').style.display = 'none';
    isPollMode = false;
    selectedImageFile = null;
    document.getElementById('postSubmitBtn').innerHTML = '<i class="fas fa-paper-plane"></i> Post';
    document.getElementById('postModal').classList.add('active');
    document.body.style.overflow = 'hidden';
    restoreDraft();
  }
  function openPollModal() { openPostModal(); document.getElementById('postModalTitle').textContent = 'Create Poll'; document.getElementById('pollOptionsContainer').style.display = 'block'; isPollMode=true; }
  function closePostModal() { document.getElementById('postModal').classList.remove('active'); document.body.style.overflow = ''; editingPostId = null; }
  function togglePollMode() { const c=document.getElementById('pollOptionsContainer'); if(c.style.display==='block'){c.style.display='none';isPollMode=false;}else{c.style.display='block';isPollMode=true;} }
  function triggerImageUpload() { document.getElementById('postImageInput').click(); }
  function handlePostImageSelect(e) {
    const file=e.target.files[0]; if(!file) return;
    if(!file.type.startsWith('image/')||file.size>10*1024*1024) return showToast('Invalid image','warning');
    selectedImageFile=file; const preview=document.getElementById('postImagePreview'); document.getElementById('postPreviewImg').src=URL.createObjectURL(file); preview.style.display='block';
  }
  function removePostImage() { selectedImageFile=null; document.getElementById('postImagePreview').style.display='none'; document.getElementById('postImageInput').value=''; }
  function addPollOption() {
    const list=document.getElementById('pollOptionList'), idx=list.children.length;
    const div=document.createElement('div'); div.className='poll-option-input'; div.innerHTML=`<input type="text" placeholder="Option ${idx+1}" class="poll-option" data-index="${idx}"><button class="remove-option" onclick="removePollOption(this)"><i class="fas fa-times"></i></button>`;
    list.appendChild(div);
  }
  function removePollOption(btn) { if(document.getElementById('pollOptionList').children.length<=2) return showToast('Need at least 2 options','warning'); btn.closest('.poll-option-input').remove(); }
  function toggleComments(id) { const el=document.getElementById(`comments-${id}`); if(el) el.style.display=el.style.display==='none'?'block':'none'; }
  function loadAllComments(postId) {
    const p=posts.find(po=>po.id===postId); if(!p) return;
    const comments=p.comments||[];
    if(!comments.length) return showToast('No comments','info');
    const list=comments.map(c=>`<div style="display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--border-soft);"><img src="${c.avatar||'https://i.ibb.co/WNH98LbN/1000020379.png'}" style="width:32px;height:32px;border-radius:50%;object-fit:cover;"><div><strong style="font-size:14px;">${c.userName||'Anonymous'}</strong><span style="font-size:11px;color:var(--text-muted);margin-left:8px;">${getTimeAgo(c.createdAt?.toDate?.()?c.createdAt.toDate():new Date(c.createdAt||Date.now()))}</span><div style="font-size:14px;">${c.comment}</div></div></div>`).join('');
    const modal=document.createElement('div'); modal.className='modal-overlay active'; modal.style.zIndex='10004';
    modal.innerHTML=`<div class="modal-content" style="max-width:500px;"><div class="modal-header"><h3>All Comments (${comments.length})</h3><button class="modal-close" onclick="this.closest('.modal-overlay').remove()"><i class="fas fa-times"></i></button></div>${list}</div>`;
    document.body.appendChild(modal); modal.addEventListener('click',e=>{if(e.target===modal)modal.remove();});
  }
  function sharePost(id) {
    const p=posts.find(po=>po.id===id); if(!p) return;
    const text=`🩸 ${p.text||'Check out this post on Blood Donor BD!'}`;
    const url=`${window.location.origin}/user.profile.html?id=${p.userId}`;
    if(navigator.share) navigator.share({title:'Blood Donor BD Post',text,url}).catch(()=>{});
    else navigator.clipboard.writeText(`${text}\n\nView profile: ${url}`).then(()=>showToast('Link copied!','success')).catch(()=>prompt('Share:',`${text}\n${url}`));
  }
  function goToUserProfile(id) { if(id) window.location.href=`user.profile.html?id=${id}`; }
  function openImageModal(url) {
    const m=document.createElement('div'); m.style.cssText='position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.9);display:flex;align-items:center;justify-content:center;z-index:10003;padding:20px;cursor:pointer;';
    m.innerHTML=`<img src="${url}" style="max-width:95%;max-height:95%;object-fit:contain;border-radius:8px;"><button onclick="this.parentElement.remove()" style="position:absolute;top:20px;right:20px;background:rgba(255,255,255,0.2);border:none;color:white;width:40px;height:40px;border-radius:50%;font-size:20px;cursor:pointer;"><i class="fas fa-times"></i></button>`;
    m.addEventListener('click',e=>{if(e.target===m)m.remove();}); document.body.appendChild(m);
  }
  function uploadAvatar() {
    const inp=document.createElement('input'); inp.type='file'; inp.accept='image/*';
    inp.onchange=async e=>{ const file=e.target.files[0]; if(!file) return; try { showToast('Optimizing & uploading avatar...','info'); const compressed=await compressImage(file, 500); const url=await uploadImage(compressed); await db.collection('users').doc(currentUser.uid).update({profilePic:url}); showToast('Avatar updated!','success'); await loadProfile(); } catch(e){showToast('Upload failed','error');} };
    inp.click();
  }
  function uploadCoverPhoto() {
    const inp=document.createElement('input'); inp.type='file'; inp.accept='image/*';
    inp.onchange=async e=>{ const file=e.target.files[0]; if(!file) return; try { showToast('Optimizing & uploading cover...','info'); const compressed=await compressImage(file, 1200); const url=await uploadImage(compressed); await db.collection('users').doc(currentUser.uid).update({coverPic:url}); showToast('Cover updated!','success'); await loadProfile(); } catch(e){showToast('Upload failed','error');} };
    inp.click();
  }
  function goToEditProfile() { window.location.href='profile.html'; }

  // ===== INIT =====
  document.addEventListener('DOMContentLoaded', ()=>{
    const textInput = document.getElementById('postTextInput');
    textInput.addEventListener('input', ()=>{
      const len = textInput.value.length;
      document.getElementById('postCharCount').textContent = `${len} / ${MAX_POST_LENGTH}`;
      document.getElementById('postCharCount').style.color = len > MAX_POST_LENGTH ? '#d32f2f' : 'var(--text-muted)';
      saveDraft();
    });
    textInput.addEventListener('keydown', (e) => { if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') submitPost(); });

    auth.onAuthStateChanged(async (user) => {
      await loadWebsiteSettings();
      if(user){ currentUser=user; loadProfile(); }
      else { document.getElementById('profileContainer').innerHTML=`<div style="text-align:center;padding:60px;background:var(--card);border-radius:16px;"><i class="fas fa-user-slash" style="font-size:48px;color:#999;"></i><h3 style="margin-top:16px;">Please Login</h3><button onclick="window.location.href='index.html'" class="btn btn-primary" style="margin-top:16px;padding:12px 32px;">Dashboard</button></div>`; }
    });

    document.getElementById('postModal').addEventListener('click',e=>{ if(e.target===e.currentTarget) closePostModal(); });
    document.addEventListener('keydown',e=>{ if(e.key==='Escape') closePostModal(); });
  });

  window.goHome=goHome; window.goBack=goBack; window.logout=logout; window.toggleTheme=toggleTheme;
  window.openPostModal=openPostModal; window.openPollModal=openPollModal; window.closePostModal=closePostModal;
  window.togglePollMode=togglePollMode; window.triggerImageUpload=triggerImageUpload; window.handlePostImageSelect=handlePostImageSelect; window.removePostImage=removePostImage;
  window.addPollOption=addPollOption; window.removePollOption=removePollOption; window.submitPost=submitPost; window.likePost=likePost; window.addComment=addComment;
  window.deleteComment=deleteComment; window.deletePost=deletePost; window.votePoll=votePoll; window.toggleFollow=toggleFollow; window.toggleComments=toggleComments; window.loadAllComments=loadAllComments;
  window.sharePost=sharePost; window.goToUserProfile=goToUserProfile; window.openImageModal=openImageModal; window.contactDonor=contactDonor; window.uploadAvatar=uploadAvatar;
  window.uploadCoverPhoto=uploadCoverPhoto; window.goToPrivateDM=goToPrivateDM; window.goToEditProfile=goToEditProfile; window.showToast=showToast;
  window.openEditPostModal=openEditPostModal; window.setFeedFilter=setFeedFilter; window.loadMorePosts=loadMorePosts; window.toggleSavePost=toggleSavePost;
  window.insertEmoji=insertEmoji; window.showFollowList=showFollowList; window.toggleMoreMenu=toggleMoreMenu; window.copyProfileLink=copyProfileLink; window.toggleBlockUser=toggleBlockUser;
  window.openReportModal=openReportModal;
</script>
</body>
</html>
