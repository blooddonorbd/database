<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
    <title>Verify Donor ID · Blood Donor BD</title>
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <!-- html2canvas for PNG download -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Poppins', sans-serif;
            background: #f0f2f5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            max-width: 820px;
            width: 100%;
        }
        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #b71c1c;
            text-decoration: none;
            font-weight: 500;
            transition: 0.2s;
        }
        .back-link:hover { text-decoration: underline; }

        /* ID Card wrapper — exactly the card that will be captured */
        #idCardWrapper {
            display: flex;
            justify-content: center;
            width: 100%;
        }
        /* ID Card — fixed ratio ~ ID-1 (3.375” x 2.125” ≈ 1.588:1) */
        .id-card {
            background: white;
            border-radius: 28px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
            overflow: hidden;
            border: 1px solid rgba(183, 28, 28, 0.12);
            width: 100%;
            max-width: 600px;        /* base width for decent resolution */
            aspect-ratio: 1.588 / 1; /* ID-1 ratio ~ 3.375 x 2.125 inch */
            display: flex;
            flex-direction: column;
            transition: all 0.2s;
        }
        .id-card-header {
            background: linear-gradient(135deg, #b71c1c, #d32f2f);
            padding: 14px 22px;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            flex-shrink: 0;
        }
        .id-card-header .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .id-card-header .brand img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.3);
            object-fit: cover;
        }
        .id-card-header .brand h1 {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: -0.3px;
        }
        .id-card-header .status-badge {
            background: white;
            padding: 4px 16px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 600;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255,255,255,0.2);
            color: green;
        }

        .id-card-body {
            padding: 14px 22px 10px 22px;
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 18px;
            flex: 1;
            min-height: 0;
        }
        /* left column: avatar + name */
        .id-card-left {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .donor-avatar-large {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #b71c1c;
            box-shadow: 0 6px 18px rgba(183, 28, 28, 0.25);
            background: #fff;
        }
        .donor-name {
            font-size: 22px;
            font-weight: 700;
            color: #1a1a1a;
            line-height: 1.2;
            margin-top: 4px;
            text-align: center;
        }
        .donor-role {
            font-size: 12px;
            color: #555;
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .donor-role .badge-admin {
            background: #ffd700;
            color: #222;
            font-weight: 700;
            padding: 0 12px;
            border-radius: 20px;
            font-size: 10px;
        }

        /* right column: details grid + blood group */
        .id-card-right {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 6px;
            min-width: 0;
        }
        .blood-group-badge {
            background: #b71c1c;
            color: white;
            font-size: 26px;
            font-weight: 800;
            padding: 2px 18px;
            border-radius: 40px;
            display: inline-block;
            box-shadow: 0 4px 12px rgba(183, 28, 28, 0.3);
            text-align: center;
            align-self: flex-start;
            letter-spacing: 0.5px;
            line-height: 1.3;
        }
        .details-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px 14px;
            width: 100%;
        }
        .detail-item {
            display: flex;
            flex-direction: column;
        }
        .detail-item .label {
            font-size: 9px;
            text-transform: uppercase;
            color: #888;
            letter-spacing: 0.4px;
            font-weight: 600;
        }
        .detail-item .value {
            font-size: 13px;
            font-weight: 600;
            color: #1a1a1a;
            line-height: 1.3;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .id-card-footer {
            background: #fafafa;
            padding: 8px 22px;
            border-top: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px;
            flex-shrink: 0;
            font-size: 12px;
        }
        .id-card-footer .donor-id strong {
            color: #1a1a1a;
            font-weight: 700;
        }
        .id-card-footer .verified-stamp {
            color: #2e7d32;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
        }

        /* Not found / loading states */
        .not-found, .loading-spinner {
            background: white;
            border-radius: 24px;
            padding: 40px 24px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.08);
        }
        .not-found i { font-size: 48px; color: #ddd; margin-bottom: 12px; }
        .not-found h2 { color: #333; margin-bottom: 4px; }
        .not-found p { color: #999; }
        .loading-spinner .spinner {
            width: 44px;
            height: 44px;
            border: 4px solid #f0f0f0;
            border-top-color: #b71c1c;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .btn-primary {
            display: inline-block;
            margin-top: 16px;
            padding: 10px 28px;
            background: #b71c1c;
            color: white;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            border: none;
            cursor: pointer;
            font-size: 14px;
        }
        .btn-primary i { margin-right: 8px; }

        /* Download button row */
        .download-row {
            margin-top: 20px;
            display: flex;
            justify-content: center;
            gap: 16px;
            flex-wrap: wrap;
        }
        .btn-download {
            background: #1a1a1a;
            color: white;
            border: none;
            padding: 12px 32px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 6px 18px rgba(0,0,0,0.15);
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }
        .btn-download:hover { background: #2d2d2d; transform: scale(1.02); }
        .btn-download i { font-size: 18px; }

        @media (max-width: 640px) {
            .id-card {
                max-width: 100%;
                aspect-ratio: 1.588 / 1;
            }
            .id-card-body {
                padding: 10px 14px 6px 14px;
                gap: 10px;
            }
            .donor-avatar-large { width: 60px; height: 60px; border-width: 3px; }
            .donor-name { font-size: 17px; }
            .blood-group-badge { font-size: 20px; padding: 0 14px; }
            .detail-item .value { font-size: 11px; }
            .id-card-header .brand h1 { font-size: 15px; }
            .id-card-header { padding: 10px 16px; }
            .id-card-footer { padding: 6px 16px; font-size: 10px; }
            .details-grid { gap: 4px 10px; }
        }
        @media (max-width: 460px) {
            .donor-avatar-large { width: 48px; height: 48px; }
            .donor-name { font-size: 14px; }
            .blood-group-badge { font-size: 17px; padding: 0 10px; }
            .detail-item .value { font-size: 10px; }
            .id-card-header .brand h1 { font-size: 13px; }
            .id-card-header .brand img { width: 30px; height: 30px; }
        }
    </style>
</head>
<body>

<div class="container" id="appContainer">
    <a href="#" class="back-link" onclick="window.history.back(); return false;">
        <i class="fas fa-arrow-left"></i> Back
    </a>

    <!-- ID card wrapper (capture target) -->
    <div id="idCardWrapper">
        <div id="cardContent" style="width:100%; display:flex; justify-content:center;">
            <!-- Rendered by JavaScript -->
            <div class="loading-spinner" style="width:100%;">
                <div class="spinner"></div>
                <p style="margin-top: 16px; color: #999; font-weight: 500;">Verifying Donor ID...</p>
            </div>
        </div>
    </div>

    <!-- Download button (hidden until card ready) -->
    <div id="downloadRow" class="download-row" style="display:none;">
        <button class="btn-download" id="downloadPngBtn">
            <i class="fas fa-download"></i> Download as PNG
        </button>
    </div>
</div>

<script>
    // ============================================
    // FIREBASE CONFIG
    // ============================================
    const firebaseConfig = {
        apiKey: "AIzaSyCnky8bzx3KuFoujU5DSlLRYSZgiAF8840",
        authDomain: "blood-donor-bd-2025.firebaseapp.com",
        projectId: "blood-donor-bd-2025",
        storageBucket: "blood-donor-bd-2025.firebasestorage.app",
        messagingSenderId: "271945142840",
        appId: "1:271945142840:web:b0edefddb55cac5f604ccd",
        measurementId: "G-28KGSJREBR"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // ============================================
    // HELPERS
    // ============================================
    function getDonorIdFromURL() {
        const params = new URLSearchParams(window.location.search);
        return params.get('id');
    }

    // ============================================
    // RENDER DONOR ID CARD (with ratio preserved)
    // ============================================
    function renderDonorCard(donor) {
        const container = document.getElementById('cardContent');
        const downloadRow = document.getElementById('downloadRow');

        if (!donor) {
            container.innerHTML = `
                <div class="not-found" style="width:100%;">
                    <i class="fas fa-id-card"></i>
                    <h2>Donor Not Found</h2>
                    <p>The Donor ID you entered is invalid or does not exist.</p>
                    <a href="verifydonorid.input.html" class="btn-primary">
                        <i class="fas fa-search"></i> Try Again
                    </a>
                </div>
            `;
            downloadRow.style.display = 'none';
            return;
        }

        const isAdmin = donor.role === 'main_admin' || donor.role === 'admin' || donor.role === 'moderator';
        const roleLabel = isAdmin ? (donor.role === 'main_admin' ? '👑 Administrator' : donor.role === 'admin' ? '🛡️ Admin' : '🔰 Moderator') : 'Blood Donor';

        let avatarUrl = donor.profilePic || null;
        if (!avatarUrl) {
            avatarUrl = donor.gender === 'female'
                ? 'https://i.ibb.co/ZzL8pT3K/1000020380.png'
                : 'https://i.ibb.co/WNH98LbN/1000020379.png';
        }

        const memberSince = donor.createdAt?.toDate?.()?.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' }) || 'N/A';
        const donorIdDisplay = donor.donorId || donor.id || 'N/A';

        container.innerHTML = `
            <div class="id-card" id="donorIdCard">
                <!-- Header -->
                <div class="id-card-header">
                    <div class="brand">
                        <img src="https://i.ibb.co/RTdtn0RG/1000018751.png" alt="Blood Donor BD" />
                        <h1>Blood Donor BD</h1>
                    </div>
                    <span class="status-badge">
                        <i class="fas fa-check-circle"></i> Verified
                    </span>
                </div>

                <!-- Body -->
                <div class="id-card-body">
                    <div class="id-card-left">
                        <img class="donor-avatar-large" src="${avatarUrl}" alt="${donor.fullName || 'Donor'}"
                             onerror="this.src='${donor.gender === 'female' ? 'https://i.ibb.co/ZzL8pT3K/1000020380.png' : 'https://i.ibb.co/WNH98LbN/1000020379.png'}'" />
                        <div class="donor-name">${donor.fullName || 'Donor'}</div>
                        <div class="donor-role">
                            ${roleLabel}
                            ${isAdmin ? `<span class="badge-admin">${donor.role === 'main_admin' ? '⭐' : '●'} Staff</span>` : ''}
                        </div>
                    </div>

                    <div class="id-card-right">
                        <div class="blood-group-badge">${donor.bloodGroup || 'N/A'}</div>
                        <div class="details-grid">
                            <div class="detail-item">
                                <span class="label">Donor ID</span>
                                <span class="value">${donorIdDisplay}</span>
                            </div>
                            <div class="detail-item">
                                <span class="label">Blood Group</span>
                                <span class="value">${donor.bloodGroup || 'N/A'}</span>
                            </div>
                            <div class="detail-item">
                                <span class="label">Location</span>
                                <span class="value">${donor.upazila || ''}${donor.upazila && donor.district ? ', ' : ''}${donor.district || 'N/A'}</span>
                            </div>
                            <div class="detail-item">
                                <span class="label">Member Since</span>
                                <span class="value">${memberSince}</span>
                            </div>
                            ${donor.isDonor ? `
                            <div class="detail-item">
                                <span class="label">Donations</span>
                                <span class="value">${donor.totalDonations || 0}</span>
                            </div>
                            <div class="detail-item">
                                <span class="label">Units</span>
                                <span class="value">${donor.totalUnitsDonated || 0}</span>
                            </div>
                            ` : ''}
                        </div>
                    </div>
                </div>

                <!-- Footer -->
                <div class="id-card-footer">
                    <div class="donor-id"><strong>ID:</strong> ${donorIdDisplay}</div>
                    <div class="verified-stamp"><i class="fas fa-shield-alt"></i> Verified by Blood Donor BD</div>
                </div>
            </div>
        `;

        // Show download button
        downloadRow.style.display = 'flex';
    }

    // ============================================
    // VERIFY DONOR ID
    // ============================================
    async function verifyDonorId(donorId) {
        const container = document.getElementById('cardContent');
        const downloadRow = document.getElementById('downloadRow');

        if (!donorId) {
            container.innerHTML = `
                <div class="not-found" style="width:100%;">
                    <i class="fas fa-exclamation-triangle"></i>
                    <h2>No ID Provided</h2>
                    <p>Please provide a Donor ID to verify.</p>
                    <a href="verifydonorid.input.html" class="btn-primary">
                        <i class="fas fa-search"></i> Go to Search
                    </a>
                </div>
            `;
            downloadRow.style.display = 'none';
            return;
        }

        try {
            let querySnapshot = await db.collection('users')
                .where('donorId', '==', donorId)
                .where('approvalStatus', '==', 'approved')
                .get();

            let donorData = null;
            let docId = null;

            if (!querySnapshot.empty) {
                const doc = querySnapshot.docs[0];
                donorData = doc.data();
                docId = doc.id;
            } else {
                const docRef = await db.collection('users').doc(donorId).get();
                if (docRef.exists && docRef.data().approvalStatus === 'approved') {
                    donorData = docRef.data();
                    docId = donorId;
                }
            }

            if (donorData) {
                donorData.id = docId;
                if (!donorData.donorId) donorData.donorId = docId;
                renderDonorCard(donorData);
            } else {
                renderDonorCard(null);
            }
        } catch (error) {
            console.error('Verification error:', error);
            container.innerHTML = `
                <div class="not-found" style="width:100%;">
                    <i class="fas fa-exclamation-circle" style="color:#d32f2f;"></i>
                    <h2>Verification Error</h2>
                    <p>${error.message || 'Could not verify the donor ID. Please try again.'}</p>
                    <a href="verifydonorid.input.html" class="btn-primary">
                        <i class="fas fa-search"></i> Try Again
                    </a>
                </div>
            `;
            downloadRow.style.display = 'none';
        }
    }

    // ============================================
    // DOWNLOAD PNG (ID card ratio preserved)
    // ============================================
    async function downloadCardAsPNG() {
        const cardElement = document.getElementById('donorIdCard');
        if (!cardElement) {
            alert('No ID card to download.');
            return;
        }

        // Show loading state on button
        const btn = document.getElementById('downloadPngBtn');
        const originalText = btn.innerHTML;
        btn.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> Generating...';
        btn.disabled = true;

        try {
            // Use higher scale for crisp output
            const canvas = await html2canvas(cardElement, {
                scale: 3.5,
                useCORS: true,
                allowTaint: true,
                backgroundColor: '#ffffff',
                logging: false,
                width: cardElement.scrollWidth,
                height: cardElement.scrollHeight,
            });

            // Create download link
            const link = document.createElement('a');
            link.download = `BloodDonor_${cardElement.querySelector('.donor-name')?.innerText?.trim() || 'ID'}_${new Date().toISOString().slice(0,10)}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();

        } catch (err) {
            console.error('Download error:', err);
            alert('Could not generate PNG. Please try again.');
        } finally {
            btn.innerHTML = originalText;
            btn.disabled = false;
        }
    }

    // ============================================
    // INIT
    // ============================================
    const donorId = getDonorIdFromURL();
    verifyDonorId(donorId);

    // Attach download event (delegated)
    document.addEventListener('click', function(e) {
        if (e.target && e.target.id === 'downloadPngBtn') {
            downloadCardAsPNG();
        }
    });
</script>

</body>
</html>
